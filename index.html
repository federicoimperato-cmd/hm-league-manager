<html lang="it">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HM League Manager</title>

  <style>
    body{
      margin:0;
      background:#071018;
      color:white;
      font-family:Arial;
      display:flex;

      height:100vh;
      text-align:center;

    .box{

    }

    p{
      color:#94a3b8;
    }

<body>

  <div class="box">
    <h1>HM League Manager</h1>
    <p>Setup GitHub completato correttamente.</p>

</html>
