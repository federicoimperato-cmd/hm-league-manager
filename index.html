function initBracket(c){
  const p=[...(c.participants||[])];
  while(p.length<16) p.push("");
  c.bracket=[
    {round:"Ottavi",matches:Array.from({length:8},(_,i)=>({a:p[i*2]||"",b:p[i*2+1]||"",sa:"",sb:"",winner:""}))},
    {round:"Quarti",matches:Array.from({length:4},()=>({a:"",b:"",sa:"",sb:"",winner:""}))},
    {round:"Semifinali",matches:Array.from({length:2},()=>({a:"",b:"",sa:"",sb:"",winner:""}))},
    {round:"Finale",matches:Array.from({length:1},()=>({a:"",b:"",sa:"",sb:"",winner:""}))}
  ];
}

function updateBracket(compId,ri,mi,field,value){
  const c=competitionsManager.competitions.find(x=>x.id===compId);
  c.bracket[ri].matches[mi][field]=value;saveAll();
}

function advanceBracket(compId,ri,mi,side){
  const c=competitionsManager.competitions.find(x=>x.id===compId);
  const match=c.bracket[ri].matches[mi];
  const winner=side==="a"?match.a:match.b;
  match.winner=winner;
  if(c.bracket[ri+1]){
    const nextMatch=c.bracket[ri+1].matches[Math.floor(mi/2)];
    if(mi%2===0) nextMatch.a=winner; else nextMatch.b=winner;
  }
  saveAll();renderCompetitionManager();
}

function addCompetition(){
  const name=prompt("Nome competizione","Nuova Competizione"); if(!name) return;
  const type=prompt("Tipo: league / manual / bracket / final","manual") || "manual";
  const id="COMP"+Date.now();
  competitionsManager.competitions.push({id,name,type,description:"",participants:[],standings:[],matches:[],bracket:[],final:{teamA:"",teamB:"",scoreA:"",scoreB:"",winner:""}});
  competitionsManager.selected=id;
  saveAll();renderCompetitionManager();
}

function editCompetitionSettings(id){
  const c=competitionsManager.competitions.find(x=>x.id===id);
  const name=prompt("Nome competizione",c.name); if(!name) return;
  const type=prompt("Tipo: league / manual / bracket / final",c.type) || c.type;
  const description=prompt("Descrizione",c.description||"") || "";
  c.name=name;c.type=type;c.description=description;
  if(type==="league" || type==="manual") initLeagueStandings(c);
  if(type==="bracket" && (!c.bracket || !c.bracket.length)) initBracket(c);

}

function deleteCompetition(id){
  if(!confirm("Eliminare competizione?")) return;
  competitionsManager.competitions=competitionsManager.competitions.filter(c=>c.id!==id);
  competitionsManager.selected=competitionsManager.competitions[0]?.id||"HML";
  saveAll();renderCompetitionManager();
}

function renderCompetitions(){
  const awards=[...new Set(honors.map(h=>h.award))];

function addGeneralHonor(){
  const award=prompt("Competizione/trofeo","HM League"); 
  if(!award) return;
  const season=prompt("Stagione","2025/2026") || "";
  const teamCode=prompt("Sigla squadra esistente, oppure lascia vuoto se vuoi inserire un nome manuale","IMP") || "";
  let manualTeam="";
  let finalTeam=teamCode.toUpperCase();

  if(!finalTeam || !team(finalTeam)){
    manualTeam=prompt("Nome squadra vincitrice manuale/storica","") || "";
    finalTeam="";
  }

  honors.push({team:finalTeam,manualTeam,award,season});
  saveAll(); 
  renderCompetitions();
}
function editGeneralHonor(award,localIndex){
  const list=honors.map((x,i)=>({...x,_i:i})).filter(x=>x.award===award);
  const row=list[localIndex]; 
  if(!row) return;
  const season=prompt("Stagione",row.season) || "";
  const teamCode=prompt("Sigla squadra esistente, oppure lascia vuoto per nome manuale",row.team||"") || "";
  let manualTeam=row.manualTeam||"";
  let finalTeam=teamCode.toUpperCase();

  if(!finalTeam || !team(finalTeam)){
    manualTeam=prompt("Nome squadra vincitrice manuale/storica",manualTeam) || "";
    finalTeam="";
  }

  honors[row._i]={team:finalTeam,manualTeam,award,season};
  saveAll(); 
  renderCompetitions();
}

function deleteGeneralHonor(award,localIndex){
  const list=honors.map((x,i)=>({...x,_i:i})).filter(x=>x.award===award);
  const row=list[localIndex]; 
  if(!row) return;
  if(!confirm("Eliminare questa voce dall'Albo d'Oro?")) return;
  honors.splice(row._i,1);
  saveAll();
  renderCompetitions();
}

/* ===== MODULI RIPRISTINATI: Ranking, Storico, Asta, Azioni Presidente ===== */

function trophiesCount(code){
  return (honors||[]).filter(h=>h.team===code).length;
}

function ensureRanking(){
  if(!Array.isArray(rankingData)) rankingData=[];
  if(!Array.isArray(rankingHidden)) rankingHidden=[];
  teams.filter(t=>t.code!=="SVIN" && !rankingHidden.includes(t.code)).forEach(t=>{
    if(!rankingData.find(r=>r.code===t.code)){
      rankingData.push({code:t.code,points:0,manualOrder:""});
    }
  });
}

function renderRanking(){
  if(!Array.isArray(rankingData)) rankingData=[];
  rankingData = cleanRankingRows(rankingData);
  // In sola lettura non deve partire ensureRanking(), perché è una funzione admin
  // e generava l'alert continuo "Solo Federico admin può modificare".
  if(typeof isAdmin === "function" && isAdmin()) ensureRanking();
  rankingData = cleanRankingRows(rankingData);
  const rows = rankingData
    .filter(r=>r.code && teamExistsStrict(r.code) && r.code!=="SVIN" && !rankingHidden.includes(r.code))
    .map(r=>({...r,trophies:trophiesCount(r.code)}))
    .sort((a,b)=>{
      const ma = a.manualOrder==="" ? 9999 : Number(a.manualOrder);
      const mb = b.manualOrder==="" ? 9999 : Number(b.manualOrder);
      if(ma!==9999 || mb!==9999) return ma-mb;
      return Number(b.points||0)-Number(a.points||0);
    });

  q("view-ranking").innerHTML = `
    <div class="between">
      <div><h2>Ranking società</h2><p class="muted">Classifica ordinata per punti. I trofei vengono presi automaticamente dall'Albo d'oro.</p></div>
      <div class="row"><button class="btn primary" onclick="addTeam()">Aggiungi società</button><button class="btn" onclick="addRankingRow()">Aggiungi al ranking</button></div>
    </div>
    <table class="table" style="margin-top:14px">
      <tr><th>#</th><th>Società</th><th>Punti</th><th>Trofei</th><th>Ordine manuale</th><th>Azioni</th></tr>
      ${rows.map((r,i)=>{
        const t=team(r.code);
        return `<tr>
          <td><b>${i+1}</b></td>
          <td><div class="row">${logo(r.code,42)}<div><b>${esc(t.name)}</b><div class="muted">${r.code} · ${esc(t.division)}</div></div></div></td>
          <td><input class="input" style="width:90px" value="${esc(r.points||0)}" onchange="updateRanking('${r.code}','points',this.value)"></td>
          <td><b>${r.trophies}</b></td>
          <td><input class="input" style="width:90px" placeholder="auto" value="${esc(r.manualOrder||"")}" onchange="updateRanking('${r.code}','manualOrder',this.value)"></td>
          <td><button class="btn" onclick="editTeam('${r.code}')">Modifica società</button><button class="btn red" onclick="removeRanking('${r.code}')">Togli ranking</button></td>
        </tr>`;
      }).join("")}
    </table>`;
}

function updateRanking(code,field,value){
  ensureRanking();
  const row=rankingData.find(r=>r.code===code);
  if(row){row[field]=value;saveAll();renderRanking();}
}
function removeRanking(code){
  if(!confirm("Togliere questa società dal ranking?")) return;
  if(!rankingHidden.includes(code)) rankingHidden.push(code);
  rankingData=rankingData.filter(r=>r.code!==code);
  saveAll();renderRanking();
}
function addRankingRow(){
  const code=(prompt("Sigla società da inserire nel ranking","IMP")||"").toUpperCase();
  if(!code || !teamExistsStrict(code)){alert("Sigla non trovata");return;}
  rankingHidden=rankingHidden.filter(x=>x!==code);
  if(!rankingData.find(r=>r.code===code)) rankingData.push({code,points:0,manualOrder:""});
  saveAll();renderRanking();
}
function addTeam(){
  const code=(prompt("Sigla nuova società","NEW")||"").toUpperCase();
  if(!code || teamExistsStrict(code)){alert("Sigla vuota o già esistente");return;}
  const name=prompt("Nome società","Nuova Società") || "Nuova Società";
  const division=prompt("Serie","Serie B") || "Serie B";
  teams.push({code,name,division,primary:"#1e293b",secondary:"#7c3aed",text:"#ffffff",logo:"",credits:500,hmcoin:100,jerseyStyle:"diagonal"});
  rankingData.push({code,points:0,manualOrder:""});
  saveAll();renderRanking();
}
function editTeam(code){
  const t=team(code); if(!t) return;
  q("tradeModalBody").innerHTML = `
    <h3>Modifica società ${code}</h3>
    <div class="grid grid3">
      <label>Nome<input class="input" id="rankTeamName" value="${esc(t.name)}"></label>
      <label>Serie<input class="input" id="rankTeamDivision" value="${esc(t.division)}"></label>
      <label>Colore 1<input class="input" type="color" id="rankTeamPrimary" value="${t.primary||"#1e293b"}"></label>
      <label>Colore 2<input class="input" type="color" id="rankTeamSecondary" value="${t.secondary||"#7c3aed"}"></label>
      <label>Colore sigla<input class="input" type="color" id="rankTeamText" value="${t.text||"#ffffff"}"></label>
      <label>Stile maglia<select class="input" id="rankTeamJerseyStyle">
        ${["solid","stripes","halves","band","diagonal"].map(x=>`<option value="${x}" ${x===(t.jerseyStyle||"diagonal")?"selected":""}>${x}</option>`).join("")}
      </select></label>
      <label>Logo da file<input class="input" type="file" id="rankTeamLogo" accept="image/*"></label>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:14px">
      <button class="btn" onclick="closeTradeModal()">Annulla</button>
      <button class="btn green" onclick="saveRankTeam('${code}')">Salva</button>
    </div>`;
  q("tradeModal").style.display="flex";
}
function saveRankTeam(code){
  const t=team(code); if(!t) return;
  t.name=q("rankTeamName").value;t.division=q("rankTeamDivision").value;t.primary=q("rankTeamPrimary").value;t.secondary=q("rankTeamSecondary").value;t.text=q("rankTeamText").value;t.jerseyStyle=q("rankTeamJerseyStyle").value;
  const file=q("rankTeamLogo").files[0];
  if(file){const reader=new FileReader();reader.onload=()=>{t.logo=reader.result;saveAll();closeTradeModal();renderRanking();};reader.readAsDataURL(file);}
  else{saveAll();closeTradeModal();renderRanking();}
}

/* Storico campionati */
let tempSeasonRows=[];
let tempSeasonAwards=[];
let editingSeasonIndex=null;
function makeEmptyStandingRow(){return {teamCode:"",team:"",points:"",gf:"",ga:"",fm:"",series:"Serie A"};}
function renderHistory(){
  q("view-history").innerHTML = `
    <div class="between">
      <div><h2>Storico campionati passati</h2><p class="muted">Compila direttamente la classifica storica.</p></div>

function openSeasonTable(index=null){
  editingSeasonIndex=index;
  const s=index!==null?seasonHistory[index]:{season:"2009/2010",title:"HM League",standings:Array.from({length:8},()=>makeEmptyStandingRow()),awards:[]};

    <div class="card" style="margin-top:12px"><div class="between"><h3>Classifica</h3><div class="row"><button class="btn primary" onclick="addStandingPosition()">Aggiungi posizione</button><button class="btn red" onclick="removeLastStandingPosition()">Togli ultima</button></div></div><div style="overflow:auto;margin-top:12px"><table class="table"><thead><tr><th>Pos</th><th>Società esistente</th><th>Nome libero</th><th>Serie</th><th>Punti</th><th>GF</th><th>GS</th><th>FM</th><th></th></tr></thead><tbody id="standingEditorRows"></tbody></table></div></div>

    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" onclick="closeTradeModal()">Annulla</button><button class="btn green" onclick="saveSeasonTable()">Salva classifica</button></div>`;
  q("tradeModal").style.display="flex";
  renderStandingEditorRows();
  renderSeasonAwardsEditor();
}
function teamOptions(selected){return `<option value="">-- nome libero --</option>`+teams.filter(t=>t.code!=="SVIN").map(t=>`<option value="${t.code}" ${t.code===selected?"selected":""}>${t.code} · ${esc(t.name)}</option>`).join("");}
function renderStandingEditorRows(){
  q("standingEditorRows").innerHTML=tempSeasonRows.map((r,i)=>`<tr><td><b>${i+1}</b></td><td><select class="input" onchange="standingChooseTeam(${i},this.value)">${teamOptions(r.teamCode)}</select></td><td><input class="input" value="${esc(r.team||"")}" onchange="updateStandingField(${i},'team',this.value)"></td><td><input class="input" value="${esc(r.series||"")}" onchange="updateStandingField(${i},'series',this.value)"></td><td><input class="input" style="width:80px" value="${esc(r.points||"")}" onchange="updateStandingField(${i},'points',this.value)"></td><td><input class="input" style="width:80px" value="${esc(r.gf||"")}" onchange="updateStandingField(${i},'gf',this.value)"></td><td><input class="input" style="width:80px" value="${esc(r.ga||"")}" onchange="updateStandingField(${i},'ga',this.value)"></td><td><input class="input" style="width:90px" value="${esc(r.fm||"")}" onchange="updateStandingField(${i},'fm',this.value)"></td><td><button class="btn red" onclick="removeStandingPosition(${i})">X</button></td></tr>`).join("");
}
function standingChooseTeam(i,code){tempSeasonRows[i].teamCode=code;if(code){const t=team(code);tempSeasonRows[i].team=t?t.name:"";}renderStandingEditorRows();}
function updateStandingField(i,field,value){tempSeasonRows[i][field]=value;}
function addStandingPosition(){tempSeasonRows.push(makeEmptyStandingRow());renderStandingEditorRows();}
function removeLastStandingPosition(){if(tempSeasonRows.length>0)tempSeasonRows.pop();renderStandingEditorRows();}
function removeStandingPosition(i){tempSeasonRows.splice(i,1);renderStandingEditorRows();}

function addSeasonAward(){
  tempSeasonAwards.push({award:"Capocannoniere",player:"",teamCode:"",teamFree:""});
  renderSeasonAwardsEditor();
}

function removeSeasonAward(i){
  tempSeasonAwards.splice(i,1);
  renderSeasonAwardsEditor();
}

function updateSeasonAward(i,field,value){
  tempSeasonAwards[i][field]=value;
}

function renderSeasonAwardsEditor(){
  const box=q("seasonAwardsBox");
  if(!box) return;
  box.innerHTML=tempSeasonAwards.map((a,i)=>{
    const award=a.award || a.label || "Capocannoniere";
    const player=a.player || a.value || "";

    const teamFree=a.teamFree || "";

    <div class="card" style="margin-top:10px">
      <div class="grid grid4">

          <select class="input" onchange="updateSeasonAward(${i},'award',this.value);renderSeasonAwardsEditor()">
            ${INDIVIDUAL_AWARDS.map(x=>`<option value="${x}" ${x===award?"selected":""}>${x}</option>`).join("")}

          <select class="input" onchange="updateSeasonAward(${i},'teamCode',this.value);renderSeasonAwardsEditor()">

        </label>

          <input class="input" value="${esc(teamFree)}" onchange="updateSeasonAward(${i},'teamFree',this.value)" placeholder="Nome squadra">
        </label>
        <div class="row" style="grid-column:1/-1">
          ${imgPreview("individual_"+award,46)}
          <label class="muted">Immagine premio "${esc(award)}" valida ovunque
            <input type="file" accept="image/*" onchange="uploadAwardImage(this,'individual_${esc(award)}')">
          </label>
          <button class="btn red" onclick="removeSeasonAward(${i})">Rimuovi</button>

function syncSeasonIndividualTitles(seasonItem, oldSeason=null){
  if(oldSeason){
    individualTitles=individualTitles.filter(x=>x.sourceSeason!==oldSeason);
  }
  individualTitles=individualTitles.filter(x=>x.sourceSeason!==seasonItem.season);

  (seasonItem.awards||[]).forEach(a=>{
    if(a.teamCode && team(a.teamCode)){
      individualTitles.push({
        team:a.teamCode,
        award:a.award || a.label || "",
        player:a.player || a.value || "",
        season:seasonItem.season,
        sourceSeason:seasonItem.season
      });
    }
  });
}

function syncSeasonPositions(seasonItem,oldSeason=null){if(oldSeason)positionHistory=positionHistory.filter(p=>p.sourceSeason!==oldSeason);positionHistory=positionHistory.filter(p=>p.sourceSeason!==seasonItem.season);(seasonItem.standings||[]).forEach((r,idx)=>{if(r.teamCode&&team(r.teamCode)){positionHistory.push({team:r.teamCode,season:seasonItem.season,position:String(idx+1)+"°",series:r.series||seasonItem.title||"",sourceSeason:seasonItem.season});}});}
function saveSeasonTable(){
  const season=q("histSeason").value.trim();if(!season){alert("Inserisci la stagione.");return;}
  const item={season,title:q("histTitle").value.trim()||"HM League",standings:tempSeasonRows.filter(r=>r.teamCode||r.team||r.points||r.gf||r.ga||r.fm).map(r=>({...r})),awards:tempSeasonAwards||[]};
  let oldSeason=null;if(editingSeasonIndex===null)seasonHistory.unshift(item);else{oldSeason=seasonHistory[editingSeasonIndex]?.season;seasonHistory[editingSeasonIndex]=item;}
  syncSeasonPositions(item,oldSeason);syncSeasonIndividualTitles(item,oldSeason);saveAll();closeTradeModal();renderHistory();
}
function openSeasonDetail(i){const s=seasonHistory[i];if(!s)return;const awardsHtml=(s.awards||[]).length?`<div class="card" style="margin-top:14px"><h3>Titoli individuali stagione</h3><div class="grid grid2">${(s.awards||[]).map(a=>`<div class="playerRow">${imgPreview("individual_"+(a.award||a.label||""),48)}<div><b>${esc(a.award||a.label||"")}</b><div class="muted">${esc(a.player||a.value||"")} · ${esc(a.teamCode?teamLabel(a.teamCode):(a.teamFree||""))}</div></div></div>`).join("")}</div></div>`:"";q("seasonDetail").innerHTML=`<div class="card"><div class="between"><div><h3>${esc(s.title)} · ${esc(s.season)}</h3></div><button class="btn" onclick="openSeasonTable(${i})">Modifica classifica</button></div><table class="table"><tr><th>Pos</th><th>Squadra</th><th>Serie</th><th>Punti</th><th>GF</th><th>GS</th><th>FM</th></tr>${(s.standings||[]).map((r,idx)=>`<tr><td><b>${idx+1}</b></td><td><b>${esc(r.teamCode?teamLabel(r.teamCode):r.team)}</b></td><td>${esc(r.series||"")}</td><td>${esc(r.points||"")}</td><td>${esc(r.gf||"")}</td><td>${esc(r.ga||"")}</td><td>${esc(r.fm||"")}</td></tr>`).join("")}</table></div>${awardsHtml}`;}
function deleteSeason(i){if(!confirm("Eliminare stagione storica?"))return;const s=seasonHistory[i];if(s?.season)positionHistory=positionHistory.filter(p=>p.sourceSeason!==s.season);
    individualTitles=individualTitles.filter(p=>p.sourceSeason!==s.season);seasonHistory.splice(i,1);saveAll();renderHistory();}

/* Asta */
function auctionPlayer(){return players.find(p=>p.id===auctionState.playerId)||null;}
function highestBid(){return auctionState.bids&&auctionState.bids.length?auctionState.bids[auctionState.bids.length-1]:null;}
function renderAuction(){
  auctionState=auctionState||{playerId:"",bids:[],history:[]};
  const p=auctionPlayer();const bid=highestBid();
  q("view-auction").innerHTML=`<div class="between"><div><h2>Asta</h2><p class="muted">Cerca un calciatore, fai offerte e aggiudica col martello.</p></div></div>
  <div class="grid grid2" style="margin-top:14px"><div class="card"><h3>Cerca calciatore</h3><input id="aucSearch" class="input" placeholder="Nome..." oninput="renderAuctionSearchResults()"><button class="btn primary" style="margin-top:10px" onclick="openManualAuctionPlayer()">Aggiungi manualmente</button><div id="auctionSearchResults" style="margin-top:12px"></div></div>
  <div class="card"><h3>Asta in corso</h3>${p?`<div class="playerRow">${jersey(p.owner||"SVIN",54)}<div><b>${esc(p.name)}</b><div class="muted">${esc(p.role||"")} · ${esc(p.current||"")}</div></div><button class="btn red" onclick="resetAuction()">Annulla asta</button></div><div class="stat" style="margin-top:12px"><div class="muted">Offerta più alta</div><div class="n">${bid?esc(bid.amount)+" crediti":"Nessuna"}</div><div>${bid?teamLabel(bid.team):"Base minima 1 credito"}</div></div><label>Squadra<select id="bidTeam" class="input">${teams.filter(t=>t.code!=="SVIN" && (isAdmin() || canEditTeam(t.code))).map(t=>`<option value="${t.code}">${teamLabel(t.code)} · crediti ${t.credits??0}</option>`).join("")}</select></label><label>Offerta<input id="bidAmount" class="input" type="number" value="${bid?Number(bid.amount)+1:1}"></label><div class="row"><button class="btn green" onclick="placeBid()">Fai offerta</button><button class="btn primary" style="font-size:24px" onclick="hammerAuction()">🔨</button></div>`:`<div class="muted">Nessun calciatore selezionato. Cerca un calciatore a sinistra oppure aggiungilo manualmente.</div>`}</div></div>
  <div class="card" style="margin-top:14px"><h3>Storico aste</h3>${(auctionState.history||[]).length?auctionState.history.map((h,i)=>`<div class="playerRow">${jersey(h.team,42)}<div><b>${esc(h.playerName)}</b><div class="muted">Aggiudicato a ${teamLabel(h.team)} per ${esc(h.amount)} crediti</div></div><button class="btn red" onclick="undoAuctionOperation(${i})">Annulla</button></div>`).join(""):'<div class="muted">Nessuna operazione.</div>'}</div>`;
  renderAuctionSearchResults();
}
function renderAuctionSearchResults(){const box=q("auctionSearchResults");if(!box)return;const s=(q("aucSearch")?.value||"").toLowerCase();const list=players.filter(p=>[p.name,p.role,p.current,p.owner].join(" ").toLowerCase().includes(s)).slice(0,50);box.innerHTML=list.map(p=>`<div class="playerRow">${jersey(p.owner||"SVIN",44)}<div><b>${esc(p.name)}</b><div class="muted">${esc(p.role)} · ${esc(p.current)} · ${esc(p.owner)}</div></div><button class="btn primary" onclick="startAuction('${p.id}')">Metti in asta</button></div>`).join("")||'<div class="muted">Nessun calciatore trovato.</div>';}
function startAuction(id){auctionState.playerId=id;auctionState.bids=[];saveAll();renderAuction();}
function openManualAuctionPlayer(){const name=prompt("Nome calciatore");if(!name)return;const p={id:"P"+Date.now(),name,role:prompt("Ruolo","")||"",current:"",owner:"SVIN",status:"ASTA",bonus:"",contract:"0",deadline:""};players.push(p);startAuction(p.id);}
function placeBid(){const p=auctionPlayer();if(!p)return;const teamCode=q("bidTeam").value;const amount=Number(q("bidAmount").value||0);const min=highestBid()?Number(highestBid().amount)+1:1;if(amount<min){alert("Offerta minima "+min);return;}auctionState.bids.push({team:teamCode,amount,date:new Date().toLocaleString("it-IT")});saveAll();renderAuction();}
function hammerAuction(){const p=auctionPlayer();const bid=highestBid();if(!p||!bid){alert("Serve almeno un'offerta.");return;}const oldOwner=p.owner, oldCurrent=p.current, oldCredits=team(bid.team)?.credits;p.owner=bid.team;p.current=bid.team;team(bid.team).credits=(Number(team(bid.team).credits)||0)-Number(bid.amount||0);auctionState.history.unshift({playerId:p.id,playerName:p.name,team:bid.team,amount:bid.amount,oldOwner,oldCurrent,oldCredits,date:new Date().toLocaleString("it-IT")});auctionState.playerId="";auctionState.bids=[];saveAll();renderAuction();}
function undoAuctionOperation(i){const op=auctionState.history[i];if(!op)return;const p=players.find(x=>x.id===op.playerId);if(p){p.owner=op.oldOwner;p.current=op.oldCurrent;}const t=team(op.team);if(t)t.credits=op.oldCredits;auctionState.history.splice(i,1);saveAll();renderAuction();}
function resetAuction(){auctionState.playerId="";auctionState.bids=[];saveAll();renderAuction();}

/* Azioni Presidente */
const PRESIDENT_ACTION_TYPES=[
  {name:"Ritiro forzato",cost:7,suspended:false},{name:"Tutti allo stadio",cost:7,suspended:false},{name:"Caro biglietti",cost:-5,suspended:false},{name:"Patto con gli ultras",cost:7,suspended:false},{name:"Discorso alla squadra",cost:15,suspended:false},{name:"Ultimatum all’allenatore",cost:0,suspended:false},{name:"Promessa alla squadra",cost:25,suspended:true}
];
function actionType(name){return PRESIDENT_ACTION_TYPES.find(a=>a.name===name)||PRESIDENT_ACTION_TYPES[0];}
function renderPresidentActions(){
  q("view-actions").innerHTML=`<div class="between"><div><h2>Azioni Presidente</h2><p class="muted">Gestione crediti e registro azioni.</p></div><button class="btn primary" onclick="openPresidentActionModal()">Nuova azione</button></div><div class="card" style="margin-top:14px"><h3>Registro azioni</h3><table class="table"><tr><th>Data</th><th>Squadra</th><th>Azione</th><th>Contro</th><th>Competizione</th><th>Crediti</th><th>Stato</th><th></th></tr>${presidentActions.length?presidentActions.map((a,i)=>`<tr><td>${esc(a.date)}</td><td>${teamLabel(a.team)}</td><td><b>${esc(a.action)}</b></td><td>${a.against?teamFullName(a.against):"-"}</td><td>${esc(a.competition||"-")}</td><td>${a.suspended&&a.status!=="Pagata"?"Sospesi "+esc(a.cost):esc(a.creditDelta)}</td><td><span class="badge">${esc(a.status)}</span></td><td><button class="btn" onclick="openPresidentActionModal(${i})">Modifica</button><button class="btn red" onclick="deletePresidentAction(${i})">Elimina</button></td></tr>`).join(""):'<tr><td colspan="8" class="muted">Nessuna azione registrata. Premi “Nuova azione”.</td></tr>'}</table></div>`;
}
function openPresidentActionModal(index=null){
  const row=index!==null?presidentActions[index]:{team:"IMP",action:"Ritiro forzato",against:"",competition:"Campionato",status:"Attiva"};
  q("tradeModalBody").innerHTML=`<h3>${index!==null?"Modifica":"Nuova"} azione presidente</h3><div class="grid grid2"><label>Squadra<select class="input" id="paTeam">${teams.filter(t=>t.code!=="SVIN").map(t=>`<option value="${t.code}" ${t.code===row.team?"selected":""}>${teamLabel(t.code)}</option>`).join("")}</select></label><label>Azione<select class="input" id="paAction">${PRESIDENT_ACTION_TYPES.map(a=>`<option value="${a.name}" ${a.name===row.action?"selected":""}>${a.name}</option>`).join("")}</select></label><label>Contro<select class="input" id="paAgainst"><option value="">Nessuna</option>${teams.filter(t=>t.code!=="SVIN").map(t=>`<option value="${t.code}" ${t.code===row.against?"selected":""}>${teamLabel(t.code)}</option>`).join("")}</select></label><label>Competizione<select class="input" id="paCompetition"><option ${row.competition==="Campionato"?"selected":""}>Campionato</option><option ${row.competition==="Coppa"?"selected":""}>Coppa</option></select></label><label>Stato<select class="input" id="paStatus">${["Attiva","Conclusa","Annullata","Pagata"].map(s=>`<option ${s===row.status?"selected":""}>${s}</option>`).join("")}</select></label></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" onclick="closeTradeModal()">Annulla</button><button class="btn green" onclick="savePresidentAction(${index===null?"null":index})">Salva</button></div>`;
  q("tradeModal").style.display="flex";
}
function applyPresidentActionCredits(row,reverse=false){const t=team(row.team);if(!t)return;if(row.suspended&&row.status!=="Pagata")return;const d=Number(row.creditDelta||0);t.credits=(Number(t.credits)||0)+(reverse?-d:d);}
function savePresidentAction(index=null){const a=actionType(q("paAction").value);const status=q("paStatus").value;const creditDelta=a.suspended?(status==="Pagata"?-Number(a.cost):0):-Number(a.cost);const row={team:q("paTeam").value,action:a.name,against:q("paAgainst").value,competition:q("paCompetition").value,status,suspended:!!a.suspended,cost:a.cost,creditDelta,date:index===null?new Date().toLocaleString("it-IT"):presidentActions[index].date,applied:false};if(index!==null){const old=presidentActions[index];if(old?.applied)applyPresidentActionCredits(old,true);presidentActions[index]=row;}else{presidentActions.unshift(row);index=0;}if(row.status!=="Annullata"){applyPresidentActionCredits(row,false);presidentActions[index].applied=true;}saveAll();closeTradeModal();renderPresidentActions();}
function deletePresidentAction(i){const row=presidentActions[i];if(row?.applied)applyPresidentActionCredits(row,true);presidentActions.splice(i,1);saveAll();renderPresidentActions();}


function renderRegulation(){

  q("view-regulation").innerHTML = `
    <div class="between">
      <div>
        <h2>Regolamento</h2>
        <p class="muted">Qui puoi incollare e salvare il regolamento ufficiale della HM League. Gli ospiti e i presidenti possono leggerlo, solo Federico admin può modificarlo.</p>
      </div>

  function clonePlain(v){try{return JSON.parse(JSON.stringify(v ?? null));}catch(e){return v;}}

  function awardAssetRows(){return Object.entries(awardImages||{}).filter(([k,v])=>String(v||"").trim()).map(([k,v])=>({id:"award_"+safeId(k), key:k, value:v}));}
  function good(d){return d&&Array.isArray(d.players)&&d.players.length>50&&Array.isArray(d.teams)&&d.teams.length>=16}
  function apply(d){
    if(!good(d))return false;
    teams=d.teams||teams; players=d.players||players; trades=Array.isArray(d.trades)?d.trades:trades; news=Array.isArray(d.news)?d.news:news;
    honors=Array.isArray(d.honors)?d.honors:honors; individualTitles=Array.isArray(d.individualTitles)?d.individualTitles:individualTitles; positionHistory=Array.isArray(d.positionHistory)?d.positionHistory:positionHistory; orgData=d.orgData||orgData; awardImages=d.awardImages||awardImages;
    rankingData=Array.isArray(d.rankingData)?d.rankingData:rankingData; rankingHidden=Array.isArray(d.rankingHidden)?d.rankingHidden:rankingHidden; seasonHistory=Array.isArray(d.seasonHistory)?d.seasonHistory:seasonHistory; savedFormations=d.savedFormations||savedFormations;
    // Asta live: NON sovrascrivere mai l'asta in corso caricando il gestionale generale.
    // Il documento realtime/auction è la fonte vera per playerId, bids, activeTeams e passedTeams.

    presidentActions=Array.isArray(d.presidentActions)?d.presidentActions:presidentActions; competitionsManager=d.competitionsManager??competitionsManager; coachesManager=d.coachesManager??coachesManager; regulationText=typeof d.regulationText==="string"?d.regulationText:regulationText;
    ensureIds(trades,"trade"); ensureIds(news,"news");

  function buildSplitDocs(){
    ensureIds(trades,"trade");

    const newsIndex=(Array.isArray(news)?news:[]).map((n,i)=>({id:safeId(n.id || ("news_"+i)), sort:i, date:n.date||"", title:n.title||""}));
    const docs={
      // Asta live: nel core salvo solo lo storico, non l'asta in corso.
      // L'asta in corso resta nel documento realtime/auction per non essere cancellata dai salvataggi generali.
      core:{version:6,updatedAt:new Date().toISOString(),rankingData,rankingHidden,auctionState:{history:Array.isArray(auctionState?.history)?auctionState.history:[]},presidentActions,regulationText,pendingTrades:clonePlain(window.pendingTrades || [])},

  async function commitInChunks(writes){
    let batch=fbDb.batch(), count=0;
    async function flush(){ if(count>0){ await batch.commit(); batch=fbDb.batch(); count=0; } }
    for(const w of writes){
      if(w.type==="set") batch.set(w.ref, cleanForFirestore(w.data), w.options||{merge:false});
      else if(w.type==="delete") batch.delete(w.ref);
      count++;
      if(count>=430) await flush();
    }
    await flush();
  }

  async function fbSaveSplit(){
    const {docs,assets}=buildSplitDocs();
    const writes=[];
    writes.push({type:"set",ref:metaRef(),data:{version:6,updatedAt:new Date().toISOString(),mode:"split_v2"},options:{merge:true}});
    Object.entries(docs).forEach(([id,data])=>writes.push({type:"set",ref:partRef(id),data,options:{merge:false}}));

    await commitInChunks(writes);
  }

  async function docsFromIndex(col,indexItems){
    const snap=await col.get();
    const byId={};
    snap.forEach(doc=>{byId[doc.id]=doc.data()||{};});
    if(Array.isArray(indexItems) && indexItems.length){
      return indexItems.map((it,i)=>({...(byId[it.id]||{}), id:(byId[it.id]?.id||it.id), _sort:it.sort??i})).filter(x=>Object.keys(x).length>1).sort((a,b)=>(a._sort??0)-(b._sort??0));
    }
    return Object.entries(byId).map(([id,x])=>({...x,id:x.id||id})).sort((a,b)=>(a._sort??0)-(b._sort??0));
  }

  async function fbLoadSplit(){
    const snap=await partsCol().get();
    if(snap.empty) return null;
    const d={};
    snap.forEach(x=>{d[x.id]=x.data()||{};});
    const aSnap=await assetsCol().get();

    const splitNews = await docsFromIndex(newsCol(), d.newsIndex?.items || []);
    const full={
      version:d.core?.version||6,
      updatedAt:d.core?.updatedAt||"",
      teams:d.teams?.teams||[],
      players:d.players?.players||[],
      trades: splitTrades.length ? splitTrades : (d.trades?.trades||[]),
      news: splitNews.length ? splitNews : (d.core?.news || d.news?.news || []),
      honors:d.honors?.honors||[],
      individualTitles:d.honors?.individualTitles||[],
      positionHistory:d.honors?.positionHistory||[],
      seasonHistory:d.honors?.seasonHistory||[],
      rankingData:d.core?.rankingData||[],

      // Non caricare qui playerId/bids dell'asta: arrivano dal listener realtime.
      auctionState:Object.assign({}, auctionState||{}, {history:Array.isArray(d.core?.auctionState?.history)?d.core.auctionState.history:[]}),
      presidentActions:d.core?.presidentActions||[],
      regulationText:d.core?.regulationText||"",

      competitionsManager:d.managers?.competitionsManager??null,
      coachesManager:d.managers?.coachesManager??null,
      orgData:d.managers?.orgData||{},
      awardImages:{}
    };
    const teamMap=Object.fromEntries(full.teams.map(t=>[t.code,t]));
    aSnap.forEach(doc=>{
      const x=doc.data()||{};
      if(doc.id.startsWith("teamLogo_") && x.code && teamMap[x.code]) teamMap[x.code].logo=x.value||"";
      else if(doc.id.startsWith("org_") && x.code && x.field){ full.orgData[x.code]=full.orgData[x.code]||{}; full.orgData[x.code][x.field]=x.value||""; }
      else if(doc.id.startsWith("award_") && x.key){ full.awardImages[x.key]=x.value||""; }
    });
    return full;
  }

(function(){

    try { return typeof esc === "function" ? esc(v) : String(v??"").replace(/[&<>\"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m])); }

    return t ? (t.name||"") : "";
  }
  function hmTeamOptions(selected, includeEmpty){
    selected = hmNormCode(selected);
    if(selected === "SVIN" && includeEmpty) selected = "";
    const out = [];
    if(includeEmpty) out.push(`<option value="" ${!selected?"selected":""}>— Nessuna / Svincolato —</option>`);
    (Array.isArray(teams)?teams:[]).forEach(t=>{
      const code = hmNormCode(t.code);
      const label = code === "SVIN" ? "SVIN · Svincolati" : `${code} · ${t.name||""}`;
      out.push(`<option value="${hmEsc(code)}" ${code===selected?"selected":""}>${hmEsc(label)}</option>`);
    });
    return out.join("");
  }
  function hmRoleOptions(selected){
    selected = String(selected||"").trim();
    const common = [
      "Por","Dc","Dd","Ds","B","E","M","C","W","T","A","Pc",
      "Dd;Dc","Ds;Dc","Dd;Ds;E","B;Dd;E","B;Ds;E","Ds;E","Dd;E",
      "E;W","E;M","M;C","C;T","C;W","C;W;T","W;A","W;T","W;T;A","T;A","A;Pc"
    ];
    const fromDb = Array.from(new Set((Array.isArray(players)?players:[]).map(p=>String(p.role||"").trim()).filter(Boolean)));
    const all = ["", ...common, ...fromDb];
    if(selected && !all.includes(selected)) all.push(selected);
    const unique = Array.from(new Set(all));
    return unique.map(r=>`<option value="${hmEsc(r)}" ${r===selected?"selected":""}>${r?hmEsc(r):"— Seleziona ruolo —"}</option>`).join("");
  }
  function hmStatusOptions(selected){
    selected = String(selected||"D").trim();
    const list = ["D","PS","PD","PO","PRIMAVERA 2005","PRIMAVERA 2006","PRIMAVERA 2007","PRIMAVERA 2008","PRIMAVERA 2009","PRIMAVERA 2010","PRIMAVERA 2011","Svincolato"];
    if(selected && !list.includes(selected)) list.push(selected);
    return list.map(s=>`<option value="${hmEsc(s)}" ${s===selected?"selected":""}>${hmEsc(s)}</option>`).join("");
  }

      </div>

        <div class="muted"><b>Regola salvataggio:</b> se scegli un proprietario e lasci vuota la squadra attuale, il sistema usa automaticamente il proprietario come squadra attuale. Per svincolare davvero, scegli Proprietario = SVIN.</div>

    hmModal(hmPlayerForm(null, "new"));
  };

  window.openPlayerEditor = function(id){
    const p = (Array.isArray(players)?players:[]).find(x=>String(x.id)===String(id));
    if(!p) return false;
    if(typeof canEditPlayerObj === "function" && !canEditPlayerObj(p) && typeof requireAdmin === "function" && !requireAdmin()) return false;
    selectedPlayerId = p.id;
    hmModal(hmPlayerForm(p, "edit"));
  };

  window.duplicatePlayerEditor = function(id){
    const p = (Array.isArray(players)?players:[]).find(x=>String(x.id)===String(id));
    if(!p) return false;
    if(typeof requireAdmin === "function" && !requireAdmin()) return false;
    selectedPlayerId = null;
    const clone = {...p, id:"", name:(p.name||"") + " copia"};
    hmModal(hmPlayerForm(clone, "duplicate"));
  };

  window.savePlayerEditor = function(){
    if(typeof isLoggedIn === "function" && !isLoggedIn()){ alert("Devi fare login per modificare."); return false; }
    const isNew = !selectedPlayerId;
    if(isNew && typeof requireAdmin === "function" && !requireAdmin()) return false;

    let existing = (Array.isArray(players)?players:[]).find(x=>String(x.id)===String(selectedPlayerId));
    if(existing && typeof canEditPlayerObj === "function" && !canEditPlayerObj(existing) && typeof requireAdmin === "function" && !requireAdmin()) return false;

    const name = hmVal("hmPlName");
    const role = hmVal("hmPlRole");
    let current = hmNormCode(hmVal("hmPlCurrent"));
    let owner = hmNormCode(hmVal("hmPlOwner") || "SVIN");
    let status = hmVal("hmPlStatus") || "D";

    if(!name){ alert("Inserisci almeno il nome del calciatore."); return false; }
    if(!role){ alert("Seleziona il ruolo del calciatore."); return false; }
    if(!owner) owner = "SVIN";
    if(current === "SVIN") current = "";
    if(owner === "SVIN") { current = ""; status = status || "Svincolato"; }
    else if(!current) current = owner;

    const next = existing || {id:"P"+Date.now()+"_"+Math.random().toString(16).slice(2)};
    next.name = name;
    next.role = role;
    next.current = current;
    next.owner = owner;
    next.status = status;
    next.bonus = hmVal("hmPlBonus");
    next.contract = hmVal("hmPlContract");
    next.deadline = hmVal("hmPlDeadline");

    if(!existing) players.push(next);

    // Salva locale + Firebase usando il sistema già funzionante del file.
    if(typeof saveAll === "function" && saveAll() === false) return false;
    try{ if(typeof fbSave === "function") fbSave(false); }catch(e){}
    closeTradeModal();
    try{ renderPlayers(); }catch(e){ console.warn(e); }
    try{ if(q("view-teamDetail") && !q("view-teamDetail").classList.contains("hidden")) renderTeamDetail(); }catch(e){ console.warn(e); }
    return true;
  };

  window.deletePlayerEditor = function(id){
    if(typeof requireAdmin === "function" && !requireAdmin()) return false;
    const p = (Array.isArray(players)?players:[]).find(x=>String(x.id)===String(id));
    if(!p) return false;
    if(!confirm(`Eliminare definitivamente ${p.name}?`)) return false;
    players = players.filter(x=>String(x.id)!==String(id));
    Object.keys(savedFormations||{}).forEach(teamCode=>{
      Object.keys(savedFormations[teamCode]||{}).forEach(slot=>{
        if(String(savedFormations[teamCode][slot])===String(id)) delete savedFormations[teamCode][slot];
      });
    });
    if(typeof saveAll === "function" && saveAll() === false) return false;
    try{ if(typeof fbSave === "function") fbSave(false); }catch(e){}
    closeTradeModal();
    try{ renderPlayers(); }catch(e){ console.warn(e); }
    try{ if(q("view-teamDetail") && !q("view-teamDetail").classList.contains("hidden")) renderTeamDetail(); }catch(e){ console.warn(e); }
    return true;
  };
})();
</script>





<script>
/* =========================================================
   ASTA LIVE FIREBASE - solo tab Asta
   Non modifica salvataggio generale, loghi, scambi, calciatori.
   ========================================================= */
(function(){
  let hmAuctionLiveStarted = false;
  let hmAuctionUnsub = null;
  let hmAuctionRemoteApplying = false;
  let hmAuctionBusy = false;

  function hmEsc(v){
    try { return typeof esc === "function" ? esc(v) : String(v??"").replace(/[&<>\"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m])); }
    catch(e){ return String(v??""); }
  }
  function hmNow(){ return new Date().toLocaleString("it-IT"); }
  function hmIsAdmin(){
    try { return !!(currentUser && currentUser.role === "admin"); } catch(e){ return false; }
  }
  function hmCanEditTeam(code){
    try { return typeof canEditTeam === "function" ? canEditTeam(code) : hmIsAdmin(); }
    catch(e){ return hmIsAdmin(); }
  }
  function hmTeam(code){
    try { return typeof team === "function" ? team(code) : (teams||[]).find(t=>t.code===code); }
    catch(e){ return null; }
  }
  function hmTeamLabel(code){
    try { return typeof teamLabel === "function" ? teamLabel(code) : code; }
    catch(e){ return code; }
  }
  function hmJersey(code,size){
    try { return typeof jersey === "function" ? jersey(code,size) : ""; }
    catch(e){ return ""; }
  }
  function hmSaveLocal(){
    try { if(typeof saveLocalOnly === "function") saveLocalOnly(); }
    catch(e){ console.warn("Asta live: saveLocalOnly non disponibile", e); }
  }
  function hmSetStatus(text, cls){
    try {
      const b = document.getElementById("firebaseStatusBadge");
      if(b) b.textContent = text;
    } catch(e){}
  }
  function hmFirebaseDb(){
    try{
      if(!window.firebase) return null;
      if(!firebase.apps || !firebase.apps.length){
        if(typeof firebaseConfig !== "undefined") firebase.initializeApp(firebaseConfig);
        else return null;
      }
      return firebase.firestore();
    }catch(e){ console.error("Asta live Firebase init", e); return null; }
  }
  function hmAuctionRef(){
    const db = hmFirebaseDb();
    if(!db) return null;
    return db.collection("hmleague").doc("main").collection("realtime").doc("auction");
  }
  function hmAuctionPlayer(){
    try { return typeof auctionPlayer === "function" ? auctionPlayer() : (players||[]).find(p=>p.id===auctionState.playerId); }
    catch(e){ return null; }
  }
  function hmHighestBidFrom(state){
    const bids = Array.isArray(state?.bids) ? state.bids : [];
    return bids.length ? bids[bids.length-1] : null;
  }
  function hmHighestBid(){ return hmHighestBidFrom(auctionState); }
  function hmVisibleView(){
    try { return typeof currentVisibleViewName === "function" ? currentVisibleViewName() : ""; }
    catch(e){ return ""; }
  }
  function hmNormalizeAuctionDoc(d){
    d = d && typeof d === "object" ? d : {};
    return {
      playerId: d.playerId || "",
      manualPlayer: d.manualPlayer || null,
      bids: Array.isArray(d.bids) ? d.bids : [],
      activeTeams: Array.isArray(d.activeTeams) ? d.activeTeams : [],
      passedTeams: Array.isArray(d.passedTeams) ? d.passedTeams : [],
      winner: d.winner || null,
      history: Array.isArray(auctionState?.history) ? auctionState.history : [],
      liveUpdatedAt: d.updatedAt || "",
      liveUpdatedBy: d.updatedBy || ""
    };
  }
  function hmCurrentAuctionDoc(extra){
    return Object.assign({
      playerId: auctionState?.playerId || "",
      manualPlayer: auctionState?.manualPlayer || null,
      bids: Array.isArray(auctionState?.bids) ? auctionState.bids : [],
      activeTeams: Array.isArray(auctionState?.activeTeams) ? auctionState.activeTeams : [],
      passedTeams: Array.isArray(auctionState?.passedTeams) ? auctionState.passedTeams : [],
      winner: auctionState?.winner || null,
      updatedAt: new Date().toISOString(),
      updatedBy: currentUser?.username || currentUser?.email || "utente"
    }, extra || {});
  }
  async function hmPushAuctionState(extra){
    const ref = hmAuctionRef();
    if(!ref) throw new Error("Firebase non pronto per asta live");
    await ref.set(hmCurrentAuctionDoc(extra), {merge:false});
  }
  function hmStartLiveListener(){
    if(hmAuctionLiveStarted) return;
    const ref = hmAuctionRef();
    if(!ref) return;
    hmAuctionLiveStarted = true;
    try{
      hmAuctionUnsub = ref.onSnapshot(function(doc){
        if(!doc.exists) return;
        const incoming = hmNormalizeAuctionDoc(doc.data() || {});
        // Mantiene lo storico locale dell'asta, ma sincronizza l'asta in corso in tempo reale.
        auctionState = Object.assign({}, auctionState || {}, incoming, {history: Array.isArray(auctionState?.history) ? auctionState.history : []});
        hmSaveLocal();
        if(hmVisibleView() === "auction"){
          hmAuctionRemoteApplying = true;
          try { renderAuction(); } finally { hmAuctionRemoteApplying = false; }
        }
      }, function(err){
        console.error("Asta live listener", err);
        hmSetStatus("⚠️ Errore live asta Firebase", "bad");
      });
    }catch(e){ console.error("Asta live listener start", e); }
  }

  function hmAllowedBidTeams(){
    return (Array.isArray(teams)?teams:[]).filter(t=>t.code!=="SVIN" && (hmIsAdmin() || hmCanEditTeam(t.code)));
  }
  function hmRenderBidHistory(){
    const bids = Array.isArray(auctionState?.bids) ? auctionState.bids : [];
    if(!bids.length) return '<div class="muted">Ancora nessuna offerta.</div>';
    return bids.slice().reverse().map((b,i)=>`<div class="playerRow">${hmJersey(b.team,42)}<div><b>${hmEsc(hmTeamLabel(b.team))}</b><div class="muted">Offerta ${hmEsc(b.amount)} crediti · ${hmEsc(b.date||"")}</div></div>${i===0?'<span class="badge">Migliore</span>':''}</div>`).join("");
  }
  function hmRenderPassedTeams(){
    const passed = Array.isArray(auctionState?.passedTeams) ? auctionState.passedTeams : [];
    if(!passed.length) return '<span class="muted">Nessuna squadra ha passato.</span>';
    return passed.map(code=>`<span class="badge">${hmEsc(hmTeamLabel(code))}</span>`).join(" ");
  }

  window.renderAuction = function(){
    hmStartLiveListener();
    auctionState = auctionState || {playerId:"",manualPlayer:null,bids:[],activeTeams:[],passedTeams:[],winner:null,history:[]};
    const p = hmAuctionPlayer();
    const bid = hmHighestBid();
    const teamsAllowed = hmAllowedBidTeams();
    const nextMin = bid ? Number(bid.amount||0)+1 : 1;
    const liveBadge = '<span class="badge">🟢 Asta live Firebase</span>';
    const noTeamsMsg = teamsAllowed.length ? "" : '<div class="muted" style="margin-top:8px">Login richiesto o nessuna squadra abilitata alle offerte.</div>';

    const auctionHtml = p ? `
      <div class="playerRow">
        ${hmJersey(p.owner||"SVIN",54)}
        <div><b>${hmEsc(p.name)}</b><div class="muted">${hmEsc(p.role||"")} · ${hmEsc(p.current||"")} · proprietario ${hmEsc(p.owner||"SVIN")}</div></div>
        <button class="btn red" type="button" onclick="resetAuction()">Annulla asta</button>
      </div>
      <div class="stat" style="margin-top:12px">
        <div class="muted">Offerta più alta</div>
        <div class="n">${bid?hmEsc(bid.amount)+" crediti":"Nessuna"}</div>
        <div>${bid?hmTeamLabel(bid.team):"Base minima 1 credito"}</div>
      </div>
      <div class="grid grid2" style="margin-top:12px">
        <label>Squadra
          <select id="bidTeam" class="input">${teamsAllowed.map(t=>`<option value="${hmEsc(t.code)}">${hmEsc(hmTeamLabel(t.code))} · crediti ${hmEsc(t.credits??0)}</option>`).join("")}</select>
        </label>
        <label>Offerta
          <input id="bidAmount" class="input" type="number" min="${nextMin}" value="${nextMin}">
        </label>
      </div>
      ${noTeamsMsg}
      <div class="row" style="margin-top:12px">
        <button class="btn green" type="button" onclick="placeBid()" ${teamsAllowed.length?'':'disabled'}>Fai offerta live</button>
        <button class="btn yellow" type="button" onclick="passAuction()" ${teamsAllowed.length?'':'disabled'}>Passo</button>
        <button class="btn primary" type="button" style="font-size:24px" onclick="hammerAuction()" ${hmIsAdmin()?'':'disabled'}>🔨</button>
      </div>
      <div class="card" style="margin-top:14px"><h3>Offerte live</h3>${hmRenderBidHistory()}</div>
      <div class="card" style="margin-top:14px"><h3>Squadre che hanno passato</h3>${hmRenderPassedTeams()}</div>
    ` : `<div class="muted">Nessun calciatore selezionato. Cerca un calciatore a sinistra oppure aggiungilo manualmente.</div>`;

    const root = document.getElementById("view-auction");
    if(!root) return;
    root.innerHTML = `
      <div class="between"><h2>🔨 Asta</h2><div class="row">${liveBadge}<span class="badge">Aggiornamento automatico</span></div></div>
      <div class="grid grid2" style="margin-top:14px">
        <div class="card">
          <h3>Cerca calciatore</h3>
          <input id="aucSearch" class="input" placeholder="Nome..." oninput="renderAuctionSearchResults()">
          <button class="btn primary" type="button" style="margin-top:10px" onclick="openManualAuctionPlayer()">Aggiungi manualmente</button>
          <div id="auctionSearchResults" style="margin-top:12px"></div>
        </div>
        <div class="card"><h3>Asta in corso</h3>${auctionHtml}</div>
      </div>
      <div class="card" style="margin-top:14px">
        <div class="between">
          <h3>Riepilogo storico asta</h3>
          <button class="btn red" type="button" onclick="clearAuctionHistory()" ${hmIsAdmin()?'':'disabled'}>AZZERA storico asta</button>
        </div>
        <div class="muted" style="margin-bottom:10px">Qui puoi correggere prezzo o squadra se hai sbagliato, eliminare una riga dallo storico o annullare proprio l'operazione.</div>
        ${hmRenderAuctionHistorySummary()}
      </div>`;
    try{ renderAuctionSearchResults(); }catch(e){}
    try{ if(typeof applyPermissionsToVisibleView === "function") applyPermissionsToVisibleView(); }catch(e){}
  };

  window.renderAuctionSearchResults = function(){
    const box = document.getElementById("auctionSearchResults");
    if(!box) return;
    const s = (document.getElementById("aucSearch")?.value || "").toLowerCase();
    const list = (Array.isArray(players)?players:[]).filter(p=>[p.name,p.role,p.current,p.owner].join(" ").toLowerCase().includes(s)).slice(0,50);
    box.innerHTML = list.map(p=>`<div class="playerRow">${hmJersey(p.owner||"SVIN",44)}<div><b>${hmEsc(p.name)}</b><div class="muted">${hmEsc(p.role)} · ${hmEsc(p.current)} · ${hmEsc(p.owner)}</div></div><button class="btn primary" type="button" onclick="startAuction('${hmEsc(p.id)}')">Metti in asta</button></div>`).join("") || '<div class="muted">Nessun calciatore trovato.</div>';
  };

  window.startAuction = async function(id){
    if(!id) return;
    if(!hmIsAdmin() && !currentUser?.role){ alert("Devi fare login per avviare un'asta."); return; }
    const p = (players||[]).find(x=>String(x.id)===String(id));
    if(!p){ alert("Calciatore non trovato."); return; }
    auctionState = Object.assign({}, auctionState||{}, {playerId:id, manualPlayer:null, bids:[], activeTeams:[], passedTeams:[], winner:null});
    hmSaveLocal();
    try { await hmPushAuctionState({createdAt:new Date().toISOString()}); hmSetStatus("🟢 Asta live aggiornata", "ok"); }
    catch(e){ console.error(e); alert("Errore avvio asta Firebase: "+(e.code||e.message||e)); }
    renderAuction();
  };

  window.openManualAuctionPlayer = async function(){
    const name = prompt("Nome calciatore");
    if(!name) return;
    const p = {id:"P"+Date.now(),name,role:prompt("Ruolo","")||"",current:"",owner:"SVIN",status:"ASTA",bonus:"",contract:"0",deadline:""};
    players.push(p);
    hmSaveLocal();
    await window.startAuction(p.id);
  };

  window.placeBid = async function(){
    if(hmAuctionBusy) return;
    const p = hmAuctionPlayer();
    if(!p){ alert("Nessun calciatore in asta."); return; }
    const teamCode = document.getElementById("bidTeam")?.value;
    const amount = Number(document.getElementById("bidAmount")?.value || 0);
    if(!teamCode){ alert("Seleziona la squadra."); return; }
    if(!hmIsAdmin() && !hmCanEditTeam(teamCode)){ alert("Puoi offrire solo con le tue squadre."); return; }
    const t = hmTeam(teamCode);
    if(t && Number(t.credits||0) < amount){ alert("Crediti insufficienti per questa offerta."); return; }
    const ref = hmAuctionRef();
    if(!ref){ alert("Firebase non pronto."); return; }
    hmAuctionBusy = true;
    try{
      const db = hmFirebaseDb();
      await db.runTransaction(async tx=>{
        const snap = await tx.get(ref);
        const live = snap.exists ? hmNormalizeAuctionDoc(snap.data()) : hmNormalizeAuctionDoc(auctionState);
        if(String(live.playerId||"") !== String(auctionState.playerId||"")) throw new Error("Asta cambiata: aggiorna e riprova.");
        const liveBid = hmHighestBidFrom(live);
        const min = liveBid ? Number(liveBid.amount||0)+1 : 1;
        if(amount < min) throw new Error("Offerta minima "+min);
        const passed = (live.passedTeams||[]).filter(c=>c!==teamCode);
        const bids = [...(live.bids||[]), {team:teamCode, amount, date:hmNow(), user:currentUser?.username||"utente"}];
        tx.set(ref, Object.assign({}, live, {bids, passedTeams:passed, winner:null, updatedAt:new Date().toISOString(), updatedBy:currentUser?.username||"utente"}), {merge:false});
      });
      hmSetStatus("🟢 Offerta live salvata", "ok");
    }catch(e){ console.error(e); alert("Offerta non registrata: "+(e.message||e)); }
    finally{ hmAuctionBusy = false; }
  };

  window.passAuction = async function(){
    const teamCode = document.getElementById("bidTeam")?.value;
    if(!teamCode){ alert("Seleziona la squadra."); return; }
    if(!hmIsAdmin() && !hmCanEditTeam(teamCode)){ alert("Puoi passare solo con le tue squadre."); return; }
    const ref = hmAuctionRef();
    if(!ref){ alert("Firebase non pronto."); return; }
    try{
      const db = hmFirebaseDb();
      await db.runTransaction(async tx=>{
        const snap = await tx.get(ref);
        const live = snap.exists ? hmNormalizeAuctionDoc(snap.data()) : hmNormalizeAuctionDoc(auctionState);
        const passed = Array.from(new Set([...(live.passedTeams||[]), teamCode]));
        tx.set(ref, Object.assign({}, live, {passedTeams:passed, updatedAt:new Date().toISOString(), updatedBy:currentUser?.username||"utente"}), {merge:false});
      });
    }catch(e){ console.error(e); alert("Errore Passo: "+(e.message||e)); }
  };

  window.hammerAuction = async function(){
    if(!hmIsAdmin()){ alert("Solo admin può aggiudicare l'asta."); return; }
    const ref = hmAuctionRef();
    const p = hmAuctionPlayer();
    const bid = hmHighestBid();
    if(!p || !bid){ alert("Serve almeno un'offerta."); return; }
    const t = hmTeam(bid.team);
    if(t && Number(t.credits||0) < Number(bid.amount||0)){
      if(!confirm("La squadra sembra non avere crediti sufficienti. Vuoi aggiudicare comunque?")) return;
    }
    const oldOwner = p.owner, oldCurrent = p.current, oldCredits = t?.credits;
    p.owner = bid.team;
    p.current = bid.team;
    if(t) t.credits = (Number(t.credits)||0) - Number(bid.amount||0);
    auctionState.history = Array.isArray(auctionState.history) ? auctionState.history : [];
    auctionState.history.unshift({playerId:p.id,playerName:p.name,team:bid.team,amount:bid.amount,oldOwner,oldCurrent,oldCredits,date:hmNow()});
    auctionState.playerId = "";
    auctionState.manualPlayer = null;
    auctionState.bids = [];
    auctionState.activeTeams = [];
    auctionState.passedTeams = [];
    auctionState.winner = {playerId:p.id, playerName:p.name, team:bid.team, amount:bid.amount, date:hmNow()};
    try{
      if(ref) await ref.set(hmCurrentAuctionDoc({playerId:"",manualPlayer:null,bids:[],activeTeams:[],passedTeams:[],winner:auctionState.winner}), {merge:false});
      if(typeof saveAll === "function") saveAll(); else hmSaveLocal();
      renderAuction();
    }catch(e){ console.error(e); alert("Errore aggiudicazione asta: "+(e.code||e.message||e)); }
  };

  window.resetAuction = async function(){
    if(!hmIsAdmin()){ alert("Solo admin può annullare l'asta."); return; }
    auctionState.playerId=""; auctionState.manualPlayer=null; auctionState.bids=[]; auctionState.activeTeams=[]; auctionState.passedTeams=[]; auctionState.winner=null;
    hmSaveLocal();
    try{ await hmPushAuctionState({playerId:"",manualPlayer:null,bids:[],activeTeams:[],passedTeams:[],winner:null}); }
    catch(e){ console.error(e); alert("Errore reset asta Firebase: "+(e.code||e.message||e)); }
    renderAuction();
  };

  // Lo storico resta nel salvataggio generale; undo solo admin.
  const oldUndo = window.undoAuctionOperation;
  window.undoAuctionOperation = function(i){
    if(!hmIsAdmin()){ alert("Solo admin può annullare un'operazione d'asta."); return; }
    if(typeof oldUndo === "function") return oldUndo(i);
  };


  function hmRenderAuctionHistorySummary(){
    const rows = Array.isArray(auctionState?.history) ? auctionState.history : [];
    if(!rows.length) return '<div class="muted">Nessuna operazione.</div>';
    return rows.map((h,i)=>`
      <div class="playerRow" style="grid-template-columns:60px 1fr auto">
        ${hmJersey(h.team,42)}
        <div>
          <b>${hmEsc(h.playerName||'Calciatore')}</b>
          <div class="muted">${hmEsc(h.date||'')} · ${hmEsc(hmTeamLabel(h.team))} · ${hmEsc(h.amount)} crediti</div>
        </div>
        <div class="row" style="justify-content:flex-end">
          <button class="btn yellow" type="button" onclick="editAuctionHistoryItem(${i})" ${hmIsAdmin()?'':'disabled'}>Modifica</button>
          <button class="btn red" type="button" onclick="deleteAuctionHistoryItem(${i})" ${hmIsAdmin()?'':'disabled'}>Elimina</button>
          <button class="btn" type="button" onclick="undoAuctionOperation(${i})" ${hmIsAdmin()?'':'disabled'}>Annulla operazione</button>
        </div>
      </div>`).join('');
  }

  function hmAuctionHistoryTeamOptions(selected){
    return (Array.isArray(teams)?teams:[])
      .filter(t=>t.code && t.code!=="SVIN")
      .map(t=>`<option value="${hmEsc(t.code)}" ${String(t.code)===String(selected)?'selected':''}>${hmEsc(hmTeamLabel(t.code))} · crediti ${hmEsc(t.credits??0)}</option>`)
      .join('');
  }

  window.editAuctionHistoryItem = function(i){
    if(!hmIsAdmin()){ alert("Solo admin può modificare lo storico asta."); return; }
    const h = Array.isArray(auctionState?.history) ? auctionState.history[i] : null;
    if(!h){ alert("Operazione non trovata."); return; }
    const modal = document.getElementById("tradeModal");
    const body = document.getElementById("tradeModalBody");
    if(!modal || !body) return;
    body.innerHTML = `
      <h3>Modifica operazione asta</h3>
      <p class="muted">Corregge il riepilogo e aggiorna anche proprietario del calciatore e crediti delle squadre.</p>
      <div class="grid grid2">
        <label>Calciatore<input class="input" value="${hmEsc(h.playerName||'')}" disabled></label>
        <label>Data<input class="input" value="${hmEsc(h.date||'')}" disabled></label>
        <label>Squadra vincente<select id="aucHistTeam" class="input">${hmAuctionHistoryTeamOptions(h.team)}</select></label>
        <label>Costo<input id="aucHistAmount" class="input" type="number" min="0" value="${hmEsc(h.amount||0)}"></label>
      </div>
      <div class="row" style="justify-content:flex-end;margin-top:14px">
        <button class="btn" type="button" onclick="closeTradeModal()">Annulla</button>
        <button class="btn green" type="button" onclick="saveAuctionHistoryEdit(${i})">Salva modifica</button>
      </div>`;
    modal.style.display="flex";
  };

  window.saveAuctionHistoryEdit = function(i){
    if(!hmIsAdmin()){ alert("Solo admin può modificare lo storico asta."); return; }
    const rows = Array.isArray(auctionState?.history) ? auctionState.history : [];
    const h = rows[i];
    if(!h){ alert("Operazione non trovata."); return; }
    const newTeam = String(document.getElementById("aucHistTeam")?.value||"").trim().toUpperCase();
    const newAmount = Number(document.getElementById("aucHistAmount")?.value||0);
    if(!newTeam || newTeam==="SVIN"){ alert("Seleziona una squadra valida."); return; }
    if(!Number.isFinite(newAmount) || newAmount < 0){ alert("Inserisci un costo valido."); return; }

    const oldTeam = String(h.team||"").toUpperCase();
    const oldAmount = Number(h.amount||0);
    const oldT = hmTeam(oldTeam);
    const newT = hmTeam(newTeam);

    // Correzione crediti: rimborsa la vecchia squadra e scala la nuova.
    if(oldT) oldT.credits = (Number(oldT.credits)||0) + oldAmount;
    if(newT) newT.credits = (Number(newT.credits)||0) - newAmount;

    const p = (players||[]).find(x=>String(x.id)===String(h.playerId));
    if(p){ p.owner = newTeam; p.current = newTeam; }

    h.team = newTeam;
    h.amount = newAmount;
    h.editedAt = hmNow();
    h.editedBy = currentUser?.username || "admin";

    try{ if(typeof saveAll === "function") saveAll(); else hmSaveLocal(); }
    catch(e){ console.error(e); hmSaveLocal(); }
    try{ closeTradeModal(); }catch(e){}
    renderAuction();
  };

  window.deleteAuctionHistoryItem = function(i){
    if(!hmIsAdmin()){ alert("Solo admin può eliminare righe dallo storico asta."); return; }
    const rows = Array.isArray(auctionState?.history) ? auctionState.history : [];
    const h = rows[i];
    if(!h) return;
    if(!confirm(`Eliminare dal riepilogo l'operazione di ${h.playerName||'questo calciatore'}?\n\nNon annulla il trasferimento e non modifica i crediti: cancella solo la riga dallo storico.`)) return;
    rows.splice(i,1);
    try{ if(typeof saveAll === "function") saveAll(); else hmSaveLocal(); }
    catch(e){ console.error(e); hmSaveLocal(); }
    renderAuction();
  };

  window.clearAuctionHistory = function(){
    if(!hmIsAdmin()){ alert("Solo admin può azzerare lo storico asta."); return; }
    const count = Array.isArray(auctionState?.history) ? auctionState.history.length : 0;
    if(!count){ alert("Storico asta già vuoto."); return; }
    if(!confirm(`AZZERARE lo storico asta (${count} operazioni)?\n\nNon ripristina calciatori e crediti. Cancella solo il riepilogo per alleggerire l'elenco.`)) return;
    auctionState.history = [];
    try{ if(typeof saveAll === "function") saveAll(); else hmSaveLocal(); }
    catch(e){ console.error(e); hmSaveLocal(); }
    renderAuction();
  };

  document.addEventListener("DOMContentLoaded",()=>setTimeout(hmStartLiveListener,800));
  if(document.readyState !== "loading") setTimeout(hmStartLiveListener,800);
})();
</script>

  async function savePresidentAllowedOnline(){

  function openInternalLogin(){

        <button class="btn" type="button" onclick="closeTradeModal()">Annulla</button>
        <button class="btn green" type="button" id="hmInternalLoginEnter" onclick="hmLoginInternal()">Entra</button>
      </div>`;
    modal.style.display = "flex";
  }
  window.openLoginModal = openInternalLogin;
  window.hmLoginInternal = async function(){
    const u = norm($("hmLoginUser")?.value);
    const p = String($("hmLoginPass")?.value||"").trim();
    const rec = USERS[u];
    if(!rec || rec.password !== p){ alert("Utente o password errati."); return false; }
    setInternal({username:rec.name, role:rec.role, teams:[...rec.teams]});
    await ensureAnonAuth();
    setInternal({username:rec.name, role:rec.role, teams:[...rec.teams]});
    try{ closeTradeModal(); }catch(e){}
    updateInternalUI();
    try{ if(typeof renderCurrentView === "function") renderCurrentView(); }catch(e){}
    applyInternalPermissions();
    return true;
  };
  window.loginUser = window.hmLoginInternal;
  window.hmLogoutInternal = function(){
    setInternal({username:"Ospite", role:"guest", teams:[]});

    try{ closeTradeModal(); }catch(e){}
    updateInternalUI();
    try{ if(typeof renderCurrentView === "function") renderCurrentView(); }catch(e){}
  };
  window.logoutUser = window.hmLogoutInternal;

  function patchLoginButton(){
    const old = $("hmFirebaseLoginBtn");
    if(old && old.dataset.internalClean !== "1"){
      const clone = old.cloneNode(true);
      clone.dataset.internalClean = "1";
      clone.type = "button";

      sb.parentNode.replaceChild(clone, sb);

    patchAuthFunctions();
    patchLoginButton();
    const lb = $("hmFirebaseLoginBtn");

  function patchAuthFunctions(){
    isAdmin = function(){ return internalAdmin(); };
    isLoggedIn = function(){ return internalLogged(); };
    userTeams = function(){ return internalTeams(); };
    canEditTeam = function(c){ return internalCanTeam(c); };

    requireAdmin = function(){ return internalAdmin() || denied("Solo Federico admin può modificare."); };
    requireLogin = function(){ return internalLogged() || denied("Devi fare login per modificare."); };
    requireTeam = function(c){ return internalCanTeam(c) || denied("Puoi modificare solo le tue squadre."); };
    Object.assign(window,{isAdmin,isLoggedIn,userTeams,canEditTeam,canEditPlayerObj,requireAdmin,requireLogin,requireTeam});
  }

  function allowElement(el){
    if(!el) return true;
    if(el.closest && el.closest("#tradeModal")) return true;
    if(el.classList && (el.classList.contains("navbtn") || el.classList.contains("tab"))) return true;
    if(el.id === "hmFirebaseLoginBtn" || el.id === "hmFirebaseSaveBtn") return true;
    const on = String(el.getAttribute && el.getAttribute("onclick") || "");
    if(on.includes("showView(") || on.includes("openTeam(") || on.includes("teamSub(") || on.includes("closeTradeModal")) return true;
    if(internalAdmin()) return true;
    if(!internalLogged()) return false;
    const view = (typeof currentVisibleViewName === "function") ? currentVisibleViewName() : "";
    if(view === "teamDetail" && internalCanTeam(selectedTeam)){
      const form = el.closest && (el.closest("#teamSub-formazione") || el.closest("#pitchBox"));
      if(form) return true;
      if(on.includes("renderPitch(") || on.includes("saveFormationSlot(") || on.includes("clearFormation(") || on.includes("Salva formazione")) return true;
    }
    if(view === "trades"){
      if(on.includes("changeTradeTeam(") || on.includes("toggleTradePlayer(") || on.includes("openTradeReview(") || on.includes("resetTradeForm")) return true;
      if(on.includes("confirmTradeFromModal")) return true;
      if(el.id === "tradeFrom" || el.id === "tradeTo") return true;
      if(el.closest && (el.closest("#offerPlayers") || el.closest("#requestPlayers") || el.closest("#draftTradeSummary"))) return true;
    }
    if(view === "auction"){
      if(on.includes("placeBid(") || on.includes("passAuction") || el.id === "bidTeam" || el.id === "bidAmount") return true;
    }
    return false;
  }
  function applyInternalPermissions(){
    patchAuthFunctions();
    updateInternalUI();
    document.querySelectorAll("button,input,select,textarea").forEach(el=>{
      const ok = allowElement(el);
      el.disabled = !ok;
      if(el.tagName === "BUTTON" || el.tagName === "INPUT" || el.tagName === "SELECT" || el.tagName === "TEXTAREA") el.style.opacity = ok ? "1" : ".45";

    const back = $("hmDownloadBackupBtn"); if(back && !internalAdmin()){ back.disabled=true; back.style.opacity=".45"; }

  window.applyPermissionsToVisibleView = applyInternalPermissions;

  window.clearFormation = clearFormation = function(c){

    if(oldRenderPitch) oldRenderPitch(c);

  function itemSummary(it){
    const p=(players||[]).find(x=>x.id===it.id);
    return `<li>${esc2(p?.name||it.id)} · ${esc2(it.type||"D")} · ${esc2(it.cost||0)} cr</li>`;

  function loadPendingLocal(){

  async function loadPendingFromFirebase(){
    try{
      const fdb = db(); if(!fdb) return;
      const doc = await fdb.collection("hmleague").doc("main").collection("parts").doc("core").get();
      const arr = doc.exists && Array.isArray(doc.data().pendingTrades) ? doc.data().pendingTrades : null;
      if(arr){ window.pendingTrades = arr; savePendingLocal(); }
    }catch(e){ console.warn("Pending trades non caricati", e); }
  }
  window.hmLoadPendingFromFirebase = loadPendingFromFirebase;

  function currentTradeInvolvesUser(t){ return internalAdmin() || internalCanTeam(t?.from) || internalCanTeam(t?.to); }

  const oldRenderTrades = typeof renderTrades === "function" ? renderTrades : null;
  window.renderTrades = renderTrades = function(){
    if(oldRenderTrades) oldRenderTrades();
    const container = $("view-trades");

      container.appendChild(div);

  window.renderPendingTrades = function(){
    const list = loadPendingLocal();

      const realIndex = list.indexOf(t);
      return `<div class="tradePlayer"><div class="between"><div><b>${esc2(t.from)} ⇄ ${esc2(t.to)}</b><div class="muted">Proposta da ${esc2(t.createdBy||"")} · ${esc2(t.date||"")}</div></div><div class="row">${internalAdmin()?`<button class="btn green" onclick="approvePendingTrade(${realIndex})">Approva</button><button class="btn red" onclick="rejectPendingTrade(${realIndex})">Rifiuta/Elimina</button>`:""}</div></div><div class="grid grid2"><div><h4>${esc2(t.from)} cede</h4><ul>${(t.offer||[]).map(itemSummary).join("")||"<li>Nessuno</li>"}</ul></div><div><h4>${esc2(t.to)} cede</h4><ul>${(t.request||[]).map(itemSummary).join("")||"<li>Nessuno</li>"}</ul></div></div></div>`;
    }).join("") : `<div class="muted">Nessuna proposta in attesa.</div>`;
  };

  function snapshotPlayer(p){ return {id:p.id, owner:p.owner, current:p.current, status:p.status, bonus:p.bonus, contract:p.contract, deadline:p.deadline, ransom:p.ransom}; }
  function restoreSnapshot(s){ const p=(players||[]).find(x=>x.id===s.id); if(!p)return; Object.keys(s).forEach(k=>{ if(k!=="id") p[k]=s[k]; }); }
  function applyTradeOfficial(t){
    const restore=[];
    const budgetRestore=(teams||[]).map(tm=>({code:tm.code,credits:tm.credits,hmcoin:tm.hmcoin}));
    function transfer(item,newTeam){
      const p=(players||[]).find(x=>x.id===item.id); if(!p)return;
      restore.push(snapshotPlayer(p));
      const typ = String(item.type||"D").trim() || "D";
      if(typ === "D") { p.owner = newTeam; p.current = newTeam; p.status = "D"; }
      else { p.current = newTeam; p.status = typ; }
      if(item.bonus !== undefined) p.bonus = String(item.bonus||"").trim();
      if(item.ransom !== undefined && String(item.ransom||"").trim()) { p.ransom = String(item.ransom).trim(); if(typ==="PD" || typ==="PO") p.deadline = "Riscatto " + String(item.ransom).trim(); }
    }
    (t.offer||[]).forEach(it=>{ if(typeof moveCredits === "function") moveCredits(t.to,t.from,it.cost); transfer(it,t.to); });
    (t.request||[]).forEach(it=>{ if(typeof moveCredits === "function") moveCredits(t.from,t.to,it.cost); transfer(it,t.from); });
    const registered = Object.assign({}, JSON.parse(JSON.stringify(t)), {id:t.id||("T"+Date.now()), date:new Date().toLocaleString("it-IT"), restore, budgetRestore, applied:true});
    trades.unshift(registered);
    if(typeof createAutoTradeNews === "function") createAutoTradeNews(registered);
    else news.unshift({title:`UFFICIALE: scambio registrato tra ${teamFullName(registered.from)} e ${teamFullName(registered.to)}`,type:"Trasferimento",body:`Scambio registrato tra ${teamFullName(registered.from)} e ${teamFullName(registered.to)}.`,author:"Ufficio Comunicati HM League",pinned:false,date:new Date().toLocaleDateString("it-IT")});
    return registered;
  }

  window.confirmTradeFromModal = confirmTradeFromModal = function(){
    try{
      const t = JSON.parse(JSON.stringify(pendingTrade || tradeState || {}));
      t.offer = Array.isArray(t.offer) ? t.offer : [];
      t.request = Array.isArray(t.request) ? t.request : [];
      if(!t.from || !t.to) return denied("Seleziona le squadre dello scambio.");
      if(!t.offer.length && !t.request.length) return denied("Seleziona almeno un calciatore.");
      if(!internalAdmin() && !currentTradeInvolvesUser(t)) return denied("Puoi proporre solo scambi che coinvolgono una tua squadra.");
      if(internalAdmin()){
