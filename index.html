<script>
/* =========================================================
   FIX MIRATO SOLO SCAMBI IN ATTESA
   - il salvataggio generale Firebase include sempre pendingTrades
   - approva/rifiuta sincronizzano subito la lista in cloud
   - se admin elimina una proposta, non resta nella memoria dei presidenti
   ========================================================= */
(function(){
  const PENDING_KEY = "hm_pending_trades_v1";
  function safePending(){
    try{
      if(!Array.isArray(window.pendingTrades)) window.pendingTrades = JSON.parse(localStorage.getItem(PENDING_KEY)||"[]");
    }catch(e){ window.pendingTrades = []; }
    return window.pendingTrades;
  }
  function savePendingLocalNow(){
    try{ localStorage.setItem(PENDING_KEY, JSON.stringify(safePending())); }catch(e){}
  }
  function firebaseDb(){
    try{
      if(!window.firebase || !firebase.firestore) return null;
      if(firebase.apps && !firebase.apps.length && typeof firebaseConfig !== "undefined") firebase.initializeApp(firebaseConfig);
      return firebase.firestore();
    }catch(e){ return null; }
  }
  async function savePendingCloudNow(){
    savePendingLocalNow();
    const db = firebaseDb();
    if(!db) return false;
    try{
      await db.collection("hmleague").doc("main").collection("parts").doc("core").set({
        pendingTrades: JSON.parse(JSON.stringify(safePending())),
        pendingTradesUpdatedAt: new Date().toISOString()
      }, {merge:true});
      return true;
    }catch(e){
      console.warn("Scambi in attesa non sincronizzati subito", e);
      return false;
    }
  }
  window.hmSavePendingTradesCloudNow = savePendingCloudNow;

  const oldReject = window.rejectPendingTrade;
  window.rejectPendingTrade = rejectPendingTrade = async function(i){
    if(typeof internalAdmin === "function" && !internalAdmin()) return (typeof denied === "function" ? denied("Solo Federico può rifiutare.") : alert("Solo Federico può rifiutare."));
    const list = safePending();
    if(!list[i]) return false;
    if(!confirm("Eliminare questa proposta in attesa?")) return false;
    list.splice(i,1);
    savePendingLocalNow();
    await savePendingCloudNow();
    try{ if(typeof saveAll === "function") saveAll(); }catch(e){}
    try{ if(typeof renderTrades === "function") renderTrades(); }catch(e){}
    return true;
  };

  const oldApprove = window.approvePendingTrade;
  window.approvePendingTrade = approvePendingTrade = async function(i){
    if(typeof internalAdmin === "function" && !internalAdmin()) return (typeof denied === "function" ? denied("Solo Federico può approvare.") : alert("Solo Federico può approvare."));
    const list = safePending();
    const t = list[i];
    if(!t) return false;
    if(!confirm("Approvare e rendere ufficiale questo scambio?")) return false;
    list.splice(i,1);
    savePendingLocalNow();
    await savePendingCloudNow();
    try{
      if(typeof applyTradeOfficial === "function") applyTradeOfficial(t);
      else if(oldApprove) return oldApprove.call(this,i);
      if(typeof saveAll === "function") saveAll();
      if(typeof renderTrades === "function") renderTrades();
    }catch(e){ console.error(e); alert("Errore approvazione scambio: "+(e.message||e)); }
    return true;
  };

  // Quando un presidente invia una nuova proposta, forza la sincronizzazione immediata della lista pending.
  const oldConfirm = window.confirmTradeFromModal;
  window.confirmTradeFromModal = confirmTradeFromModal = async function(){
    const before = safePending().length;
    const res = oldConfirm ? oldConfirm.apply(this, arguments) : false;
    setTimeout(()=>{
      const after = safePending().length;
      if(after !== before) savePendingCloudNow();
    }, 150);
    return res;
  };
})();
</script>


<script>
/* =========================================================
   FIX SOLO APPROVAZIONE SCAMBIO IN ATTESA
   Problema: l'ultimo override chiamava applyTradeOfficial, ma quella
   funzione era dentro un blocco locale e quindi non era visibile qui.
   Risultato: approvando una proposta la toglieva dall'attesa, ma non
   registrava lo scambio e non creava il comunicato.
   Questo blocco sovrascrive SOLO approvePendingTrade.
   ========================================================= */
(function(){
  const PENDING_KEY = "hm_pending_trades_v1";
  const escMsg = (m)=>String(m||"");

  function pendingList(){
    try{
      if(!Array.isArray(window.pendingTrades)) window.pendingTrades = JSON.parse(localStorage.getItem(PENDING_KEY)||"[]");
    }catch(e){ window.pendingTrades = []; }
    return window.pendingTrades;
  }
  function savePendingLocal(){
    try{ localStorage.setItem(PENDING_KEY, JSON.stringify(pendingList())); }catch(e){}
  }
  function playerSnapshot(p){
    return {id:p.id, owner:p.owner, current:p.current, status:p.status, bonus:p.bonus, contract:p.contract, deadline:p.deadline, ransom:p.ransom};
  }
  function applyPendingTradeAsOfficial(t){
    const restore = [];
    const budgetRestore = (Array.isArray(teams)?teams:[]).map(tm=>({code:tm.code, credits:tm.credits, hmcoin:tm.hmcoin}));

    function transfer(item, newTeam){
      const p = (Array.isArray(players)?players:[]).find(x=>x.id===item.id);
      if(!p) return;
      restore.push(playerSnapshot(p));
      const typ = String(item.type || "D").trim() || "D";

      // Definitivo: cartellino e rosa passano alla nuova squadra.
      if(typ === "D"){
        p.owner = newTeam;
        p.current = newTeam;
        p.status = "D";
      }else{
        // Prestito/obbligo/diritto: resta proprietario originale, cambia squadra attuale.
        p.current = newTeam;
        p.status = typ;
      }

      if(item.bonus !== undefined) p.bonus = String(item.bonus || "").trim();
      if(item.ransom !== undefined && String(item.ransom || "").trim()){
        p.ransom = String(item.ransom).trim();
        if(typ === "PD" || typ === "PO") p.deadline = "Riscatto " + String(item.ransom).trim();
      }
    }

    (t.offer || []).forEach(it=>{
      if(typeof moveCredits === "function") moveCredits(t.to, t.from, it.cost);
      transfer(it, t.to);
    });
    (t.request || []).forEach(it=>{
      if(typeof moveCredits === "function") moveCredits(t.from, t.to, it.cost);
      transfer(it, t.from);
    });

    const registered = Object.assign({}, JSON.parse(JSON.stringify(t)), {
      id: t.id && String(t.id).startsWith("T") ? t.id : ("T" + Date.now()),
      pendingId: t.id || "",
      date: new Date().toLocaleString("it-IT"),
      restore,
      budgetRestore,
      applied: true
    });

    if(!Array.isArray(trades)) trades = [];
    trades.unshift(registered);

    if(typeof createAutoTradeNews === "function"){
      createAutoTradeNews(registered);
    }else{
      if(!Array.isArray(news)) news = [];
      news.unshift({
        title:`UFFICIALE: scambio registrato tra ${typeof teamFullName === "function" ? teamFullName(registered.from) : registered.from} e ${typeof teamFullName === "function" ? teamFullName(registered.to) : registered.to}`,
        type:"Trasferimento",
        body:`Scambio registrato tra ${registered.from} e ${registered.to}.`,
        author:"Ufficio Comunicati HM League",
        pinned:false,
        date:new Date().toLocaleDateString("it-IT")
      });
    }
    return registered;
  }

  window.approvePendingTrade = approvePendingTrade = async function(i){
    if(typeof internalAdmin === "function" && !internalAdmin()){
      return typeof denied === "function" ? denied("Solo Federico può approvare.") : alert("Solo Federico può approvare.");
    }
    const list = pendingList();
    const t = list[i];
    if(!t) return false;
    if(!confirm("Approvare e rendere ufficiale questo scambio?")) return false;

    try{
      // 1) applica davvero lo scambio prima di togliere la proposta
      applyPendingTradeAsOfficial(t);

      // 2) rimuove la proposta dall'attesa locale/cloud
      list.splice(i,1);
      savePendingLocal();
      if(typeof window.hmSavePendingTradesCloudNow === "function") await window.hmSavePendingTradesCloudNow();

      // 3) salva tutto: trades, players, news/comunicato, crediti
      if(typeof saveAll === "function") saveAll();
      if(typeof renderTrades === "function") renderTrades();
      if(typeof renderDashboard === "function") renderDashboard();
      alert("Scambio approvato: registrato nello storico, rosa/crediti aggiornati e comunicato creato.");
      return true;
    }catch(e){
      console.error(e);
      alert("Errore approvazione scambio: " + escMsg(e.message || e));
      return false;
    }
  };
})();
</script>


<script>
/* ===== FIX SOLO ALBO D'ORO: competizione a tendina + chiave logo stabile ===== */
(function(){
  const HM_AWARD_PRESETS = [
    {id:"hm_league", name:"HM League", aliases:["HM League","Hm League","HML"]},
    {id:"hm_cup", name:"HM Cup", aliases:["HM Cup","Hm Cup","Coppa HM"]},
    {id:"hm_super_cup", name:"HM Super Cup", aliases:["HM Super Cup","HM Supercup","Hm Supercup","HM SUPERCUP","HM SuperCup","HM Super Cup "]},
    {id:"hm_serie_b", name:"HM Serie B", aliases:["HM Serie B","HMB","HM B","Serie B","HM SerieB"]},
    {id:"coppa_primavera", name:"Coppa Primavera", aliases:["Coppa Primavera","Primavera"]},
    {id:"champions_league", name:"Champions League", aliases:["Champions League","Champions","Champions HM","HM Champions"]},
    {id:"europa_league", name:"Europa League", aliases:["Europa League","Europa","Europa HM","HM Europa"]},
    {id:"supercoppa_europea", name:"Supercoppa Europea", aliases:["Supercoppa Europea","Super Coppa Europea","European Super Cup"]},
    {id:"mondiale_per_club", name:"Mondiale per Club", aliases:["Mondiale per Club","Mondiale Club","Club World Cup"]}
  ];

  function hmNormAwardText(v){
    return String(v||"").replace(/\s+/g," ").trim();
  }
  function hmAwardPresetFor(name){
    const raw = hmNormAwardText(name);
    const low = raw.toLowerCase();
    return HM_AWARD_PRESETS.find(p => p.aliases.some(a => hmNormAwardText(a).toLowerCase() === low));
  }
  function hmAwardDisplayName(name){
    const p = hmAwardPresetFor(name);
    return p ? p.name : hmNormAwardText(name);
  }
  function hmAwardStableKeyFromName(name){
    const p = hmAwardPresetFor(name);
    if(p) return "honor_" + p.id;
    return "honor_" + hmAwardDisplayName(name);
  }
  function hmAwardKeyCandidatesFromName(name){
    const display = hmAwardDisplayName(name);
    const direct = "honor_" + hmNormAwardText(name);
    const stable = hmAwardStableKeyFromName(name);
    const keys = [stable, direct, "honor_" + display];
    const p = hmAwardPresetFor(name);
    if(p){
      p.aliases.forEach(a => keys.push("honor_" + hmNormAwardText(a)));
    }
    return [...new Set(keys.filter(Boolean))];
  }
  function hmGetAwardImage(nameOrKey){
    const s = String(nameOrKey||"");
    const rawName = s.startsWith("honor_") ? s.slice(6) : s;
    const candidates = s.startsWith("honor_") ? [s, ...hmAwardKeyCandidatesFromName(rawName)] : hmAwardKeyCandidatesFromName(rawName);
    for(const k of candidates){
      if(awardImages && awardImages[k]) return awardImages[k];
    }
    return "";
  }
  function hmSaveAwardImageAllKeys(nameOrKey, value){
    const s = String(nameOrKey||"");
    const rawName = s.startsWith("honor_") ? s.slice(6) : s;
    hmAwardKeyCandidatesFromName(rawName).forEach(k => { awardImages[k] = value; });
  }
  function hmAwardOptions(selected){
    const map = new Map();
    HM_AWARD_PRESETS.forEach(p => map.set(p.name, p.name));
    (honors||[]).forEach(h => {
      const n = hmAwardDisplayName(h.award);
      if(n) map.set(n,n);
    });
    if(selected){
      const n = hmAwardDisplayName(selected);
      if(n) map.set(n,n);
    }
    return [...map.values()].sort((a,b)=>{
      const ai = HM_AWARD_PRESETS.findIndex(p=>p.name===a);
      const bi = HM_AWARD_PRESETS.findIndex(p=>p.name===b);
      if(ai>=0 || bi>=0) return (ai<0?999:ai) - (bi<0?999:bi);
      return a.localeCompare(b,'it');
    });
  }
  function hmTeamOptions(selected){

  window.hmSaveHonorFromModal = function(rowIndex){
    const award = hmAwardDisplayName(q("hmHonorAwardSelect")?.value || "HM League");
    const season = q("hmHonorSeasonInput")?.value || "";

    else honors.push(row);

    if(typeof saveAll === "function") saveAll();
    renderCompetitions();
  };

  const oldImgPreview = window.imgPreview;
  window.imgPreview = function(key, size=54){
    if(String(key||"").startsWith("honor_")){
      const src = hmGetAwardImage(key);
      return src ? `<img src="${src}" style="width:${size}px;height:${size}px;object-fit:contain;border-radius:12px;background:#0b1627;border:1px solid #334155;padding:4px">` : `<div class="logoBox" style="width:${size}px;height:${size}px">🏆</div>`;
    }
    return oldImgPreview ? oldImgPreview(key,size) : `<div class="logoBox" style="width:${size}px;height:${size}px">🏆</div>`;

  window.uploadAwardImage = function(input, key){
    const file = input.files && input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const value = reader.result;
      if(String(key||"").startsWith("honor_")) hmSaveAwardImageAllKeys(key, value);
      else awardImages[key] = value;
      if(typeof saveAll === "function") saveAll();
      const view = (typeof currentVisibleViewName === "function") ? currentVisibleViewName() : "";
      if(view === "competitions" && typeof renderCompetitions === "function") renderCompetitions();
      else if(view === "teamDetail" && typeof renderTeamDetail === "function") renderTeamDetail();
      else if(typeof renderCompetitions === "function") renderCompetitions();
    };
    reader.readAsDataURL(file);
  };

  window.renderCompetitions = function(){
    const awards = [...new Set((honors||[]).map(h=>hmAwardDisplayName(h.award)).filter(Boolean))];
    q("view-competitions").innerHTML = `<div class="between"><div><h2>Albo d'oro generale</h2><p class="muted">Si aggiorna insieme agli albi delle singole società.</p></div><button class="btn primary" onclick="addGeneralHonor()">Aggiungi vincitore</button></div>
    <div class="grid" style="margin-top:14px">${awards.length?awards.map(a=>{
      const rows=(honors||[]).map((h,i)=>({...h,_i:i})).filter(h=>hmAwardDisplayName(h.award)===a);
      return `<div class="card"><div class="row">${imgPreview("honor_"+a,64)}<div><h3>${esc(a)}</h3><label class="muted">Logo/coppa <input type="file" accept="image/*" onchange="uploadAwardImage(this,'honor_${esc(a)}')"></label></div></div><table class="table"><tr><th>Stagione</th><th>Vincitore</th><th></th></tr>${rows.map((h,idx)=>`<tr><td>${esc(h.season)}</td><td>${h.team ? teamLabel(h.team) : esc(h.manualTeam || "-")}</td><td><button class="btn" onclick="editGeneralHonor('${esc(a)}',${idx})">Modifica</button><button class="btn red" onclick="deleteGeneralHonor('${esc(a)}',${idx})">Elimina</button></td></tr>`).join("")}</table></div>`;
    }).join(""):'<div class="card muted">Nessun trofeo inserito.</div>'}</div>`;
  };

  window.addGeneralHonor = function(){ hmRenderAwardModal("add", -1); };
  window.editGeneralHonor = function(award, localIndex){
    const display = hmAwardDisplayName(award);
    const list = (honors||[]).map((x,i)=>({...x,_i:i})).filter(x=>hmAwardDisplayName(x.award)===display);
    const row = list[localIndex];
    if(!row) return;
    hmRenderAwardModal("edit", row._i);
  };
  window.deleteGeneralHonor = function(award, localIndex){
    const display = hmAwardDisplayName(award);
    const list = (honors||[]).map((x,i)=>({...x,_i:i})).filter(x=>hmAwardDisplayName(x.award)===display);
    const row = list[localIndex];
    if(!row) return;
    if(!confirm("Eliminare questa voce dall'Albo d'Oro?")) return;
    honors.splice(row._i,1);
    if(typeof saveAll === "function") saveAll();
    renderCompetitions();
  };
})();

// =======================================================
(function(){
  if(window.HM_GLOBAL_RENAME_INSTALLED) return;
  window.HM_GLOBAL_RENAME_INSTALLED = true;

  function hmTeamCodesForRename(){
    try{return (teams||[]).filter(t=>t && t.code && t.code!=="SVIN").map(t=>String(t.code));}
    catch(e){return [];}
  }
  function hmNormCode(v){return String(v||"").trim().toUpperCase();}
  function hmReplaceCodeToken(value, oldCode, newCode){
    if(value === null || value === undefined) return value;
    const s = String(value);
    if(!s) return value;
    if(s === oldCode) return newCode;
    // Sostituisce solo sigle come token separati, evitando nomi/calciatori o parole normali.
    const parts = s.split(/(\s+|\/|,|;|\||\+)/g);
    let changed = false;
    const out = parts.map(p=>{
      if(p === oldCode){changed=true; return newCode;}
      return p;
    }).join("");
    return changed ? out : value;
  }
  function hmDeepReplaceTeamCodes(obj, oldCode, newCode){
    const teamKeys = new Set([
      "code","team","teamCode","owner","current","from","to","winner","winnerCode","loser","loserCode",
      "home","away","club","clubCode","participant","participantCode","champion","runnerUp","teamA","teamB",
      "sourceTeam","targetTeam","fromTeam","toTeam","squadra","proprietario"
    ]);
    function walk(x){
      if(Array.isArray(x)){ x.forEach(walk); return; }
      if(!x || typeof x !== "object") return;
      Object.keys(x).forEach(k=>{
        const v=x[k];
        if(v && typeof v === "object") walk(v);
        else if(typeof v === "string" && teamKeys.has(k)) x[k]=hmReplaceCodeToken(v, oldCode, newCode);
      });
    }
    walk(obj);
  }
  function hmRenameObjectKey(obj, oldKey, newKey){
    if(!obj || typeof obj !== "object") return obj;
    if(Object.prototype.hasOwnProperty.call(obj, oldKey)){
      obj[newKey] = obj[newKey] && typeof obj[newKey]==="object" && typeof obj[oldKey]==="object"
        ? Object.assign({}, obj[oldKey], obj[newKey])
        : obj[oldKey];
      delete obj[oldKey];
    }
    return obj;
  }
  function hmUpdatePaired(oldCode,newCode){
    try{
      if(typeof PAIRED === "object" && PAIRED){
        if(PAIRED[oldCode] !== undefined){ PAIRED[newCode]=PAIRED[oldCode]; delete PAIRED[oldCode]; }
        Object.keys(PAIRED).forEach(k=>{ if(PAIRED[k]===oldCode) PAIRED[k]=newCode; });
      }
    }catch(e){}
  }
  function hmUpdateAuthTeams(oldCode,newCode){
    try{
      if(typeof HM_AUTH_USERS === "object" && HM_AUTH_USERS){
        Object.values(HM_AUTH_USERS).forEach(u=>{
          if(Array.isArray(u.teams)) u.teams = u.teams.map(c=>c===oldCode?newCode:c);
        });
      }
      if(currentUser && Array.isArray(currentUser.teams)){
        currentUser.teams = currentUser.teams.map(c=>c===oldCode?newCode:c);
        safeSetStorage("hm_current_user_v1", currentUser);
      }
    }catch(e){}
  }
  function hmRenameFormations(oldCode,newCode){
    try{
      if(savedFormations && typeof savedFormations === "object"){
        hmRenameObjectKey(savedFormations, oldCode, newCode);
      }
    }catch(e){}
  }
  function hmRenameOrgData(oldCode,newCode){
    try{
      if(orgData && typeof orgData === "object") hmRenameObjectKey(orgData, oldCode, newCode);
    }catch(e){}
  }
  function hmRenameRankingHidden(oldCode,newCode){
    try{
      if(Array.isArray(rankingHidden)) rankingHidden = rankingHidden.map(c=>c===oldCode?newCode:c);
    }catch(e){}
  }
  function hmRenameTeamLogosAndAssets(oldCode,newCode){
    try{
      if(HM_TEAM_LOGO_DRAFTS && HM_TEAM_LOGO_DRAFTS[oldCode]){
        HM_TEAM_LOGO_DRAFTS[newCode]=HM_TEAM_LOGO_DRAFTS[oldCode];
        delete HM_TEAM_LOGO_DRAFTS[oldCode];
      }
    }catch(e){}
  }
  function hmRenameEverywhere(oldCode,newCode,newName){
    const t = (teams||[]).find(x=>x && x.code===oldCode);
    if(!t) throw new Error("Società vecchia non trovata: "+oldCode);
    if((teams||[]).some(x=>x && x.code===newCode && newCode!==oldCode)) throw new Error("La nuova sigla esiste già: "+newCode);

    t.code = newCode;
    if(newName) t.name = newName;

    hmDeepReplaceTeamCodes(players, oldCode, newCode);
    hmDeepReplaceTeamCodes(trades, oldCode, newCode);
    if(typeof pendingTrades !== "undefined") hmDeepReplaceTeamCodes(pendingTrades, oldCode, newCode);
    hmDeepReplaceTeamCodes(honors, oldCode, newCode);
    hmDeepReplaceTeamCodes(individualTitles, oldCode, newCode);
    hmDeepReplaceTeamCodes(positionHistory, oldCode, newCode);
    hmDeepReplaceTeamCodes(rankingData, oldCode, newCode);
    hmDeepReplaceTeamCodes(seasonHistory, oldCode, newCode);
    hmDeepReplaceTeamCodes(auctionState, oldCode, newCode);
    hmDeepReplaceTeamCodes(presidentActions, oldCode, newCode);
    hmDeepReplaceTeamCodes(competitionsManager, oldCode, newCode);
    hmDeepReplaceTeamCodes(coachesManager, oldCode, newCode);
    hmRenameRankingHidden(oldCode,newCode);
    hmRenameFormations(oldCode,newCode);
    hmRenameOrgData(oldCode,newCode);
    hmUpdatePaired(oldCode,newCode);
    hmUpdateAuthTeams(oldCode,newCode);
    hmRenameTeamLogosAndAssets(oldCode,newCode);

    if(selectedTeam===oldCode) selectedTeam=newCode;
  }

  window.hmOpenGlobalRenameTeam = function(){
    if(typeof requireAdmin === "function" && !requireAdmin()) return;
    const options = hmTeamCodesForRename().map(c=>{
      const t=(teams||[]).find(x=>x.code===c);
      return `<option value="${esc(c)}">${esc(c)} - ${esc(t?.name||"")}</option>`;
    }).join("");
    q("tradeModalBody").innerHTML = `
      <h3>Rinomina globale società</h3>
      <p class="muted">Cambia sigla e nome ovunque: rosa, storico, ranking, albo d'oro, scambi, formazioni e dati società. Fai prima un backup.</p>
      <div class="grid grid3">
        <label>Società da rinominare
          <select class="input" id="hmRenameOldCode">${options}</select>
        </label>
        <label>Nuova sigla
          <input class="input" id="hmRenameNewCode" placeholder="Es. NEW" maxlength="6">
        </label>
        <label>Nuovo nome società
          <input class="input" id="hmRenameNewName" placeholder="Nuovo nome">
        </label>
      </div>
      <div class="row" style="justify-content:flex-end;margin-top:14px">
        <button class="btn" onclick="closeTradeModal()">Annulla</button>
        <button class="btn yellow" onclick="hmRunGlobalRenameTeam()">Rinomina globalmente</button>
      </div>`;
    q("tradeModal").style.display="flex";
  };

  window.hmRunGlobalRenameTeam = function(){
    if(typeof requireAdmin === "function" && !requireAdmin()) return;
    const oldCode = hmNormCode(q("hmRenameOldCode")?.value);
    const newCode = hmNormCode(q("hmRenameNewCode")?.value);
    const newName = String(q("hmRenameNewName")?.value||"").trim();
    if(!oldCode || !newCode || !newName){ alert("Compila vecchia sigla, nuova sigla e nuovo nome."); return; }
    if(newCode === "SVIN"){ alert("La sigla SVIN è riservata agli svincolati."); return; }
    if(!/^[A-Z0-9]{2,6}$/.test(newCode)){ alert("La nuova sigla deve avere 2-6 caratteri, solo lettere maiuscole o numeri."); return; }
    if((teams||[]).some(t=>t && t.code===newCode && newCode!==oldCode)){ alert("Esiste già una società con questa sigla."); return; }
    const msg = `Stai per rinominare globalmente ${oldCode} in ${newCode} (${newName}).\n\nQuesta modifica aggiorna rosa, storico, ranking, albo d'oro, scambi e formazioni.\n\nHai fatto un backup?`;
    if(!confirm(msg)) return;
    try{
      hmRenameEverywhere(oldCode,newCode,newName);
      if(saveAll() === false) return;
      closeTradeModal();
      showView("teams");
      alert("Rinomina globale completata: "+oldCode+" → "+newCode);
    }catch(err){
      console.error("Errore rinomina globale", err);
      alert("Errore rinomina globale: "+(err.message||err));
    }
  };

  const hmOldRenderTeams = window.renderTeams || (typeof renderTeams === "function" ? renderTeams : null);
  if(hmOldRenderTeams){
    window.renderTeams = renderTeams = function(){
      hmOldRenderTeams.apply(this, arguments);
      try{
        const box=q("view-teams")?.querySelector(".between");
        if(box && isAdmin && isAdmin() && !q("hmGlobalRenameBtn")){
          box.insertAdjacentHTML("beforeend", `<button class="btn yellow" id="hmGlobalRenameBtn" type="button" onclick="hmOpenGlobalRenameTeam()">🔁 Rinomina globale società</button>`);
        }
      }catch(e){}
    };
  }
})();
</script>



<script>
/* =========================================================
   FIX MIRATO: AZIONI PRESIDENTE + SALVATAGGIO LOCALE
   - Presidenti: possono creare Azioni Presidente solo per le proprie squadre.
   - Admin: mantiene modifica/elimina completo.
   - saveAll(): salva solo in locale e marca modifiche non pubblicate.
   - Salva online resta manuale dal pulsante in alto.
   - Asta live e funzioni Firebase dedicate non vengono modificate.
   ========================================================= */
(function(){
  if(window.HM_ACTIONS_LOCAL_SAVE_FIX) return;
  window.HM_ACTIONS_LOCAL_SAVE_FIX = true;

  function hmQ(id){ return document.getElementById(id); }
  function hmEsc(s){
    try{ return (typeof esc === 'function') ? esc(s) : String(s ?? '').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    catch(e){ return String(s ?? ''); }
  }
  function hmAdmin(){ try{return typeof internalAdmin==='function' ? internalAdmin() : (typeof isAdmin==='function' && isAdmin());}catch(e){return false;} }
  function hmLogged(){ try{return typeof internalLogged==='function' ? internalLogged() : (typeof isLoggedIn==='function' && isLoggedIn());}catch(e){return false;} }
  function hmTeams(){ try{return typeof internalTeams==='function' ? internalTeams() : (typeof userTeams==='function' ? userTeams() : []);}catch(e){return [];} }
  function hmCanTeam(code){ try{return hmAdmin() || (typeof internalCanTeam==='function' ? internalCanTeam(code) : (typeof canEditTeam==='function' && canEditTeam(code)));}catch(e){return false;} }
  function hmDenied(msg){ if(typeof denied==='function') return denied(msg); alert(msg); return false; }
  function hmTeamLabel(code){ try{return typeof teamLabel==='function' ? teamLabel(code) : String(code||'');}catch(e){return String(code||'');} }
  function hmTeamFullName(code){ try{return typeof teamFullName==='function' ? teamFullName(code) : hmTeamLabel(code);}catch(e){return hmTeamLabel(code);} }

  function hmMarkLocalUnsaved(){
    try{ HM_HAS_UNSAVED_CHANGES = true; }catch(e){}
    try{ if(typeof updateCloudBadge === 'function') updateCloudBadge(); }catch(e){}
    try{
      const badge = hmQ('firebaseStatusBadge');
      if(badge){
        badge.textContent = '⚠️ Modifiche locali non pubblicate';
        badge.style.borderColor = '#facc15';
        badge.style.color = '#fde68a';
      }
    }catch(e){}
  }

  // Salvataggio generale: niente online automatico, solo locale.
  window.saveAll = saveAll = function(){
    if(!hmLogged()) return hmDenied('Devi fare login per modificare.');
    try{ if(typeof saveLocalOnly === 'function') saveLocalOnly(); }catch(e){ console.warn('saveLocalOnly non riuscito', e); }
    hmMarkLocalUnsaved();
    return true;
  };

  // Disattiva eventuali chiamate residue all'autosave generale.
  window.scheduleCloudSave = scheduleCloudSave = function(){ hmMarkLocalUnsaved(); return false; };

  function hmActionRows(){
    const rows = Array.isArray(presidentActions) ? presidentActions : [];
    if(!rows.length) return '<tr><td colspan="8" class="muted">Nessuna azione registrata.</td></tr>';
    return rows.map((a,i)=>{
      const canManage = hmAdmin();
      const buttons = canManage
        ? `<button class="btn" onclick="openPresidentActionModal(${i})">Modifica</button><button class="btn red" onclick="deletePresidentAction(${i})">Elimina</button>`
        : '<span class="muted">Solo lettura</span>';
      return `<tr><td>${hmEsc(a.date)}</td><td>${hmTeamLabel(a.team)}</td><td><b>${hmEsc(a.action)}</b></td><td>${a.against?hmTeamFullName(a.against):'-'}</td><td>${hmEsc(a.competition||'-')}</td><td>${a.suspended&&a.status!=='Pagata'?'Sospesi '+hmEsc(a.cost):hmEsc(a.creditDelta)}</td><td><span class="badge">${hmEsc(a.status)}</span></td><td>${buttons}</td></tr>`;
    }).join('');
  }

  window.renderPresidentActions = renderPresidentActions = function(){
    const canCreate = hmAdmin() || hmLogged();
    hmQ('view-actions').innerHTML = `<div class="between"><div><h2>Azioni Presidente</h2><p class="muted">Gestione crediti e registro azioni.</p></div>${canCreate?'<button class="btn primary" onclick="openPresidentActionModal()">Nuova azione</button>':''}</div><div class="card" style="margin-top:14px"><h3>Registro azioni</h3><table class="table"><tr><th>Data</th><th>Squadra</th><th>Azione</th><th>Contro</th><th>Competizione</th><th>Crediti</th><th>Stato</th><th></th></tr>${hmActionRows()}</table></div>`;
  };

  window.openPresidentActionModal = openPresidentActionModal = function(index=null){
    if(!hmLogged()) return hmDenied('Devi fare login per registrare azioni.');
    if(index !== null && !hmAdmin()) return hmDenied('Solo Federico admin può modificare azioni già registrate.');
    const row = index!==null ? presidentActions[index] : {team:(hmTeams()[0]||'IMP'), action:'Ritiro forzato', against:'', competition:'Campionato', status:'Attiva'};
    const selectableTeams = (hmAdmin() ? teams.filter(t=>t.code!=='SVIN') : teams.filter(t=>hmTeams().includes(t.code)));
    if(!selectableTeams.length) return hmDenied('Nessuna squadra autorizzata per questo utente.');
    const teamOptions = selectableTeams.map(t=>`<option value="${hmEsc(t.code)}" ${t.code===row.team?'selected':''}>${hmTeamLabel(t.code)}</option>`).join('');
    const againstOptions = teams.filter(t=>t.code!=='SVIN').map(t=>`<option value="${hmEsc(t.code)}" ${t.code===row.against?'selected':''}>${hmTeamLabel(t.code)}</option>`).join('');
    hmQ('tradeModalBody').innerHTML = `<h3>${index!==null?'Modifica':'Nuova'} azione presidente</h3><div class="grid grid2"><label>Squadra<select class="input" id="paTeam">${teamOptions}</select></label><label>Azione<select class="input" id="paAction">${PRESIDENT_ACTION_TYPES.map(a=>`<option value="${hmEsc(a.name)}" ${a.name===row.action?'selected':''}>${hmEsc(a.name)}</option>`).join('')}</select></label><label>Contro<select class="input" id="paAgainst"><option value="">Nessuna</option>${againstOptions}</select></label><label>Competizione<select class="input" id="paCompetition"><option ${row.competition==='Campionato'?'selected':''}>Campionato</option><option ${row.competition==='Coppa'?'selected':''}>Coppa</option></select></label><label>Stato<select class="input" id="paStatus">${['Attiva','Conclusa','Annullata','Pagata'].map(s=>`<option ${s===row.status?'selected':''}>${s}</option>`).join('')}</select></label></div><p class="muted" style="margin-top:10px">La modifica viene salvata in locale. Per pubblicarla online usa il pulsante <b>Salva online</b>.</p><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" type="button" onclick="closeTradeModal()">Annulla</button><button class="btn green" type="button" onclick="savePresidentAction(${index===null?'null':index})">Salva</button></div>`;
    hmQ('tradeModal').style.display='flex';
  };

  window.savePresidentAction = savePresidentAction = function(index=null){
    if(!hmLogged()) return hmDenied('Devi fare login per registrare azioni.');
    const teamCode = hmQ('paTeam')?.value;
    if(!hmCanTeam(teamCode)) return hmDenied('Puoi registrare azioni solo per le tue squadre.');
    if(index !== null && !hmAdmin()) return hmDenied('Solo Federico admin può modificare azioni già registrate.');
    const a = actionType(hmQ('paAction').value);
    const status = hmQ('paStatus').value;
    const creditDelta = a.suspended ? (status==='Pagata' ? -Number(a.cost) : 0) : -Number(a.cost);
    const row = {team:teamCode, action:a.name, against:hmQ('paAgainst').value, competition:hmQ('paCompetition').value, status, suspended:!!a.suspended, cost:a.cost, creditDelta, date:index===null?new Date().toLocaleString('it-IT'):presidentActions[index].date, applied:false};
    if(index!==null){
      const old=presidentActions[index];
      if(old?.applied) applyPresidentActionCredits(old,true);
      presidentActions[index]=row;
    }else{
      presidentActions.unshift(row);
      index=0;
    }
    if(row.status!=='Annullata'){
      applyPresidentActionCredits(row,false);
      presidentActions[index].applied=true;
    }
    saveAll();
    closeTradeModal();
    renderPresidentActions();
    return true;
  };

  window.deletePresidentAction = deletePresidentAction = function(i){
    if(!hmAdmin()) return hmDenied('Solo Federico admin può eliminare azioni presidente.');

<script>
/* =========================================================
   FIX MIRATO: ADMIN NO AUTOSAVE + FILTRI CALCIATORI PRESIDENTI
   - Admin: saveAll salva solo locale; pubblicazione solo con Salva online.
   - Presidenti: restano salvataggi immediati per azioni consentite.
   - Asta live non toccata.
   - Presidenti possono usare filtri in Calciatori ma non modificare.
   ========================================================= */
(function(){
  if(window.HM_FINAL_NO_AUTOSAVE_FILTERS_FIX) return;
  window.HM_FINAL_NO_AUTOSAVE_FILTERS_FIX = true;

  function qx(id){return document.getElementById(id)}
  function isIntLogged(){try{return typeof internalLogged==='function'?internalLogged():(currentUser&&currentUser.role&&currentUser.role!=='guest');}catch(e){return false}}
  function isIntAdmin(){try{return typeof internalAdmin==='function'?internalAdmin():(currentUser&&currentUser.role==='admin');}catch(e){return false}}
  function isIntTeam(c){try{return typeof internalCanTeam==='function'?internalCanTeam(c):false;}catch(e){return false}}
  function deny2(msg){if(typeof denied==='function') return denied(msg); alert(msg); return false;}
  function markLocal(){
    try{HM_HAS_UNSAVED_CHANGES=true;}catch(e){}
    try{if(typeof saveLocalOnly==='function') saveLocalOnly();}catch(e){}
    try{
      const b=qx('firebaseStatusBadge');
      if(b){b.textContent='⚠️ Modifiche locali non pubblicate'; b.style.borderColor='#facc15'; b.style.color='#fde68a';}
    }catch(e){}
  }

  // Salvataggio generale: admin locale, presidenti online solo attraverso i salvataggi consentiti.
  window.saveAll = saveAll = function(){
    if(!isIntLogged()) return deny2('Devi fare login per modificare.');
    if(isIntAdmin()){
      markLocal();
      return true;
    }
    try{if(typeof saveLocalOnly==='function') saveLocalOnly();}catch(e){}
    if(typeof savePresidentAllowedOnline==='function') return savePresidentAllowedOnline();
    if(typeof window.hmPresidentSaveAllowedOnline==='function') return window.hmPresidentSaveAllowedOnline();
    return true;
  };
  window.scheduleCloudSave = scheduleCloudSave = function(){markLocal(); return false;};

  // Pulsante Salva online: admin pubblica tutto; presidente salva solo dati consentiti.
  const sb = qx('hmFirebaseSaveBtn');
  if(sb){
    sb.disabled = !isIntLogged();
    sb.style.opacity = sb.disabled ? '.45' : '1';
    sb.onclick = function(e){
      e.preventDefault(); e.stopPropagation();
      if(!isIntLogged()) return deny2('Devi fare login per salvare.');
      if(isIntAdmin()){
        if(typeof ensureAnonAuth==='function') ensureAnonAuth().then(ok=>{if(ok && typeof saveCloudNow==='function') saveCloudNow(true);});
        else if(typeof saveCloudNow==='function') saveCloudNow(true);
      }else{
        if(typeof savePresidentAllowedOnline==='function') return savePresidentAllowedOnline();
        if(typeof window.hmPresidentSaveAllowedOnline==='function') return window.hmPresidentSaveAllowedOnline();
      }
    };
  }

  const oldApply = window.applyInternalPermissions || window.applyPermissionsToVisibleView;
  window.applyInternalPermissions = window.applyPermissionsToVisibleView = function(){
    try{ if(typeof oldApply==='function') oldApply(); }catch(e){}
    try{
      const view = typeof currentVisibleViewName==='function' ? currentVisibleViewName() : '';
      if(view === 'players' && isIntLogged() && !isIntAdmin()){
        // filtri calciatori attivi per presidenti
        document.querySelectorAll('#view-players input,#view-players select,#view-players textarea').forEach(el=>{
          const on=String(el.getAttribute('oninput')||'')+String(el.getAttribute('onchange')||'');
          const id=String(el.id||'');
          if(id.startsWith('pl') || on.includes('filterPlayers')){ el.disabled=false; el.style.opacity='1'; }
        });
        document.querySelectorAll('#view-players button').forEach(btn=>{
          const on=String(btn.getAttribute('onclick')||'');
          const allow = on.includes('clearFilters');
          btn.disabled = !allow;
          btn.style.opacity = allow ? '1' : '.45';
          if(!allow) btn.title='Solo Federico può modificare i calciatori';
        });
      }
      // budget sempre bloccato ai presidenti
      if(isIntLogged() && !isIntAdmin()){
        document.querySelectorAll('button[onclick*="editBudget"],button[onclick*="saveBudget"]').forEach(b=>{b.disabled=true; b.style.opacity='.45'; b.title='Solo Federico può modificare il budget';});
      }
    }catch(e){}
  };

  try{ if(typeof applyInternalPermissions==='function') applyInternalPermissions(); }catch(e){}
})();
</script>



<script>
/* =========================================================
   FIX MIRATO: FILTRI CALCIATORI PRESIDENTI + EDITOR RUOLI MODULI
   - Presidenti: filtri Calciatori attivi, modifiche calciatori bloccate.
   - Admin: editor ruoli slot modulo in Formazione.

   ========================================================= */
(function(){
  if(window.HM_FILTERS_MODULE_EDITOR_FIX) return;
  window.HM_FILTERS_MODULE_EDITOR_FIX = true;

  function qs(sel,root){return Array.from((root||document).querySelectorAll(sel));}
  function byId(id){return document.getElementById(id);}
  function isAdm(){try{return typeof internalAdmin==='function'?internalAdmin():typeof isAdmin==='function'?isAdmin():false;}catch(e){return false;}}
  function isLog(){try{return typeof internalLogged==='function'?internalLogged():typeof isLoggedIn==='function'?isLoggedIn():false;}catch(e){return false;}}
  function escLocal(s){try{return typeof esc==='function'?esc(s):String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}catch(e){return String(s||'');}}

  // ---------- FILTRI CALCIATORI ----------
  function enablePlayersReadOnlyFilters(){
    try{
      const root=byId('view-players');
      if(!root || !isLog() || isAdm()) return;
      // Mantiene attivi solo controlli filtro/ricerca.
      qs('input,select,textarea',root).forEach(el=>{
        const id=String(el.id||'');
        const on=String(el.getAttribute('oninput')||'')+' '+String(el.getAttribute('onchange')||'');
        const isFilter = id.startsWith('pl') || on.includes('filterPlayers') || on.includes('clearFilters');
        if(el === document.activeElement) return;
        if(isFilter){
          if(el.disabled) el.disabled = false;
          if(el.style.opacity !== '1') el.style.opacity = '1';
        }else{
          if(!el.disabled) el.disabled = true;
          if(el.style.opacity !== '.45') el.style.opacity = '.45';
        }
      });
      qs('button',root).forEach(btn=>{
        const on=String(btn.getAttribute('onclick')||'');
        const allow = on.includes("clearFilters('pl") || on.includes('clearFilters(\"pl') || on.includes('filterPlayers');
        btn.disabled = !allow;
        btn.style.opacity = allow ? '1' : '.45';
        if(!allow) btn.title = 'Solo Federico può modificare i calciatori';
      });
    }catch(e){console.warn('enablePlayersReadOnlyFilters',e);}
  }

  const oldRenderPlayers = typeof renderPlayers==='function' ? renderPlayers : null;
  if(oldRenderPlayers){
    window.renderPlayers = renderPlayers = function(){
      const r = oldRenderPlayers.apply(this, arguments);
      setTimeout(enablePlayersReadOnlyFilters,0);
      return r;
    };
  }
  const oldFilterPlayers = typeof filterPlayers==='function' ? filterPlayers : null;

    window.filterPlayers = filterPlayers = function(){
      const r = oldFilterPlayers.apply(this, arguments);
      setTimeout(enablePlayersReadOnlyFilters,0);
      return r;
    };
  }
  const oldClearFilters = typeof clearFilters==='function' ? clearFilters : null;
  if(oldClearFilters){
    window.clearFilters = clearFilters = function(prefix, scopeTeam){
      const r = oldClearFilters.apply(this, arguments);
      if(prefix==='pl') setTimeout(enablePlayersReadOnlyFilters,0);
      return r;
    };
  }

  // ---------- EDITOR RUOLI MODULI ----------
  const HM_MODULE_ROLES_KEY='hm_module_roles_v1';
  const DEFAULT_MODULE_ROWS={
    "343":[["Por"],["Dc","Dc","Dc"],["E","M/C","C","E"],["W/A","A/Pc","W/A"]],
    "3421":[["Por"],["Dc","Dc","Dc"],["E/W","M/C","C","E/W"],["T","T/A"],["A/Pc"]],
    "352":[["Por"],["Dc","Dc","Dc"],["E/W","M/C","M","C","E/W"],["A/Pc","A/Pc"]],
    "3412":[["Por"],["Dc","Dc","Dc"],["E/W","M/C","C","E/W"],["T"],["A/Pc","A/Pc"]],
    "433":[["Por"],["Dd","Dc","Dc","Ds"],["M/C","M","C"],["W/A","A/Pc","W/A"]],
    "4312":[["Por"],["Dd","Dc","Dc","Ds"],["M/C","M","C"],["T"],["A/Pc","A/Pc"]],
    "442":[["Por"],["Dd","Dc","Dc","Ds"],["E/W","M/C","C","E/W"],["A/Pc","A/Pc"]],
    "4141":[["Por"],["Dd","Dc","Dc","Ds"],["M"],["E/W","C/T","T","W"],["A/Pc"]],
    "4231":[["Por"],["Dd","Dc","Dc","Ds"],["M","M/C"],["W/T","T","W/A"],["A/Pc"]]
  };
  function getModuleRoles(){
    try{
      const saved=JSON.parse(localStorage.getItem(HM_MODULE_ROLES_KEY)||'null');
      return saved && typeof saved==='object' ? Object.assign({}, DEFAULT_MODULE_ROWS, saved) : JSON.parse(JSON.stringify(DEFAULT_MODULE_ROWS));
    }catch(e){return JSON.parse(JSON.stringify(DEFAULT_MODULE_ROWS));}
  }
  function setModuleRoles(cfg){
    try{localStorage.setItem(HM_MODULE_ROLES_KEY, JSON.stringify(cfg));}catch(e){}
  }
  function moduleCodes(){return Object.keys(getModuleRoles());}
  window.moduleRows = moduleRows = function(module){
    const cfg=getModuleRoles();
    return cfg[module] || cfg['343'] || DEFAULT_MODULE_ROWS['343'];
  };

  window.formationHtml = formationHtml = function(code){
    const mods=moduleCodes();
    const current=savedFormations[code]?.module || (mods[0]||'343');
    return `<div class="card">
      <div class="between">
        <div>
          <h3>Formazione ideale</h3>
          <p class="muted">Campo verticale: scegli il modulo e in ogni casella compaiono solo i calciatori compatibili con quel ruolo.</p>
        </div>
        <div class="row">
          <select id="modulo" class="input" onchange="renderPitch('${code}')">
            ${mods.map(m=>`<option value="${escLocal(m)}" ${m===current?'selected':''}>${escLocal(m)}</option>`).join('')}
          </select>
          ${isAdm()?`<button type="button" class="btn" onclick="openModuleRolesEditor()">⚙️ Modifica ruoli moduli</button>`:''}
        </div>
      </div>
      <div id="pitchBox" style="margin-top:14px"></div>
    </div><script>setTimeout(()=>renderPitch('${code}'),0)<\/script>`;
  };

  function rowsToText(rows){return (rows||[]).map(line=>(line||[]).join(',')).join('\n');}
  function textToRows(text){
    return String(text||'').split(/\n+/).map(line=>line.split(',').map(x=>x.trim()).filter(Boolean)).filter(line=>line.length);
  }
  function renderModuleEditorBody(selected){
    const cfg=getModuleRoles();
    selected = selected || Object.keys(cfg)[0] || '343';
    const txt=rowsToText(cfg[selected]||DEFAULT_MODULE_ROWS[selected]||DEFAULT_MODULE_ROWS['343']);
    return `<h3>Editor ruoli moduli</h3>
      <p class="muted">Solo admin. Una riga = una linea del campo. Ruoli separati da virgola. Esempio fascia: <b>E/W</b> permette sia E che W.</p>
      <div class="grid grid2">
        <label>Modulo
          <select id="hmModuleEditCode" class="input" onchange="hmRefreshModuleEditor(this.value)">
            ${Object.keys(cfg).map(m=>`<option value="${escLocal(m)}" ${m===selected?'selected':''}>${escLocal(m)}</option>`).join('')}
          </select>
        </label>
        <label>Nuovo modulo opzionale
          <input id="hmNewModuleCode" class="input" placeholder="es. 4321">
        </label>
      </div>
      <label style="display:block;margin-top:12px">Righe modulo
        <textarea id="hmModuleRowsText" class="input" style="width:100%;min-height:190px;font-family:monospace">${escLocal(txt)}</textarea>
      </label>
      <div class="row" style="justify-content:flex-end;margin-top:12px">
        <button type="button" class="btn" onclick="closeTradeModal()">Chiudi</button>
        <button type="button" class="btn yellow" onclick="resetModuleRolesToDefault()">Reset default</button>
        <button type="button" class="btn green" onclick="saveModuleRolesEditor()">Salva modulo</button>
      </div>`;
  }
  window.openModuleRolesEditor = function(){
    if(!isAdm()){alert('Solo Federico admin può modificare i ruoli dei moduli.');return false;}
    const modal=byId('tradeModal'), body=byId('tradeModalBody');
    if(!modal||!body) return false;
    body.innerHTML=renderModuleEditorBody(byId('modulo')?.value || '343');
    modal.style.display='flex';
  };
  window.hmRefreshModuleEditor = function(module){
    const body=byId('tradeModalBody'); if(body) body.innerHTML=renderModuleEditorBody(module);
  };
  window.saveModuleRolesEditor = function(){
    if(!isAdm()){alert('Solo Federico admin può modificare i ruoli dei moduli.');return false;}
    const cfg=getModuleRoles();
    const selected=String(byId('hmModuleEditCode')?.value||'').trim();
    const newCode=String(byId('hmNewModuleCode')?.value||'').trim();
    const code=(newCode||selected).replace(/\s+/g,'');
    const rows=textToRows(byId('hmModuleRowsText')?.value||'');
    if(!code){alert('Inserisci/seleziona un modulo.');return false;}
    if(!rows.length){alert('Inserisci almeno una riga modulo.');return false;}
    cfg[code]=rows;
    if(newCode && selected && selected!==code && cfg[selected]) delete cfg[selected];
    setModuleRoles(cfg);
    try{ if(typeof saveAll==='function') saveAll(); }catch(e){}
    try{ closeTradeModal(); }catch(e){}
    try{ if(selectedTeam) renderTeamDetail(); }catch(e){}
    return true;
  };
  window.resetModuleRolesToDefault = function(){
    if(!isAdm()) return false;
    if(!confirm('Ripristinare i moduli predefiniti?')) return false;
    setModuleRoles(JSON.parse(JSON.stringify(DEFAULT_MODULE_ROWS)));
    try{ if(typeof saveAll==='function') saveAll(); }catch(e){}
    try{ closeTradeModal(); }catch(e){}
    try{ if(selectedTeam) renderTeamDetail(); }catch(e){}
    return true;
  };

  const oldApplyPerm = window.applyInternalPermissions || window.applyPermissionsToVisibleView;
  window.applyInternalPermissions = window.applyPermissionsToVisibleView = function(){
    try{ if(typeof oldApplyPerm==='function') oldApplyPerm(); }catch(e){}
    setTimeout(enablePlayersReadOnlyFilters,0);
    try{
      const btn=byId('hmFirebaseSaveBtn');
      if(btn){btn.disabled=!isLog(); btn.style.opacity=isLog()?'1':'.45';}
    }catch(e){}
  };

  try{ if(typeof currentVisibleViewName==='function' && currentVisibleViewName()==='players') enablePlayersReadOnlyFilters(); }catch(e){}
})();
</script>







<script>

   - I filtri restano accessibili a tutti.
   - Non usa timer/click continui, quindi le tendine non si richiudono.
   - Non sblocca modifica/aggiungi/elimina calciatori.

(function(){

})();
</script>


<script>
/* =========================================================
   HM ADMIN SAFE V4
   BASE: versione Primavera funzionante.
   PRINCIPIO: NON modifica buildSplitDocs/fbSave/saveCloudNow.
   La condivisione moduli usa un documento Firebase separato,
   così un eventuale errore NON può bloccare il salvataggio generale.
   ========================================================= */
(function(){
  if(window.HM_ADMIN_SAFE_V4) return;
  window.HM_ADMIN_SAFE_V4=true;
  const $=id=>document.getElementById(id);
  const MODULE_KEY='hm_module_roles_v1';
  const MODULE_DOC_ID='modulesConfig';
  window.HM_ADMIN_RUNTIME_ERRORS = window.HM_ADMIN_RUNTIME_ERRORS || [];

  function adminNow(){
    return !!(window.currentUser ? window.currentUser.role==='admin' : (typeof currentUser!=='undefined' && currentUser && currentUser.role==='admin'));
  }
  function canTeamNow(code){
    try{return typeof canEditTeam==='function' ? !!canEditTeam(code) : adminNow();}catch(e){return adminNow();}
  }
  function escA(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m));}
  function pushErr(kind,err){
    try{
      const msg=(err && (err.message||err.reason?.message)) || String(err||'Errore sconosciuto');
      window.HM_ADMIN_RUNTIME_ERRORS.unshift({time:new Date().toLocaleString('it-IT'),kind,msg});
      window.HM_ADMIN_RUNTIME_ERRORS=window.HM_ADMIN_RUNTIME_ERRORS.slice(0,20);
    }catch(e){}
  }
  window.addEventListener('error',e=>pushErr('JS',e.error||e.message));
  window.addEventListener('unhandledrejection',e=>pushErr('Promise',e.reason));

  function localModules(){
    try{return JSON.parse(localStorage.getItem(MODULE_KEY)||'{}')||{};}catch(e){return {};}
  }
  function moduleCount(){return Object.keys(localModules()).length;}

  async function ensureFirebaseAuthSafe(){
    if(!window.firebase || !firebase.firestore) throw new Error('Firebase non disponibile');
    if(firebase.auth){
      const auth=firebase.auth();
      if(!auth.currentUser){
        await auth.signInAnonymously();
      }
    }
    return true;
  }
  function modulesDocRef(){
    return firebase.firestore().collection('hmleague').doc('main').collection('parts').doc(MODULE_DOC_ID);
  }
  function modulesManagersRef(){
    return firebase.firestore().collection('hmleague').doc('main').collection('parts').doc('managers');
  }

  window.hmPublishSharedModules = async function(showMessage=true){
    if(!adminNow()){ if(showMessage) alert('Solo Federico admin può pubblicare i moduli.'); return false; }
    try{
      await ensureFirebaseAuthSafe();
      const cfg=localModules();
      // Firestore non consente array annidati (i moduli sono righe -> slot -> ruoli).
      // Li serializziamo come JSON in un campo stringa: la struttura resta IDENTICA al caricamento.
      const json=JSON.stringify(cfg);
      // Copia separata di sicurezza + campo stringa nel documento managers già letto da TUTTI gli account.
      await modulesDocRef().set({version:3,updatedAt:new Date().toISOString(),moduleRolesJson:json},{merge:false});
      await modulesManagersRef().set({moduleRolesJson:json,moduleRolesUpdatedAt:new Date().toISOString()},{merge:true});
      if(showMessage) alert('Moduli pubblicati online e condivisi con tutti gli account.');
      try{renderAdminSafe();}catch(e){}
      return true;
    }catch(e){
      console.error('Pubblicazione moduli fallita',e); pushErr('Moduli cloud',e);
      if(showMessage) alert('Errore SOLO nella pubblicazione moduli: '+(e.code||e.message||e)+'\nIl normale salvataggio del gestionale resta indipendente.');
      try{renderAdminSafe();}catch(x){}
      return false;
    }
  };

  window.hmLoadSharedModules = async function(showMessage=false){
    try{
      await ensureFirebaseAuthSafe();
      // Prima prova il documento managers, che è lo stesso già caricato da tutti gli account.
      let snap=await modulesManagersRef().get();
      let d=snap.exists ? (snap.data()||{}) : {};
      // Compatibilità con V4/V5: se manca lì, usa il vecchio documento separato.
      if(typeof d.moduleRolesJson!=="string" || !d.moduleRolesJson.trim()){
        snap=await modulesDocRef().get();
        d=snap.exists ? (snap.data()||{}) : {};
      }
      if(typeof d.moduleRolesJson!=="string" || !d.moduleRolesJson.trim()){
        if(showMessage) alert('Nessuna configurazione moduli condivisa trovata online.');
        return false;
      }
      let sharedCfg=null;
      if(typeof d.moduleRolesJson==='string'){
        try{ sharedCfg=JSON.parse(d.moduleRolesJson); }catch(parseErr){ throw new Error('Configurazione moduli online JSON non valida'); }
      }else if(d.moduleRoles && typeof d.moduleRoles==='object' && !Array.isArray(d.moduleRoles)){
        // Compatibilità prudenziale con eventuali vecchie configurazioni.
        sharedCfg=d.moduleRoles;
      }
      if(!sharedCfg || typeof sharedCfg!=='object' || Array.isArray(sharedCfg)) throw new Error('Configurazione moduli online non valida');
      localStorage.setItem(MODULE_KEY,JSON.stringify(sharedCfg));
      if(showMessage) alert('Moduli condivisi caricati su questo dispositivo.');
      // Se una formazione è già aperta, aggiorna solo l'area formazione.
      try{
        if(typeof selectedTeam!=='undefined' && selectedTeam && $('teamSub-formazione') && !$('teamSub-formazione').classList.contains('hidden')){
          const box=$('teamSub-formazione');
          if(typeof formationHtml==='function'){
            box.innerHTML=formationHtml(selectedTeam);
            box.classList.remove('hidden');
          }
        }
      }catch(e){console.warn(e);}
      try{renderAdminSafe();}catch(e){}
      return true;
    }catch(e){
      console.warn('Caricamento moduli condivisi fallito',e); pushErr('Moduli cloud',e);
      if(showMessage) alert('Impossibile caricare i moduli condivisi: '+(e.code||e.message||e));
      return false;
    }
  };

  // Wrappa SOLO l'editor moduli: il salvataggio normale Firebase resta intatto.
  const oldSaveModule=window.saveModuleRolesEditor;
  if(typeof oldSaveModule==='function'){
    window.saveModuleRolesEditor=function(){
      const ok=oldSaveModule.apply(this,arguments);
      if(ok) setTimeout(()=>hmPublishSharedModules(false),0);
      return ok;
    };
  }
  const oldResetModules=window.resetModuleRolesToDefault;
  if(typeof oldResetModules==='function'){
    window.resetModuleRolesToDefault=function(){
      const ok=oldResetModules.apply(this,arguments);
      if(ok) setTimeout(()=>hmPublishSharedModules(false),0);
      return ok;
    };
  }

  // Salva formazione senza cambiare schermata o tab.
  window.hmSaveFormationStayVisible=function(code){
    if(!canTeamNow(code)){alert('Puoi salvare solo la formazione delle tue squadre.');return false;}
    try{
      if(typeof saveAll==='function') saveAll();
      if(typeof renderPitch==='function') renderPitch(code);
      const sub=$('teamSub-formazione'); if(sub) sub.classList.remove('hidden');
      document.querySelectorAll('#view-teamDetail .tabs .tab').forEach(btn=>{
        const on=String(btn.getAttribute('onclick')||'');
        btn.classList.toggle('active',on.includes("teamSub('formazione'"));
      });
      alert('Formazione salvata.');
      return true;
    }catch(e){console.error(e);pushErr('Formazione',e);alert('Errore salvataggio formazione: '+(e.message||e));return false;}
  };

  function formationDiagnostics(){
    const issues=[];
    const ids=new Set((Array.isArray(players)?players:[]).map(p=>String(p.id||'')));
    const teamsSet=new Set((Array.isArray(teams)?teams:[]).map(t=>String(t.code||'').toUpperCase()));
    const mods=new Set(Object.keys(localModules()));
    Object.entries(savedFormations||{}).forEach(([code,f])=>{
      if(!teamsSet.has(String(code).toUpperCase())) issues.push('Formazione legata a squadra inesistente: '+code);
      const mod=String(f?.module||'');
      if(mod && !mods.has(mod)) issues.push(code+': modulo '+mod+' non presente su questo dispositivo');
      Object.entries(f?.slots||{}).forEach(([slot,pid])=>{if(pid && !ids.has(String(pid))) issues.push(code+': '+slot+' usa un calciatore inesistente ('+pid+')');});
    });
    return issues;
  }
  function playerDiagnostics(){
    const issues=[]; const seen=new Set();
    (Array.isArray(players)?players:[]).forEach(p=>{
      const id=String(p?.id||'');
      if(!id) issues.push('Calciatore senza ID: '+String(p?.name||'senza nome'));
      else if(seen.has(id)) issues.push('ID duplicato: '+id);
      else seen.add(id);
    });
    return issues;
  }
  function renderErrors(){
    const rows=window.HM_ADMIN_RUNTIME_ERRORS||[];
    return rows.length ? rows.map(x=>`<div class="card" style="padding:9px;margin:6px 0"><b>${escA(x.kind)}</b> · ${escA(x.time)}<br><span class="muted">${escA(x.msg)}</span></div>`).join('') : '<div class="muted">Nessun errore runtime registrato da quando hai aperto questa pagina.</div>';
  }

  window.hmAdminCheckSafe=function(){
    const box=$('hmAdminDiagSafe'); if(!box) return false;
    const issues=[...playerDiagnostics(),...formationDiagnostics()];
    box.innerHTML=issues.length ? `<div class="stat"><div class="n">${issues.length}</div><div>anomalie trovate</div></div>${issues.map(x=>`<div class="card" style="padding:9px;margin:6px 0">⚠️ ${escA(x)}</div>`).join('')}` : '<div class="stat"><div class="n">0</div><div>✅ Nessuna anomalia nei controlli non distruttivi</div></div>';
    return true;
  };
  window.hmAdminClearRuntimeErrors=function(){window.HM_ADMIN_RUNTIME_ERRORS=[];renderAdminSafe();};

  window.renderAdminSafe=function(){
    const root=$('view-admin'); if(!root) return;
    if(!adminNow()){
      root.innerHTML='<h2>🛠️ Admin</h2><div class="card">Area riservata a Federico admin.</div>';
      return;
    }
    const unsaved=(typeof HM_HAS_UNSAVED_CHANGES!=='undefined' && HM_HAS_UNSAVED_CHANGES);
    root.innerHTML=`
      <div class="between"><div><h2 style="margin:0 0 6px">🛠️ Centro Admin HML</h2><div class="muted">Strumenti isolati: nessuna modifica automatica ai dati e nessuna alterazione del salvataggio generale.</div></div><span class="badge">SAFE V4</span></div>
      <div class="grid grid4" style="margin-top:16px">
        <div class="stat"><div class="muted">Calciatori</div><div class="n">${(players||[]).length}</div></div>
        <div class="stat"><div class="muted">Squadre</div><div class="n">${(teams||[]).filter(t=>t.code!=='SVIN').length}</div></div>
        <div class="stat"><div class="muted">Moduli locali</div><div class="n">${moduleCount()}</div></div>
        <div class="stat"><div class="muted">Stato modifiche</div><div style="font-size:18px;font-weight:900;margin-top:8px">${unsaved?'⚠️ Da pubblicare':'✅ Allineato/localmente salvo'}</div></div>
      </div>
      <div class="grid grid2" style="margin-top:16px">
        <div class="card"><h3>⚽ Moduli formazione</h3><p class="muted">L'editor resta quello già funzionante. La pubblicazione moduli è separata dal salvataggio generale.</p><div class="row"><button class="btn primary" onclick="openModuleRolesEditor()">⚙️ Gestisci moduli</button><button class="btn green" onclick="hmPublishSharedModules(true)">☁️ Pubblica moduli</button><button class="btn" onclick="hmLoadSharedModules(true)">⬇️ Carica moduli online</button></div></div>
        <div class="card"><h3>💾 Salvataggio generale</h3><p class="muted">Usa ESATTAMENTE la funzione Firebase della versione Primavera: qui non viene aggiunto alcun campo.</p><div class="row"><button class="btn green" onclick="saveCloudNow(true)">💾 Salva online</button><button class="btn" onclick="loadCloudData()">🔄 Ricarica dati online</button></div></div>
        <div class="card"><h3>📦 Sicurezza</h3><div class="row"><button class="btn green" onclick="downloadFullBackup()">📦 Backup</button><button class="btn yellow" onclick="triggerRestoreBackup()">♻️ Ripristina</button></div></div>
        <div class="card"><h3>🧪 Diagnostica</h3><p class="muted">Controlli solo lettura: ID duplicati, moduli mancanti e riferimenti formazione rotti.</p><button class="btn primary" onclick="hmAdminCheckSafe()">Avvia controllo</button></div>
      </div>
      <div id="hmAdminDiagSafe" style="margin-top:16px"></div>
      <div class="card" style="margin-top:16px"><div class="between"><h3 style="margin:0">🐞 Errori runtime</h3><button class="btn" onclick="hmAdminClearRuntimeErrors()">Pulisci elenco</button></div><div style="margin-top:10px">${renderErrors()}</div></div>`;
    setTimeout(()=>{const r=$('view-admin'); if(r) r.querySelectorAll('button,input,select,textarea').forEach(el=>{el.disabled=false;el.style.opacity='1';});},0);
  };

  function syncAdminNav(){const n=$('hmAdminNavBtn'); if(n) n.style.display=adminNow()?'flex':'none';}
  const oldPerm=window.applyInternalPermissions || window.applyPermissionsToVisibleView;
  const safePerm=function(){
    const r=typeof oldPerm==='function'?oldPerm.apply(this,arguments):undefined;
    syncAdminNav();
    if(adminNow() && typeof currentVisibleViewName==='function' && currentVisibleViewName()==='admin'){
      const root=$('view-admin'); if(root) root.querySelectorAll('button,input,select,textarea').forEach(el=>{el.disabled=false;el.style.opacity='1';});
    }
    return r;
  };
  window.applyInternalPermissions=window.applyPermissionsToVisibleView=safePerm;

  // Carica i moduli condivisi in modo indipendente. Un errore qui NON modifica stato/salvataggio generale.
  setTimeout(()=>hmLoadSharedModules(false),1200);
  setTimeout(syncAdminNav,100);
  document.addEventListener('DOMContentLoaded',()=>{setTimeout(syncAdminNav,100);setTimeout(()=>hmLoadSharedModules(false),1200);});
})();
</script>

<script>
/* =========================================================
   HM ADMIN CONTROL CENTER V5
   Estensione separata sopra SAFE V4.
   NON modifica il salvataggio generale Firebase.
   Configurazioni variabili (stati, ruoli, abbinamenti, premi,
   azioni presidente) sono salvate in un documento cloud separato.
   ========================================================= */
(function(){
  if(window.HM_ADMIN_CONTROL_V5) return;
  window.HM_ADMIN_CONTROL_V5 = true;

  const $ = id => document.getElementById(id);
  const CFG_KEY = 'hm_admin_config_v1';
  const CFG_DOC_ID = 'adminConfig';

  function adm(){ try{return typeof isAdmin==='function' ? !!isAdmin() : !!(currentUser&&currentUser.role==='admin');}catch(e){return false;} }
  function escV(v){ return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m)); }
  function markUnsaved(){
    try{ if(typeof saveAll==='function') saveAll(); }
    catch(e){ console.warn('saveAll admin V5',e); }
  }
  function uniqueClean(arr){ return Array.from(new Set((arr||[]).map(x=>String(x??'').trim()).filter(Boolean))); }
  function defaultStatuses(){
    return uniqueClean(['D','PS','PD','PO','PRIMAVERA 2005','PRIMAVERA 2006','PRIMAVERA 2007','PRIMAVERA 2008','PRIMAVERA 2009','PRIMAVERA 2010','PRIMAVERA 2011','Svincolato',...(players||[]).map(p=>p.status)]);
  }
  function defaultRoles(){
    return uniqueClean(['Por','Dc','Dd','Ds','B','E','M','C','W','T','A','Pc','Dd;Dc','Ds;Dc','Dd;Ds;E','B;Dd;E','B;Ds;E','Ds;E','Dd;E','E;W','E;M','M;C','C;T','C;W','C;W;T','W;A','W;T','W;T;A','T;A','A;Pc',...(players||[]).map(p=>p.role)]);
  }
  function codePairsNow(){
    const o={};
    try{ Object.keys(PAIRED||{}).forEach(k=>o[String(k).toUpperCase()]=String(PAIRED[k]||'').toUpperCase()); }catch(e){}
    return o;
  }
  function defaultCfg(){
    return {
      version:1,
      statuses:defaultStatuses(),
      roles:defaultRoles(),
      pairings:codePairsNow(),
      awards:Array.from(typeof INDIVIDUAL_AWARDS!=='undefined'?INDIVIDUAL_AWARDS:[]),
      actionTypes:Array.from(typeof PRESIDENT_ACTION_TYPES!=='undefined'?PRESIDENT_ACTION_TYPES:[]).map(x=>({name:x.name,cost:Number(x.cost)||0,suspended:!!x.suspended})),
      defaultCredits:500,
      defaultHmcoin:100
    };
  }
  function readCfg(){
    const d=defaultCfg();
    try{
      const x=JSON.parse(localStorage.getItem(CFG_KEY)||'null');
      if(!x||typeof x!=='object') return d;
      return {
        ...d,...x,
        statuses:Array.isArray(x.statuses)?uniqueClean(x.statuses):d.statuses,
        roles:Array.isArray(x.roles)?uniqueClean(x.roles):d.roles,
        pairings:x.pairings&&typeof x.pairings==='object'?x.pairings:d.pairings,
        awards:Array.isArray(x.awards)?uniqueClean(x.awards):d.awards,
        actionTypes:Array.isArray(x.actionTypes)?x.actionTypes:d.actionTypes
      };
    }catch(e){ return d; }
  }
  function writeCfg(cfg, mark=true){
    localStorage.setItem(CFG_KEY,JSON.stringify(cfg));
    applyCfg(cfg);
    if(mark){
      try{ HM_HAS_UNSAVED_CHANGES=true; if(typeof updateCloudBadge==='function') updateCloudBadge(); }catch(e){}
    }
  }
  function applyCfg(cfg){
    try{
      if(typeof PAIRED==='object' && PAIRED && cfg.pairings){
        Object.keys(PAIRED).forEach(k=>delete PAIRED[k]);
        Object.entries(cfg.pairings).forEach(([k,v])=>{ if(k&&v) PAIRED[String(k).toUpperCase()]=String(v).toUpperCase(); });
      }
    }catch(e){console.warn('apply pairings',e);}
    try{
      if(Array.isArray(INDIVIDUAL_AWARDS) && Array.isArray(cfg.awards)) INDIVIDUAL_AWARDS.splice(0,INDIVIDUAL_AWARDS.length,...uniqueClean(cfg.awards));
    }catch(e){console.warn('apply awards',e);}
    try{
      if(Array.isArray(PRESIDENT_ACTION_TYPES) && Array.isArray(cfg.actionTypes)){
        const rows=cfg.actionTypes.map(x=>({name:String(x.name||'').trim(),cost:Number(x.cost)||0,suspended:!!x.suspended})).filter(x=>x.name);
        if(rows.length) PRESIDENT_ACTION_TYPES.splice(0,PRESIDENT_ACTION_TYPES.length,...rows);
      }
    }catch(e){console.warn('apply action types',e);}
  }

  // Applica subito la configurazione locale senza toccare il core.
  let HM_ADMIN_CFG = readCfg();
  applyCfg(HM_ADMIN_CFG);

  async function ensureAuthCfg(){
    if(!window.firebase || !firebase.firestore) throw new Error('Firebase non disponibile');
    if(firebase.auth){ const a=firebase.auth(); if(!a.currentUser) await a.signInAnonymously(); }
    return true;
  }
  function cfgRef(){ return firebase.firestore().collection('hmleague').doc('main').collection('parts').doc(CFG_DOC_ID); }

  window.hmAdminPublishConfig = async function(show=true){
    if(!adm()){ if(show) alert('Solo Federico admin può pubblicare la configurazione.'); return false; }
    try{
      await ensureAuthCfg();
      HM_ADMIN_CFG=readCfg();
      await cfgRef().set({version:1,updatedAt:new Date().toISOString(),configJson:JSON.stringify(HM_ADMIN_CFG)},{merge:false});
      if(show) alert('Configurazione Admin pubblicata online. Il salvataggio generale non è stato modificato.');
      return true;
    }catch(e){
      console.error(e);
      if(window.HM_ADMIN_RUNTIME_ERRORS) window.HM_ADMIN_RUNTIME_ERRORS.unshift({time:new Date().toLocaleString('it-IT'),kind:'Config Admin cloud',msg:String(e.code||e.message||e)});
      if(show) alert('Errore SOLO nella configurazione Admin: '+String(e.code||e.message||e)+'\nIl salvataggio generale resta indipendente.');
      return false;
    }
  };
  window.hmAdminLoadConfig = async function(show=false){
    try{
      await ensureAuthCfg();
      const snap=await cfgRef().get();
      if(!snap.exists){ if(show) alert('Nessuna configurazione Admin online trovata.'); return false; }
      const d=snap.data()||{};
      const cfg=typeof d.configJson==='string'?JSON.parse(d.configJson):null;
      if(!cfg||typeof cfg!=='object') throw new Error('Configurazione Admin online non valida');
      HM_ADMIN_CFG={...defaultCfg(),...cfg};
      writeCfg(HM_ADMIN_CFG,false);
      enhancePlayerEditorControls();
      if(show) alert('Configurazione Admin caricata.');
      try{ renderAdminSafe(); }catch(e){}
      return true;
    }catch(e){
      console.warn('Config admin load',e);
      if(show) alert('Impossibile caricare la configurazione Admin: '+String(e.code||e.message||e));
      return false;
    }
  };

  function selectOptions(values,selected,emptyLabel){
    const arr=uniqueClean(values); let h='';
    if(emptyLabel!==undefined) h+=`<option value="">${escV(emptyLabel)}</option>`;
    arr.forEach(v=>h+=`<option value="${escV(v)}" ${String(v)===String(selected)?'selected':''}>${escV(v)}</option>`);
    return h;
  }
  function enhancePlayerEditorControls(){
    try{
      HM_ADMIN_CFG=readCfg();
      const st=$('hmPlStatus');
      if(st){ const val=st.value; const vals=uniqueClean([...HM_ADMIN_CFG.statuses,val]); st.innerHTML=selectOptions(vals,val); }
      const ro=$('hmPlRole');
      if(ro){ const val=ro.value; const vals=uniqueClean([...HM_ADMIN_CFG.roles,val]); ro.innerHTML='<option value="">— Seleziona ruolo —</option>'+selectOptions(vals,val); }
    }catch(e){console.warn(e);}
  }
  ['openPlayerEditor','openNewPlayerEditor','duplicatePlayerEditor'].forEach(name=>{
    const old=window[name];
    if(typeof old==='function') window[name]=function(){ const r=old.apply(this,arguments); setTimeout(enhancePlayerEditorControls,0); return r; };
  });

  function teamByCode(code){ return (teams||[]).find(t=>String(t.code)===String(code)); }
  function realTeams(){ return (teams||[]).filter(t=>t.code!=='SVIN'); }
  function teamOpts(selected,filterFn){ return realTeams().filter(filterFn||(()=>true)).map(t=>`<option value="${escV(t.code)}" ${t.code===selected?'selected':''}>${escV(t.code)} · ${escV(t.name)}</option>`).join(''); }
  function statusPrimavera(){ return readCfg().statuses.filter(s=>String(s).toUpperCase().startsWith('PRIMAVERA ')); }

  window.hmAdminOpenTeam = function(){ const c=$('admTeamSel')?.value; if(c&&typeof openTeam==='function') openTeam(c); };
  window.hmAdminLoadTeamForm = function(){
    const c=$('admTeamSel')?.value; const t=teamByCode(c); if(!t) return;
    [['admTName',t.name],['admTDivision',t.division],['admTCredits',t.credits??0],['admTHmcoin',t.hmcoin??0],['admTPrimary',t.primary||'#334155'],['admTSecondary',t.secondary||'#111827'],['admTText',t.text||'#ffffff'],['admTJersey',t.jerseyStyle||'diagonal']].forEach(([id,v])=>{const e=$(id);if(e)e.value=v;});
  };
  window.hmAdminSaveTeamQuick = function(){
    if(!adm()) return false;
    const c=$('admTeamSel')?.value,t=teamByCode(c); if(!t) return false;
    t.name=String($('admTName')?.value||t.name).trim()||t.name;
    t.division=String($('admTDivision')?.value||t.division).trim()||t.division;
    t.credits=Number($('admTCredits')?.value??t.credits)||0;
    t.hmcoin=Number($('admTHmcoin')?.value??t.hmcoin)||0;
    t.primary=$('admTPrimary')?.value||t.primary; t.secondary=$('admTSecondary')?.value||t.secondary; t.text=$('admTText')?.value||t.text; t.jerseyStyle=$('admTJersey')?.value||t.jerseyStyle;
    markUnsaved(); alert('Società aggiornata localmente. Premi Salva online quando vuoi pubblicare.'); renderAdminSafe(); return true;
  };

  window.hmAdminSaveRulesLocal = function(){
    if(!adm()) return false;
    const cfg=readCfg();
    cfg.statuses=uniqueClean(String($('admStatuses')?.value||'').split(/\n+/));
    cfg.roles=uniqueClean(String($('admRoles')?.value||'').split(/\n+/));
    cfg.awards=uniqueClean(String($('admAwards')?.value||'').split(/\n+/));
    cfg.defaultCredits=Number($('admDefCredits')?.value||500);
    cfg.defaultHmcoin=Number($('admDefHmcoin')?.value||100);

    const aTeams=realTeams().filter(t=>String(t.division||'').toLowerCase().includes('serie a'));
    const pairings={}; const usedB=new Set(); let bad='';
    aTeams.forEach(t=>{
      const v=String($('admPair_'+t.code)?.value||'').trim().toUpperCase();
      if(!v) return;
      if(usedB.has(v)) bad='La squadra '+v+' è stata abbinata a più società.';
      usedB.add(v); pairings[t.code]=v; pairings[v]=t.code;
    });
    if(bad){alert(bad);return false;}
    if(Object.keys(pairings).length) cfg.pairings=pairings;

    const actionLines=String($('admActions')?.value||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
    const actionTypes=[];
    for(const line of actionLines){
      const p=line.split('|');
      if(!p[0]?.trim()) continue;
      actionTypes.push({name:p[0].trim(),cost:Number(String(p[1]??'0').replace(',','.'))||0,suspended:['1','si','sì','true','yes'].includes(String(p[2]||'').trim().toLowerCase())});
    }
    if(actionTypes.length) cfg.actionTypes=actionTypes;
    HM_ADMIN_CFG=cfg; writeCfg(cfg,true); enhancePlayerEditorControls();
    alert('Regole salvate localmente. Per condividerle con tutti usa “Pubblica configurazione”.');
    renderAdminSafe(); return true;
  };

  window.hmAdminPlayerSearch = function(){
    const box=$('admPlayerResults'); if(!box) return;
    const s=String($('admPlayerSearch')?.value||'').trim().toLowerCase();
    if(s.length<2){box.innerHTML='<div class="muted">Scrivi almeno 2 caratteri.</div>';return;}
    const list=(players||[]).filter(p=>[p.name,p.role,p.current,p.owner,p.status].join(' ').toLowerCase().includes(s)).slice(0,50);
    box.innerHTML=list.length?list.map(p=>`<div class="playerRow"><div style="grid-column:1/3"><b>${escV(p.name)}</b><div class="muted">${escV(p.role||'-')} · attuale ${escV(p.current||'-')} · prop. ${escV(p.owner||'-')} · ${escV(p.status||'-')}</div></div><button class="btn primary" onclick="openPlayerEditor('${escV(p.id)}')">Modifica</button></div>`).join(''):'<div class="muted">Nessun calciatore trovato.</div>';
  };

  window.hmAdminPrimaveraSearch = function(){
    const box=$('admPrimResults'); if(!box) return;
    const s=String($('admPrimSearch')?.value||'').trim().toLowerCase();
    if(s.length<2){box.innerHTML='<div class="muted">Scrivi almeno 2 caratteri per cercare i calciatori da selezionare.</div>';return;}
    const list=(players||[]).filter(p=>[p.name,p.role,p.current,p.owner,p.status].join(' ').toLowerCase().includes(s)).slice(0,80);
    box.innerHTML=list.length?list.map(p=>`<label class="playerRow" style="cursor:pointer"><input type="checkbox" class="admPrimChk" value="${escV(p.id)}"><div><b>${escV(p.name)}</b><div class="muted">${escV(p.role||'-')} · ${escV(p.current||'-')} · ${escV(p.owner||'-')} · ${escV(p.status||'-')}</div></div><span class="badge">Seleziona</span></label>`).join(''):'<div class="muted">Nessun calciatore trovato.</div>';
  };
  window.hmAdminApplyPrimaveraBulk = function(){
    if(!adm()) return false;
    const main=String($('admPrimTeam')?.value||'').toUpperCase(); const status=String($('admPrimStatus')?.value||'').trim(); const pair=String((PAIRED||{})[main]||'').toUpperCase();
    if(!main||!pair){alert('Abbinamento Primavera non valido per la squadra scelta.');return false;}
    if(!status.toUpperCase().startsWith('PRIMAVERA ')){alert('Seleziona uno Stato Primavera.');return false;}
    const ids=Array.from(document.querySelectorAll('.admPrimChk:checked')).map(x=>x.value);
    if(!ids.length){alert('Seleziona almeno un calciatore.');return false;}
    const chosen=(players||[]).filter(p=>ids.includes(String(p.id)));
    if(!confirm(`Portare ${chosen.length} calciatori in Primavera ${main} / ${pair} con stato ${status}?\n\nVerranno impostati Proprietario = SVIN e Squadra attuale = ${main} ${pair}.`)) return false;
    try{ if(typeof rememberBackupSnapshot==='function') rememberBackupSnapshot('prima Primavera massiva'); }catch(e){}
    chosen.forEach(p=>{p.current=main+' '+pair;p.owner='SVIN';p.status=status;});
    markUnsaved(); alert(chosen.length+' calciatori aggiornati localmente.'); renderAdminSafe(); return true;
  };

  window.hmAdminOpenFormation = function(){ const c=$('admFormTeam')?.value; if(c&&typeof openTeam==='function'){openTeam(c);setTimeout(()=>{const btn=Array.from(document.querySelectorAll('#view-teamDetail .tab')).find(b=>String(b.getAttribute('onclick')||'').includes("teamSub('formazione'"));if(btn)btn.click();},50);} };
  window.hmAdminResetFormation = function(){
    if(!adm()) return false; const c=$('admFormTeam')?.value; if(!c) return false;
    if(!confirm('Svuotare completamente la formazione salvata di '+c+'?')) return false;
    try{ if(typeof rememberBackupSnapshot==='function') rememberBackupSnapshot('prima reset formazione '+c); }catch(e){}
    savedFormations[c]={module:(savedFormations[c]?.module||'343'),slots:{}}; markUnsaved(); alert('Formazione '+c+' svuotata.'); renderAdminSafe(); return true;
  };
  window.hmAdminRepairFormationRefs = function(){
    if(!adm()) return false;
    const ids=new Set((players||[]).map(p=>String(p.id))); let n=0;
    Object.values(savedFormations||{}).forEach(f=>Object.keys(f?.slots||{}).forEach(k=>{const pid=f.slots[k];if(pid&&!ids.has(String(pid))){f.slots[k]='';n++;}}));
    if(!n){alert('Nessun riferimento formazione rotto da riparare.');return true;}

    });
    Object.entries(savedFormations||{}).forEach(([c,f])=>{if(!teamCodes.has(String(c).toUpperCase()))out.push('FORMAZIONI · squadra inesistente '+c);if(f?.module&&mods.size&& !mods.has(String(f.module)))out.push('FORMAZIONI · '+c+' usa modulo locale mancante '+f.module);Object.entries(f?.slots||{}).forEach(([k,pid])=>{if(pid&&!pids.has(String(pid)))out.push('FORMAZIONI · '+c+' '+k+' punta a giocatore inesistente '+pid);});});
    try{Object.entries(PAIRED||{}).forEach(([a,b])=>{if(!teamCodes.has(a)||!teamCodes.has(String(b)))out.push('ABBINAMENTI · '+a+' ↔ '+b+' usa sigla inesistente');else if(PAIRED[b]!==a)out.push('ABBINAMENTI · '+a+' → '+b+' non è reciproco');});}catch(e){}
    if(auctionState?.playerId && !pids.has(String(auctionState.playerId)))out.push('ASTA · playerId corrente non esiste: '+auctionState.playerId);
    (auctionState?.bids||[]).forEach(b=>{if(!teamCodes.has(String(b.team)))out.push('ASTA · offerta di squadra inesistente '+b.team);});
    return out;

  function interestRows(pid){return Array.isArray(MARKET_STATE.interests?.[pid])?MARKET_STATE.interests[pid]:[]}

  function addActivity(st,type,opts={}){

  async function ensureAuth(){
    if(!logged()){alert('Devi fare login per usare il mercato.');return false;}

      if(!window.firebase||!firebase.auth)return true;

  async function mutateState(mutator){
    if(!await ensureAuth())return false;
    const db=marketDb(),ref=stateRef();if(!db||!ref){alert('Firebase mercato non disponibile.');return false;}
    let finalState=null;
    try{
      await db.runTransaction(async tx=>{
        const snap=await tx.get(ref);let st=EMPTY_STATE();
        if(snap.exists){const d=snap.data()||{};try{st=normalizeState(JSON.parse(d.stateJson||'{}'))}catch(e){st=EMPTY_STATE()}}
        await mutator(st);
        st.updatedAt=nowIso();finalState=st;
        tx.set(ref,{version:1,updatedAt:st.updatedAt,stateJson:JSON.stringify(st)},{merge:false});
      });
      if(finalState){MARKET_STATE=normalizeState(finalState);saveLocal(STATE_LOCAL,MARKET_STATE);renderMarketIfOpen();}
      return true;
    }catch(e){console.error('Market mutate',e);alert('Errore salvataggio Mercato HML: '+(e.code||e.message||e));return false;}
  }

  async function loadConfig(show=false){const ref=cfgRef();if(!ref)return false;try{const s=await ref.get();if(s.exists&&s.data()?.configJson){MARKET_CONFIG=normalizeConfig(JSON.parse(s.data().configJson));saveLocal(CONFIG_LOCAL,MARKET_CONFIG);updateMarketNav();renderMarketIfOpen();if(show)alert('Configurazione mercato caricata.');return true}return false}catch(e){console.warn(e);if(show)alert('Errore lettura configurazione mercato.');return false}}
  async function loadState(show=false){const ref=stateRef();if(!ref)return false;try{const s=await ref.get();if(s.exists&&s.data()?.stateJson){MARKET_STATE=normalizeState(JSON.parse(s.data().stateJson));saveLocal(STATE_LOCAL,MARKET_STATE);renderMarketIfOpen();if(show)alert('Mercato aggiornato.');return true}return false}catch(e){console.warn(e);if(show)alert('Errore lettura Mercato HML.');return false}}

  function teamSelectorHtml(){const arr=myTeams();if(!logged())return `<span class="badge">👁️ Accedi per partecipare</span>`;if(!arr.length)return `<span class="badge">Nessuna squadra</span>`;return `<label class="market-team-select">Agisci come <select id="marketActiveTeam" class="input" data-market-public="1" onchange="hmMarketSetTeam(this.value)">${arr.map(c=>`<option value="${escM(c)}" ${c===activeTeam()?'selected':''}>${escM(teamName(c))}</option>`).join('')}</select></label>`}
