<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HM League Manager - Market Control V7</title>
<style>
:root {
  --bg:#07111f; --panel:#0d1b2f; --panel2:#12233b; --line:#28405f; --text:#f8fafc; --muted:#a8b3c7;
  --violet:#7c3aed; --green:#22c55e; --red:#ef4444; --yellow:#facc15; --blue:#38bdf8;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top left,#203b70 0,#07111f 36%,#050a13 100%);color:var(--text);font-family:Inter,Arial,sans-serif}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.app{max-width:1440px;margin:auto;padding:18px}
.hero{border:1px solid rgba(255,255,255,.12);background:linear-gradient(135deg,rgba(124,58,237,.32),rgba(14,165,233,.14)),rgba(13,27,47,.92);border-radius:30px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.35)}
.hero h1{font-size:42px;margin:8px 0 6px;font-weight:900;letter-spacing:-1px}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.28em;color:#c4b5fd;font-weight:900}
.layout{display:grid;grid-template-columns:230px 1fr;gap:18px;margin-top:18px}
.sidebar{background:rgba(13,27,47,.88);border:1px solid rgba(255,255,255,.1);border-radius:26px;padding:12px;position:sticky;top:12px;height:fit-content}
.navbtn{width:100%;display:flex;align-items:center;gap:10px;border:0;border-radius:18px;background:transparent;color:var(--muted);padding:13px 14px;margin:4px 0;font-weight:800;text-align:left}
.navbtn.active,.navbtn:hover{background:linear-gradient(135deg,#7c3aed,#2563eb);color:white}
.panel{background:rgba(13,27,47,.9);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.grid{display:grid;gap:14px}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:rgba(18,35,59,.9);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:16px}
.stat{background:linear-gradient(135deg,rgba(56,189,248,.15),rgba(124,58,237,.16));border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:16px}
.stat .n{font-size:32px;font-weight:900}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.input,select,textarea{background:#07111f;color:white;border:1px solid #28405f;border-radius:12px;padding:10px 12px;outline:none}
.input:focus,select:focus,textarea:focus{border-color:#8b5cf6}
.btn{border:0;border-radius:14px;background:#334155;color:white;padding:10px 14px;font-weight:900}
.btn.primary{background:linear-gradient(135deg,#7c3aed,#2563eb)}
.btn.green{background:#16a34a}
.btn.red{background:#dc2626}
.btn.yellow{background:#ca8a04}
.badge{display:inline-flex;border-radius:999px;background:#1e293b;border:1px solid #334155;padding:6px 10px;font-size:12px;font-weight:900;color:#dbeafe}
.team-card{transition:.15s;cursor:pointer}
.team-card:hover{transform:translateY(-2px);border-color:#8b5cf6}
.logoBox{height:72px;width:72px;border-radius:22px;display:grid;place-items:center;font-weight:900;font-size:18px;border:2px solid rgba(255,255,255,.25);overflow:hidden;background:#111827}
.logoBox img{width:100%;height:100%;object-fit:cover}
.jersey{width:54px;height:58px;position:relative;flex:0 0 auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.jersey svg{width:100%;height:100%}
.playerRow{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;background:#0b1627;border:1px solid #233955;border-radius:18px;padding:9px}

.playerRow:hover{border-color:#8b5cf6}
.hm-role-wrap{display:inline-flex;gap:5px;flex-wrap:wrap;vertical-align:middle;margin-left:4px}
.hm-role-badge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:23px;padding:0 7px;border-radius:7px;border:2px solid rgba(255,255,255,.72);font-size:11px;font-weight:900;line-height:1;color:#fff;box-shadow:0 2px 7px rgba(0,0,0,.18)}
.hm-role-por{background:#f5b333}
.hm-role-ds,.hm-role-dc,.hm-role-dd,.hm-role-b{background:#64b543}
.hm-role-e,.hm-role-m,.hm-role-c{background:#3d83ea}
.hm-role-w,.hm-role-t{background:#d842e1}
.hm-role-a,.hm-role-pc{background:#d93636}
.hm-roster-filter{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px;padding:12px 14px;background:#0b1627;border:1px solid #28405f;border-radius:18px}

.table{width:100%;border-collapse:separate;border-spacing:0 8px}
.table th{color:#a8b3c7;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding:0 8px}
.table td{background:#0b1627;border-top:1px solid #233955;border-bottom:1px solid #233955;padding:10px 8px}
.table td:first-child{border-left:1px solid #233955;border-radius:14px 0 0 14px}
.table td:last-child{border-right:1px solid #233955;border-radius:0 14px 14px 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tab{border:1px solid #334155;background:#0b1627;color:#cbd5e1;border-radius:999px;padding:9px 13px;font-weight:900}
.tab.active{background:#7c3aed;color:white;border-color:#7c3aed}
.hidden{display:none!important}
.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{width:min(900px,96vw);max-height:90vh;overflow:auto;background:#0d1b2f;border:1px solid #475569;border-radius:28px;padding:20px;box-shadow:0 30px 100px rgba(0,0,0,.55)}
.tradeSide{background:#0b1627;border:1px solid #28405f;border-radius:22px;padding:14px}
.tradePlayer{border:1px solid #334155;background:#101f35;border-radius:16px;padding:12px;margin:8px 0}
.tradePlayer.selected{border-color:#22c55e;background:rgba(34,197,94,.10)}
.lineItem{margin-top:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pitch{background:linear-gradient(0deg,rgba(34,197,94,.18),rgba(34,197,94,.04)),#0b3b25;border:2px solid rgba(255,255,255,.25);border-radius:24px;min-height:520px;position:relative;padding:18px;display:grid;grid-template-rows:repeat(4,1fr);gap:10px}
.pitchLine{display:flex;justify-content:center;align-items:center;gap:14px}
.slot{min-width:112px;min-height:78px;border:1px dashed rgba(255,255,255,.5);border-radius:18px;background:rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;color:#d1fae5;font-weight:900}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:static}.grid2,.grid3,.grid4{grid-template-columns:1fr}.lineItem{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="between">
      <div>
        <div class="kicker">HM League Manager</div>
        <h1>Gestionale completo funzionante · Scambi admin fix</h1>
        <div class="muted">Demo locale con dati reali CSV. Per renderla online servirà database cloud + login.</div>
      </div>
      <div class="row">
        <span class="badge" id="totalPlayersBadge"></span>
        <span class="badge">Registro Scambi FIX</span>
        <span class="badge" id="firebaseStatusBadge">☁️ Firebase in attesa</span>
        <button class="btn" id="hmFirebaseLoginBtn" type="button">🔐 Login Google</button>
        <button class="btn green" id="hmFirebaseSaveBtn" type="button" disabled>💾 Salva online</button>
        <button class="btn yellow" id="hmDownloadBackupBtn" type="button" onclick="downloadFullBackup()">📦 Backup</button>
        <button class="btn" id="hmRestoreBackupBtn" type="button" onclick="triggerRestoreBackup()">♻️ Ripristina</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <button class="navbtn active" data-view="dashboard">🏠 Dashboard</button>
      <button class="navbtn" data-view="teams">🏟️ Società</button>
      <button class="navbtn" data-view="players">👥 Calciatori</button>
      <button class="navbtn" data-view="trades">🔁 Registro Scambi</button>
      <button class="navbtn" data-view="market">🔥 Mercato HML</button>
      <button class="navbtn" data-view="game">🎮 HML Game Lab</button>
      <button class="navbtn" data-view="ranking">📊 Ranking</button>
      <button class="navbtn" data-view="history">📚 Storico campionati</button>
      <button class="navbtn" data-view="auction">🔨 Asta</button>
      <button class="navbtn" data-view="actions">📣 Azioni Presidente</button>
      <button class="navbtn" data-view="regulation">📜 Regolamento</button>
      <button class="navbtn" data-view="coaches">👔 Allenatori</button>
      <button class="navbtn" data-view="compmanager">🏅 Competizioni</button>
      <button class="navbtn" data-view="competitions">🏆 Albo d'Oro</button>
      <button class="navbtn" id="hmAdminNavBtn" data-view="admin" style="display:none">🛠️ Admin</button>
      <button class="navbtn" data-view="style">🎨 Editor sito</button>
    </aside>

    


<main>
      <section id="view-dashboard" class="panel view"></section>
      <section id="view-teams" class="panel view hidden"></section>
      <section id="view-teamDetail" class="panel view hidden"></section>
      <section id="view-players" class="panel view hidden"></section>
      <section id="view-trades" class="panel view hidden"></section>
      <section id="view-market" class="panel view hidden"></section>
      <section id="view-game" class="panel view hidden"></section>
      <section id="view-renewals" class="panel view hidden"></section>
      <section id="view-ranking" class="panel view hidden"></section>
      <section id="view-history" class="panel view hidden"></section>
      <section id="view-auction" class="panel view hidden"></section>
      <section id="view-actions" class="panel view hidden"></section>
      <section id="view-regulation" class="panel view hidden"></section>
      <section id="view-coaches" class="panel view hidden"></section>
      <section id="view-compmanager" class="panel view hidden"></section>
      <section id="view-competitions" class="panel view hidden"></section>
      <section id="view-admin" class="panel view hidden"></section>
      <section id="view-style" class="panel view hidden"></section>
    </main>
  </div>
</div>

<div class="modalBack" id="tradeModal">
  <div class="modal">
    <div class="between">
      <h2>Riepilogo proposta scambio</h2>
      <button class="btn" onclick="closeTradeModal()">Chiudi</button>
    </div>
    <div id="tradeModalBody"></div>
  </div>
</div>
<input id="hmRestoreBackupInput" type="file" accept="application/json,.json" style="display:none" onchange="restoreBackupFromFile(event)">

function normalizeLoginName(v){return String(v||"").trim().toLowerCase();}
function isAdmin(){return currentUser && currentUser.role === "admin";}
function isLoggedIn(){return currentUser && currentUser.role && currentUser.role !== "guest";}
function userTeams(){return Array.isArray(currentUser?.teams) ? currentUser.teams : [];}
function canEditTeam(code){return isAdmin() || userTeams().includes(String(code||"").toUpperCase());}
function canEditPlayerObj(p){
  if(isAdmin()) return true;
  if(!p) return false;
  const allowed=userTeams();
  return allowed.includes(String(p.owner||"").toUpperCase()) || allowed.includes(String(p.current||"").toUpperCase());
}
function deny(msg="Non hai i permessi per modificare questa sezione."){alert(msg);return false;}
function requireLogin(){return isLoggedIn() || deny("Devi fare login per salvare/modificare.");}
function requireAdmin(){return isAdmin() || deny("Solo Federico admin può modificare questa sezione.");}
function requireTeam(code){return canEditTeam(code) || deny("Puoi modificare solo le tue squadre.");}

function openLoginModal(){
  const isIn=isLoggedIn();
  q("tradeModalBody").innerHTML = isIn ? `
    <h3>Account attivo</h3>
    <p class="muted">Sei collegato come <b>${esc(currentUser.username||currentUser.name)}</b> · ruolo: <b>${esc(currentUser.role)}</b></p>
    <div class="row" style="justify-content:flex-end;margin-top:14px">
      <button class="btn" onclick="closeTradeModal()">Chiudi</button>
      <button class="btn red" onclick="logoutUser()">Esci</button>
    </div>` : `
    <h3>Login HM League</h3>
    <p class="muted">Senza login puoi vedere tutto ma non puoi modificare.</p>
    <div class="grid grid2">
      <label>Utente<input id="hmLoginUser" class="input" placeholder="Federico, Antonio..."></label>
      <label>Password<input id="hmLoginPass" class="input" type="password" placeholder="Password"></label>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:14px">
      <button class="btn" onclick="closeTradeModal()">Annulla</button>
      <button class="btn green" onclick="loginUser()">Entra</button>
    </div>`;
  q("tradeModal").style.display="flex";
}
function loginUser(){
  const u=normalizeLoginName(q("hmLoginUser")?.value);
  const pass=String(q("hmLoginPass")?.value||"");
  const rec=HM_AUTH_USERS[u];
  if(!rec || rec.password!==pass){alert("Utente o password errati.");return;}
  currentUser={username:rec.name,role:rec.role,teams:[...rec.teams]};
  safeSetStorage("hm_current_user_v1", currentUser);
  closeTradeModal();
  updateAuthBadge();
  showView("dashboard");
  loadCloudData();
}
function logoutUser(){
  currentUser={username:"Ospite",role:"guest",teams:[]};
  safeSetStorage("hm_current_user_v1", currentUser);
  closeTradeModal();
  updateAuthBadge();
  showView("dashboard");
}
function updateAuthBadge(){
  const badge=q("authStatusBadge");
  const btn=q("hmLoginBtn");
  if(!badge || !btn) return;
  if(isAdmin()){badge.textContent="🔓 Federico admin";btn.textContent="👤 Account";}
  else if(isLoggedIn()){badge.textContent=`🔐 ${currentUser.username} · ${userTeams().join("/")}`;btn.textContent="👤 Account";}
  else{badge.textContent="👁️ Ospite sola lettura";btn.textContent="🔐 Login";}
  const saveBtn=q("manualSaveOnlineBtn");
  if(saveBtn){saveBtn.disabled=!isLoggedIn();saveBtn.style.opacity=isLoggedIn()?"1":".45";}
}
function currentVisibleViewName(){
  const v=[...document.querySelectorAll(".view")].find(x=>!x.classList.contains("hidden"));
  return v ? v.id.replace("view-","") : "dashboard";
}
function renderCurrentView(){
  const view = currentVisibleViewName();
  if(view === "teamDetail") renderTeamDetail();
  else showView(view || "dashboard");
  applyPermissionsToVisibleView();
}
function isReadOnlyNavigationButton(btn){
  const onclick=String(btn.getAttribute("onclick")||"");
  return btn.classList.contains("navbtn") || btn.id==="hmLoginBtn" || onclick.includes("openTeam(") || onclick.includes("openSeasonDetail(") || onclick.includes("showView(") || onclick.includes("downloadFullBackup(");
}
function setControlLocked(el, locked){
  if(!el) return;
  if(el.id==="hmRestoreBackupInput") return;
  if(el.id==="manualSaveOnlineBtn"){el.disabled = locked || !isLoggedIn(); el.style.opacity=el.disabled?".45":"1"; return;}
  if(el.id==="hmLoginBtn" || el.classList.contains("navbtn")) return;
  if(el.tagName==="BUTTON" && isReadOnlyNavigationButton(el)) return;
  el.disabled=!!locked;
  if(el.tagName==="BUTTON" || el.tagName==="INPUT" || el.tagName==="SELECT" || el.tagName==="TEXTAREA") el.style.opacity=locked?".45":"1";
}
function applyPermissionsToVisibleView(){
  updateAuthBadge();
  const view=currentVisibleViewName();
  let allowEdit=false;
  if(isAdmin()) allowEdit=true;
  else if(isLoggedIn()){
    if(view==="teamDetail" || view==="renewals") allowEdit=canEditTeam(selectedTeam);
    if(view==="actions") allowEdit=true; // il salvataggio resta bloccato alle sole squadre del presidente
    if(view==="trades") allowEdit=true; // i presidenti possono proporre/confermare scambi che coinvolgono le loro squadre
    if(view==="auction") allowEdit=true; // i presidenti possono partecipare all'asta con le proprie squadre
  }
  const visible=[...document.querySelectorAll(".view")].find(x=>!x.classList.contains("hidden"));
  if(visible){
    visible.querySelectorAll("button,input,select,textarea").forEach(el=>setControlLocked(el,!allowEdit));

    // Calciatori: i presidenti devono poter usare SOLO ricerca/filtri.
    // Le azioni vere (Aggiungi/Modifica/Elimina/Salva calciatore) restano bloccate.
    if(view === "players" && isLoggedIn() && !isAdmin()){
      ["plSearch","plRole","plCurrent","plOwner","plStatus","plBonus","plDeadline","plContractMin","plContractMax"].forEach(id=>{
        const el = q(id);
        if(el){ el.disabled = false; el.style.opacity = "1"; }
      });
      visible.querySelectorAll('button[onclick^="clearFilters(\'pl\'"]').forEach(btn=>{
        btn.disabled = false;
        btn.style.opacity = "1";
      });
    }
  }
  // Ripristino backup solo admin; backup download sempre consentito.
  document.querySelectorAll('button[onclick*="triggerRestoreBackup"]').forEach(b=>setControlLocked(b,!isAdmin()));
}
function protectCall(fn, check){
  return function(...args){
    if(!check(...args)) return;
    return fn.apply(this,args);
  }
}

function safeSetStorage(key, value){
  try{
    const serialized = JSON.stringify(value);
    // Evita riscritture sincrone inutili su localStorage: se il dato è già identico,
    // il salvataggio locale è già concluso e non serve riscriverlo.
    if(localStorage.getItem(key) === serialized) return true;
    localStorage.setItem(key, serialized);
    return true;
  }catch(e){
    console.warn("Storage pieno, salto salvataggio:", key, e);
    return false;
  }
}

function buildLocalCloudMirror(){
  // Copia di sicurezza di tutti i dati HM salvati nel browser, immagini comprese.
  // Escludo solo login personale e archivio backup per non propagare account o gonfiare troppo il cloud.
  const mirror = {};
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(!k || !k.startsWith("hm_")) continue;
      if(k === "hm_current_user_v1" || k === "hm_backup_archive_v1") continue;
      mirror[k] = localStorage.getItem(k);
    }
  }catch(e){
    console.warn("Mirror localStorage non creato", e);
  }
  return mirror;
}

function applyLocalCloudMirror(mirror){
  if(!mirror || typeof mirror !== "object") return;
  try{
    Object.entries(mirror).forEach(([k,v])=>{
      if(!k || !k.startsWith("hm_")) return;
      if(k === "hm_current_user_v1" || k === "hm_backup_archive_v1") return;
      if(typeof v === "string") localStorage.setItem(k, v);
    });
  }catch(e){
    console.warn("Mirror localStorage non applicato completamente", e);
  }
}

function teamExistsStrict(code){
  return teams.some(t=>t && t.code===code);
}

function cleanRankingRows(rows){
  if(!Array.isArray(rows)) return [];
  const seen = new Set();
  return rows
    .filter(r=>r && typeof r === "object")
    .map(r=>({code:String(r.code||"").trim().toUpperCase(), points:r.points??0, manualOrder:r.manualOrder??""}))
    .filter(r=>r.code && r.code!=="SVIN" && teamExistsStrict(r.code) && !seen.has(r.code) && seen.add(r.code));
}

function parseMirrorValue(mirror, key, fallback){
  try{
    if(!mirror || typeof mirror[key] !== "string") return fallback;
    return JSON.parse(mirror[key]);
  }catch(e){
    return fallback;
  }
}

function normalizeCloudPayload(data){
  // Google può restituire sia il payload diretto sia un backup wrapper {backupType,data}.
  // Inoltre alcuni vecchi salvataggi hanno i dati completi dentro localMirror.
  if(typeof data === "string"){
    try{ data = JSON.parse(data); }catch(e){ return null; }
  }
  if(!data || typeof data !== "object") return null;
  if(data.backupType === "HM_LEAGUE_MANAGER_BACKUP" && data.data) data = data.data;
  if(data.data && typeof data.data === "object" && (data.data.players || data.data.localMirror)) data = data.data;

  const mirror = data.localMirror && typeof data.localMirror === "object" ? data.localMirror : null;
  if(mirror){
    if(!Array.isArray(data.players) || data.players.length < 50) data.players = parseMirrorValue(mirror, "hm_players_v1", data.players || []);
    if(!Array.isArray(data.teams) || data.teams.length < 10) data.teams = parseMirrorValue(mirror, "hm_teams_v1", data.teams || []);
    if(!Array.isArray(data.trades)) data.trades = parseMirrorValue(mirror, "hm_trades_v1", data.trades || []);
    if(!Array.isArray(data.news)) data.news = parseMirrorValue(mirror, "hm_news_v1", data.news || []);
    if(!Array.isArray(data.honors)) data.honors = parseMirrorValue(mirror, "hm_honors_v1", data.honors || []);
    if(!Array.isArray(data.individualTitles)) data.individualTitles = parseMirrorValue(mirror, "hm_individual_titles_v1", data.individualTitles || []);
    if(!Array.isArray(data.positionHistory)) data.positionHistory = parseMirrorValue(mirror, "hm_positions_v1", data.positionHistory || []);
    if(!data.orgData || typeof data.orgData !== "object") data.orgData = parseMirrorValue(mirror, "hm_org_v1", data.orgData || {});
    if(!data.awardImages || typeof data.awardImages !== "object") data.awardImages = parseMirrorValue(mirror, "hm_award_images_v1", data.awardImages || {});
    if(!Array.isArray(data.rankingData)) data.rankingData = parseMirrorValue(mirror, "hm_ranking_v1", data.rankingData || []);
    if(!Array.isArray(data.rankingHidden)) data.rankingHidden = parseMirrorValue(mirror, "hm_ranking_hidden_v1", data.rankingHidden || []);
    if(!Array.isArray(data.seasonHistory)) data.seasonHistory = parseMirrorValue(mirror, "hm_season_history_v1", data.seasonHistory || []);
    if(!data.savedFormations || typeof data.savedFormations !== "object") data.savedFormations = parseMirrorValue(mirror, "hm_formations_v1", data.savedFormations || {});
    if(!data.auctionState || typeof data.auctionState !== "object") data.auctionState = parseMirrorValue(mirror, "hm_auction_v1", data.auctionState || {});
    if(!Array.isArray(data.presidentActions)) data.presidentActions = parseMirrorValue(mirror, "hm_president_actions_v1", data.presidentActions || []);
    if(data.competitionsManager === undefined || data.competitionsManager === null) data.competitionsManager = parseMirrorValue(mirror, "hm_competitions_manager_v1", data.competitionsManager || null);
    if(data.coachesManager === undefined || data.coachesManager === null) data.coachesManager = parseMirrorValue(mirror, "hm_coaches_manager_v1", data.coachesManager || null);
    if(typeof data.regulationText !== "string" && typeof mirror.hm_regulation_text_v1 === "string") data.regulationText = mirror.hm_regulation_text_v1;
  }
  return data;
}

function hasUsefulCloudData(data){
  data = normalizeCloudPayload(data);
  return !!(data && typeof data === "object" && Array.isArray(data.players) && data.players.length > 100 && Array.isArray(data.teams) && data.teams.length >= 16);
}

function applyCloudPayload(data){
  data = normalizeCloudPayload(data);
  if(!hasUsefulCloudData(data)) return false;

  // Prima applico eventuale mirror completo: così loghi, immagini e regolamento arrivano anche su browser nuovi.
  if(data.localMirror && typeof data.localMirror === "object") applyLocalCloudMirror(data.localMirror);

  if(Array.isArray(data.teams) && data.teams.length>=16) {
    // Merge protettivo: se il cloud ha loghi vuoti ma il browser li ha ancora in memoria,
    // NON li cancelliamo al refresh. Evita perdita loghi quando un salvataggio cloud precedente era parziale.
    const previousTeamsByCode = Object.fromEntries((Array.isArray(teams)?teams:[]).map(t=>[t.code,t]));
    teams = data.teams.filter(t=>t && t.code).map(t=>{
      const prev = previousTeamsByCode[t.code] || {};
      return {
        ...t,
        logo: (t.logo && String(t.logo).trim()) ? t.logo : (prev.logo || ""),
        primary: t.primary || prev.primary || "#334155",
        secondary: t.secondary || prev.secondary || "#111827",
        text: t.text || prev.text || "#ffffff",
        jerseyStyle: t.jerseyStyle || prev.jerseyStyle || "diagonal",
        credits: t.credits !== undefined ? t.credits : prev.credits,
        hmcoin: t.hmcoin !== undefined ? t.hmcoin : prev.hmcoin
      };
    });
  }
  if(Array.isArray(data.players) && data.players.length>100) players = data.players;

  // IMPORTANTISSIMO: non sovrascrive registri già presenti con array vuoti arrivati dal cloud.
  if(Array.isArray(data.trades) && (data.trades.length || !trades.length)) trades = data.trades;
  if(Array.isArray(data.news) && (data.news.length || !news.length)) news = data.news;
  if(Array.isArray(data.honors) && (data.honors.length || !honors.length)) honors = data.honors;
  if(Array.isArray(data.individualTitles) && (data.individualTitles.length || !individualTitles.length)) individualTitles = data.individualTitles;
  if(Array.isArray(data.positionHistory) && (data.positionHistory.length || !positionHistory.length)) positionHistory = data.positionHistory;
  if(data.orgData && typeof data.orgData==="object" && Object.keys(data.orgData).length) orgData = data.orgData;
  if(data.awardImages && typeof data.awardImages==="object" && Object.keys(data.awardImages).length) awardImages = data.awardImages;

  const cleanedRanking = cleanRankingRows(data.rankingData);
  if(cleanedRanking.length || !rankingData.length) rankingData = cleanedRanking;
  if(Array.isArray(data.rankingHidden)) rankingHidden = data.rankingHidden.filter(code=>code && code!=="SVIN");

  if(Array.isArray(data.seasonHistory) && (data.seasonHistory.length || !seasonHistory.length)) seasonHistory = data.seasonHistory;
  if(data.savedFormations && typeof data.savedFormations==="object" && Object.keys(data.savedFormations).length) savedFormations = data.savedFormations;
  if(data.auctionState && typeof data.auctionState==="object") auctionState = data.auctionState;
  // Non applico currentUser dal cloud: evita che un login admin si propaghi ad altri browser.
  if(Array.isArray(data.presidentActions) && (data.presidentActions.length || !presidentActions.length)) presidentActions = data.presidentActions;
  if(data.competitionsManager !== undefined && data.competitionsManager !== null) competitionsManager = data.competitionsManager;
  if(data.coachesManager !== undefined && data.coachesManager !== null) coachesManager = data.coachesManager;
  if(Array.isArray(data.backupArchive) && data.backupArchive.length) backupArchive = data.backupArchive.slice(-25);
  if(typeof data.regulationText === "string") regulationText = data.regulationText;

  rankingData = cleanRankingRows(rankingData);
  ensureTeamBudgets();
  if(typeof ensureCompetitionsManager==="function") ensureCompetitionsManager();
  if(typeof ensureCoachesManager==="function") ensureCoachesManager();
  return true;
}

function buildBackupSnapshot(label="manuale"){
  const data = buildCloudPayload();
  // Evita backup dentro backup.
  delete data.backupArchive;
  // Il payload normale contiene già teams, players, scambi, immagini, storico ecc.
  // localMirror è una SECONDA copia serializzata degli stessi dati: utile per il cloud,
  // ma inutile nel file backup e molto pesante soprattutto con immagini Base64.
  // Lo togliamo SOLO dal backup: il salvataggio cloud resta invariato.
  delete data.localMirror;
  return {
    backupType: "HM_LEAGUE_MANAGER_BACKUP",
    backupVersion: 1,
    createdAt: new Date().toISOString(),
    label,
    data
  };
}

function rememberBackupSnapshot(label="automatico"){
  try{
    const snap = buildBackupSnapshot(label);
    backupArchive = Array.isArray(backupArchive) ? backupArchive : [];
    backupArchive.push({
      id: "backup_" + Date.now(),
      createdAt: snap.createdAt,
      label: snap.label,
      data: snap.data
    });
    backupArchive = backupArchive.slice(-25);
    safeSetStorage("hm_backup_archive_v1", backupArchive);
    return snap;
  }catch(e){
    console.warn("Backup locale non creato", e);
    return null;
  }
}

function downloadFullBackup(){
  // Scarica SEMPRE un backup completo dello stato attuale caricato in app, senza dipendere dall'archivio backup.
  const snap = buildBackupSnapshot("download manuale completo");
  const blob = new Blob([JSON.stringify(snap)], {type:"application/json"});
  const a = document.createElement("a");
  const d = new Date();
  const pad = n => String(n).padStart(2,"0");
  const filename = `hm_league_backup_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}.json`;
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function normalizeBackupPayload(raw){
  if(!raw || typeof raw !== "object") return null;
  if(raw.backupType === "HM_LEAGUE_MANAGER_BACKUP" && raw.data) return raw.data;
  if(raw.data && hasUsefulCloudData(raw.data)) return raw.data;

function restoreBackupFromFile(event){
  if(!requireAdmin()) return;
  const file = event?.target?.files?.[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const raw = JSON.parse(String(reader.result||"{}"));
      const data = normalizeBackupPayload(raw);
      if(!hasUsefulCloudData(data)){
        alert("Backup non valido o incompleto. Non ho modificato nulla.");
        return;
      }
      if(!confirm("Vuoi ripristinare questo backup? I dati attuali verranno sostituiti in locale. Dopo il controllo dovrai premere Salva online.")) return;
      rememberBackupSnapshot("prima del ripristino");
      if(applyCloudPayload(data)){
        saveLocalOnly();
        HM_HAS_UNSAVED_CHANGES = true;
        updateCloudBadge();
        showView("dashboard");
        alert("Backup ripristinato in locale. Controlla i dati e poi premi Salva online per pubblicarlo anche su Google.");
      }else{
        alert("Ripristino non riuscito. Backup non applicato.");
      }
    }catch(e){
      console.error(e);
      alert("Errore lettura backup. File JSON non valido.");
    }
  };
  reader.readAsText(file);
}


function sleepHm(ms){
  return new Promise(resolve=>setTimeout(resolve, ms));
}

function getPayloadStamp(data){
  return data && typeof data === "object" ? String(data.updatedAt || "") : "";
}

async function verifyCloudSaved(expectedStamp){
  try{
    const onlineRaw = await loadCloudJsonp();
    const online = normalizeCloudPayload(onlineRaw);
    if(!hasUsefulCloudData(online)) return false;
    return !expectedStamp || getPayloadStamp(online) === expectedStamp;
  }catch(e){
    console.warn("Verifica salvataggio cloud non riuscita", e);
    return false;
  }
}

async function postCloudPayloadRaw(text){
  // Invio RAW del JSON completo a Google Apps Script.
  // Questo evita il limite/bug dei form HTML con campo payload, che può troncare loghi e immagini grandi.
  try{
    await fetch(HM_CLOUD_API_URL, {
      method: "POST",
      mode: "no-cors",
      cache: "no-store",
      headers: {"Content-Type":"text/plain;charset=utf-8"},
      body: text
    });
    return true;
  }catch(e){
    console.warn("POST raw cloud fallito, provo fallback form", e);
  }

  // Fallback vecchio: utile solo se fetch viene bloccato dal browser.
  return new Promise((resolve)=>{
    const frameName = "hmCloudPostFrame_" + Date.now() + "_" + Math.floor(Math.random()*100000);
    const iframe = document.createElement("iframe");
    iframe.name = frameName;
    iframe.style.display = "none";

    const form = document.createElement("form");
    form.method = "POST";
    form.action = HM_CLOUD_API_URL;
    form.target = frameName;
    form.enctype = "text/plain";
    form.style.display = "none";

    const textarea = document.createElement("textarea");
    textarea.name = "";
    textarea.value = text;
    form.appendChild(textarea);

    let done = false;
    function cleanup(){
      if(done) return;
      done = true;
      setTimeout(()=>{
        try{ form.remove(); }catch(e){}
        try{ iframe.remove(); }catch(e){}
      }, 500);
      resolve(true);
    }

    iframe.onload = cleanup;
    document.body.appendChild(iframe);
    document.body.appendChild(form);
    form.submit();
    setTimeout(cleanup, 6000);
  });
}

async function postCloudPayloadBeacon(text){
  if(!navigator.sendBeacon) return false;
  try{
    const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
    return navigator.sendBeacon(HM_CLOUD_API_URL, blob);
  }catch(e){
    console.warn("Beacon cloud non riuscito", e);
    return false;
  }
}

async function saveCloudNow(showAlert=false){
  if(!isLoggedIn()){ if(showAlert) alert("Devi fare login per salvare online."); return; }
  if(HM_CLOUD_LOADING) {
    if(showAlert) alert("Sto ancora caricando i dati online. Riprova tra qualche secondo.");
    return;
  }
  if(!HM_CLOUD_API_URL) {
    if(showAlert) alert("API cloud non configurata.");
    return;
  }

  rememberBackupSnapshot(showAlert ? "prima del salvataggio online" : "autosave");
  const payload = buildCloudPayload();
  const text = JSON.stringify(payload);
  const expectedStamp = getPayloadStamp(payload);

  if(!showAlert && text === HM_CLOUD_LAST_SAVE && !HM_HAS_UNSAVED_CHANGES) return;

  HM_CLOUD_SAVING = true;
  updateCloudBadge();

  try{
    // Apps Script spesso salva correttamente ma non permette una conferma POST affidabile via browser.
    // Qui inviamo il pacchetto completo e poi proviamo a verificare: se la verifica fallisce, NON blocchiamo più l'utente
    // con il falso errore, perché il controllo reale resta il link /exec e il caricamento cloud successivo.
    await postCloudPayloadRaw(text);
    await sleepHm(2500);
    let verified = await verifyCloudSaved(expectedStamp);

    if(!verified){
      const beaconQueued = await postCloudPayloadBeacon(text);
      if(beaconQueued){
        await sleepHm(2500);
        verified = await verifyCloudSaved(expectedStamp);
      }
    }

    HM_CLOUD_READY = true;
    HM_HAS_UNSAVED_CHANGES = false;
    HM_CLOUD_LAST_SAVE = text;
    saveLocalOnly();
    updateCloudBadge();

    if(showAlert){
      const info = cloudPayloadInfo();
      alert((verified ? "Salvato online e verificato." : "Salvato online. Se vuoi conferma totale, controlla il link /exec: deve mostrare testo lungo.") + ` Sincronizzati anche loghi/immagini: ${info.logoCount} loghi, ${info.orgImageCount} immagini società, ${info.awardImageCount} immagini premi.`);
    }
  }catch(e){
    console.warn("Salvataggio cloud non riuscito", e);
    HM_CLOUD_READY = false;
    HM_HAS_UNSAVED_CHANGES = true;
    if(showAlert) alert("Errore salvataggio online. Controlla connessione e riprova.");
  }finally{
    HM_CLOUD_SAVING = false;
    updateCloudBadge();
  }
}

function scheduleCloudSave(){
  // Salvataggio automatico disattivato: si salva online solo premendo "Salva online".
  markUnsavedChanges();
}

function saveAll(){
  if(!isLoggedIn()){ alert("Devi fare login per modificare."); return false; }
  saveLocalOnly();

}

function uniqueValues(field){
  return [...new Set(players.map(p=>String(p[field]||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));

function matchesAdvancedFilters(p, prefix){
  const text=(q(prefix+"Search")?.value||"").toLowerCase();
  const role=q(prefix+"Role")?.value||"";
  const current=q(prefix+"Current")?.value||"";
  const owner=q(prefix+"Owner")?.value||"";
  const status=q(prefix+"Status")?.value||"";
  const bonus=q(prefix+"Bonus")?.value||"";
  const deadline=q(prefix+"Deadline")?.value||"";
  const contractMin=Number(q(prefix+"ContractMin")?.value||"");
  const contractMaxRaw=q(prefix+"ContractMax")?.value||"";
  const contractMax=contractMaxRaw===""?Infinity:Number(contractMaxRaw);
  const hay=[p.name,p.role,p.current,p.owner,p.status,p.bonus,p.contract,p.deadline].join(" ").toLowerCase();
  if(text && !hay.includes(text)) return false;
  if(role && !String(p.role||"").includes(role)) return false;
  if(current && p.current!==current) return false;
  if(owner && p.owner!==owner) return false;
  if(status && !String(p.status||"").toLowerCase().includes(status.toLowerCase())) return false;
  if(bonus==="with" && !String(p.bonus||"").trim()) return false;
  if(bonus==="without" && String(p.bonus||"").trim()) return false;
  if(deadline && p.deadline!==deadline) return false;
  const c=Number(String(p.contract||0).replace(",", ".")) || 0;
  if(c < contractMin) return false;
  if(c > contractMax) return false;
  return true;
}

function updateCloudBadge(){
  const el=document.getElementById("cloudStatusBadge");
  if(!el) return;
  if(HM_CLOUD_LOADING) el.textContent="☁️ Caricamento dati...";
  else if(HM_CLOUD_SAVING) el.textContent="☁️ Salvataggio...";
  else if(HM_HAS_UNSAVED_CHANGES) el.textContent="⚠️ Modifiche non salvate online";
  else if(HM_CLOUD_READY) el.textContent="☁️ Online sincronizzato";
  else el.textContent="☁️ Solo locale";
}


function markUnsavedChanges(){
  HM_HAS_UNSAVED_CHANGES = true;
  updateCloudBadge();
}

function loadCloudJsonp(){
  return new Promise((resolve, reject)=>{
    if(!HM_CLOUD_API_URL){ resolve(null); return; }
    const cb = "hmCloudCallback_" + Date.now() + "_" + Math.floor(Math.random()*100000);
    const script = document.createElement("script");
    const sep = HM_CLOUD_API_URL.includes("?") ? "&" : "?";
    const timeout = setTimeout(()=>{
      cleanup();
      reject(new Error("Timeout caricamento dati online"));
    }, 12000);
    function cleanup(){
      clearTimeout(timeout);
      try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
      if(script && script.parentNode) script.parentNode.removeChild(script);
    }
    window[cb] = function(data){
      cleanup();
      resolve(data || null);
    };
    script.onerror = function(){
      cleanup();
      reject(new Error("Errore caricamento dati online"));
    };
    script.src = HM_CLOUD_API_URL + sep + "callback=" + encodeURIComponent(cb) + "&t=" + Date.now();
    document.body.appendChild(script);
  });
}

async function loadCloudData(){
  if(!HM_CLOUD_API_URL) return;
  // Protezione fondamentale: se il browser ha modifiche non ancora salvate, NON ricarico il cloud sopra.
  // Altrimenti un refresh/focus può cancellare loghi o nuovi calciatori appena inseriti.
  if(HM_HAS_UNSAVED_CHANGES){
    console.warn("Cloud load saltato: ci sono modifiche locali non salvate online.");
    updateCloudBadge();
    return;
  }
  HM_CLOUD_LOADING = true;
  updateCloudBadge();

  try{
    const rawData = await loadCloudJsonp();
    const data = normalizeCloudPayload(rawData);

    if(hasUsefulCloudData(data)){
      if(applyCloudPayload(data)){
        HM_CLOUD_READY = true;
        HM_HAS_UNSAVED_CHANGES = false;
        HM_CLOUD_LAST_SAVE = JSON.stringify(buildCloudPayload());
        saveLocalOnly();
      }
    }else{
      // Non pubblico automaticamente dati locali sopra un cloud vuoto/parziale:
      // si evita di cancellare registri come scambi, ranking e storico.
      HM_CLOUD_READY = false;
      console.warn("Cloud vuoto/incompleto o in formato non riconosciuto: dati online non applicati.", rawData);
    }
  }catch(e){
    console.warn("Caricamento cloud non riuscito", e);
  }finally{
    HM_CLOUD_LOADING = false;
    updateCloudBadge();
    if(typeof renderCurrentView === "function") renderCurrentView();
    else if(typeof renderDashboard==="function") renderDashboard();
  }
}

/* =========================================================
   ROSA SOCIETÀ - visualizzazione unica per reparto
   Ogni calciatore compare UNA SOLA VOLTA nel reparto
   più difensivo compatibile con i suoi ruoli Mantra.
   ========================================================= */

function hmRosterRoleTokens(p){
  return String(p?.role||"")
    .replace(/,/g,";")
    .split(";")
    .map(x=>x.trim())
    .filter(Boolean);
}

function hmRosterPrimaryGroup(p){
  const rr = hmRosterRoleTokens(p);

  // Priorità reparto dal più difensivo al più offensivo.
  if(rr.includes("Por")) return "Portieri";

  // Se possiede almeno un ruolo difensivo, resta in Difesa
  // anche quando ha anche E/M/C/W/T/A.
  if(rr.some(r=>["B","Ds","Dc","Dd"].includes(r))) return "Difensori";

  // E/M/C/W/T sono considerati reparto di centrocampo.
  // Quindi W;A e T;A compaiono qui, non anche in Attacco.
  if(rr.some(r=>["E","M","C","W","T"].includes(r))) return "Centrocampisti";

  if(rr.some(r=>["A","Pc"].includes(r))) return "Attaccanti";

  return "Altro";
}

function hmRosterSections(list){
  const out={
    "Portieri":[],
    "Difensori":[],
    "Centrocampisti":[],
    "Attaccanti":[],
    "Altro":[]
  };
  (list||[]).forEach(p=>{
    const g=hmRosterPrimaryGroup(p);
    (out[g]||out.Altro).push(p);
  });
  return out;
}

function roleTokensForPlayer(p){
  return String(p.role||"")
    .replaceAll(";",",")
    .replaceAll("/",",")
    .replaceAll(" ","")
    .split(",")
    .map(x=>x.trim())
    .filter(Boolean);
}

function allowedForSlot(slot){
  const map={
    "Por":["Por"],
    "Dc":["Dc"],
    "Dd":["Dd","Dc"],
    "Ds":["Ds","Dc"],
    "Dc/B":["Dc","Dd","Ds"],
    "M":["M"],
    "C":["C"],
    "M/C":["M","C"],
    "E":["E"],
    "W":["W"],
    "E/W":["E","W"],
    "T":["T"],
    "T/A":["T","A"],
    "A":["A"],
    "Pc":["Pc"],
    "A/Pc":["A","Pc"],
    "W/A":["W","A"],
    "W/T":["W","T"],
    "C/T":["C","T"]
  };
  return map[slot] || [slot];
}

function playerCompatibleStrict(p,slot){
  const playerRoles=roleTokensForPlayer(p);
  const allowed=allowedForSlot(slot);
  return playerRoles.some(r=>allowed.includes(r));
}

function moduleRows(module){
  // dalla porta verso l'attacco, campo verticale. Le righe sono già ordinate in modo pulito.
  const data={
    "343":[["Por"],["Dc","Dc","Dc"],["E","M/C","C","E"],["W/A","A/Pc","W/A"]],
    "3421":[["Por"],["Dc","Dc","Dc"],["E","M/C","C","E"],["T","T/A"],["A/Pc"]],
    "352":[["Por"],["Dc","Dc","Dc"],["E/W","M/C","M","C","E/W"],["A/Pc","A/Pc"]],
    "3412":[["Por"],["Dc","Dc","Dc"],["E/W","M/C","C","E/W"],["T"],["A/Pc","A/Pc"]],
    "433":[["Por"],["Dd","Dc","Dc","Ds"],["M/C","M","C"],["W/A","A/Pc","W/A"]],
    "4312":[["Por"],["Dd","Dc","Dc","Ds"],["M/C","M","C"],["T"],["A/Pc","A/Pc"]],
    "442":[["Por"],["Dd","Dc","Dc","Ds"],["E/W","M/C","C","E/W"],["A/Pc","A/Pc"]],
    "4141":[["Por"],["Dd","Dc","Dc","Ds"],["M"],["E/W","C/T","T","W"],["A/Pc"]],
    "4231":[["Por"],["Dd","Dc","Dc","Ds"],["M","M/C"],["W/T","T","W/A"],["A/Pc"]]
  };
  return data[module] || data["343"];
}

function renderPitch(code){
  const module=q("modulo")?.value || "343";
  savedFormations[code]=savedFormations[code] || {module,slots:{}};
  if(savedFormations[code].module!==module){
    savedFormations[code].module=module;
    savedFormations[code].slots={};
  }

  const roster=currentRoster(code).sort((a,b)=>a.name.localeCompare(b.name));
  const rows=moduleRows(module);
  const box=q("pitchBox");

  box.innerHTML = `
    <div class="pitch" style="
      min-height:720px;
      display:flex;
      flex-direction:column-reverse;
      justify-content:space-between;
      background:
        linear-gradient(90deg,rgba(255,255,255,.16) 1px,transparent 1px),
        linear-gradient(0deg,rgba(255,255,255,.13) 1px,transparent 1px),
        radial-gradient(circle at center,rgba(255,255,255,.16) 0 60px,transparent 61px),
        #138a38;
      background-size: 100% 100%, 100% 25%, 100% 100%;
      border:3px solid rgba(255,255,255,.75);
    ">
      ${rows.map((line,li)=>`
        <div class="pitchLine" style="display:flex;justify-content:center;gap:18px;align-items:center;min-height:105px">
          ${line.map((slot,si)=>{
            const key=`${module}_${li}_${si}`;
            const selected=savedFormations[code]?.slots?.[key] || "";
            const available=roster.filter(p=>playerCompatibleStrict(p,slot));
            return `
              <div class="slot" style="min-width:135px;background:rgba(4,16,30,.58);border:2px solid rgba(255,255,255,.65);color:white">
                <div style="width:100%">
                  <div style="font-weight:900;margin-bottom:6px">${slot}</div>
                  <select class="input" style="width:100%;font-size:12px" onchange="saveFormationSlot('${code}','${key}',this.value)">
                    <option value="">-- scegli --</option>
                    ${available.map(p=>`<option value="${p.id}" ${p.id===selected?"selected":""}>${esc(p.name)} (${esc(p.role)})</option>`).join("")}
                  </select>
                </div>
              </div>`;
          }).join("")}
        </div>`).join("")}
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button class="btn green" onclick="hmSaveFormationStayVisible('${code}')">Salva formazione</button>
      <button class="btn red" onclick="clearFormation('${code}')">Svuota formazione</button>
    </div>`;
  saveAll();
}

function saveFormationSlot(code,key,value){
  savedFormations[code]=savedFormations[code] || {module:q("modulo")?.value||"343",slots:{}};
  savedFormations[code].slots[key]=value;
  saveAll();
}

function clearFormation(code){
  if(!confirm("Svuotare la formazione?")) return;
  savedFormations[code]={module:q("modulo")?.value||"343",slots:{}};
  saveAll();
  renderPitch(code);
}

function resizeTeamLogoFile(file, done){
  const reader = new FileReader();
  reader.onload = function(){
    const original = reader.result;
    const img = new Image();
    img.onload = function(){
      try{
        const max = 420;
        let w = img.width || max;
        let h = img.height || max;
        const scale = Math.min(1, max / Math.max(w,h));
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        done(canvas.toDataURL("image/png"));
      }catch(e){
        console.warn("Compressione logo non riuscita, uso originale", e);
        done(original);
      }
    };
    img.onerror = function(){ done(original); };
    img.src = original;
  };
  reader.onerror = function(){ alert("Non riesco a leggere il file logo."); };
  reader.readAsDataURL(file);
}

function handleTeamLogoUpload(ev, code){
  try{
    if(ev){ ev.preventDefault?.(); ev.stopPropagation?.(); }
    hmStartFilePicker();
    if(!requireTeam(code)){ hmEndFilePickerSoon(); return false; }
    const input = ev?.target || q("edTeamLogo");
    const file = input?.files && input.files[0];
    if(!file){ hmEndFilePickerSoon(); return false; }
    const t = team(code);
    if(!t){ hmEndFilePickerSoon(); return false; }
    resizeTeamLogoFile(file, function(dataUrl){
      // NON salvo e NON ridisegno la pagina qui. Creo solo una bozza logo.
      // Il salvataggio vero avviene quando premi "Salva società".
      HM_TEAM_LOGO_DRAFTS[code] = dataUrl;
      const preview = q("edTeamLogoPreview");
      if(preview) preview.innerHTML = `<img src="${dataUrl}" alt="logo">`;
      HM_HAS_UNSAVED_CHANGES = true;
      hmEndFilePickerSoon();
    });
    return false;
  }catch(err){
    hmEndFilePickerSoon();
    console.error("Errore caricamento logo società", err);
    alert("Errore caricamento logo: "+(err.message||err));
    return false;
  }
}

    delete HM_TEAM_LOGO_DRAFTS[code];

  renderTeamDetail();
  return true;
}

  closeTradeModal();
  renderPlayers();
  if(!q("view-teamDetail").classList.contains("hidden")) renderTeamDetail();
  return true;
}

function deletePlayerEditor(id){
  if(!requireAdmin()) return false;
  const p = players.find(x=>x.id===id);
  if(!p) return false;
  if(!confirm(`Eliminare definitivamente ${p.name}?`)) return false;
  players = players.filter(x=>x.id!==id);
  Object.keys(savedFormations||{}).forEach(teamCode=>{
    Object.keys(savedFormations[teamCode]||{}).forEach(slot=>{
      if(savedFormations[teamCode][slot]===id) delete savedFormations[teamCode][slot];
    });
  });
  if(saveAll() === false) return false;
  closeTradeModal();
  renderPlayers();
  if(!q("view-teamDetail").classList.contains("hidden")) renderTeamDetail();
  return true;
}

function changeTradeTeam(side,value){
  tradeState[side]=value;
  if(tradeState.from===tradeState.to){
    const other=teams.find(t=>t.code!=="SVIN" && t.code!==value);
    if(side==="from") tradeState.to=other.code; else tradeState.from=other.code;
  }
  tradeState.offer=[]; tradeState.request=[];

  // PERFORMANCE: cambiare squadra non richiede di ricostruire
  // l'intero Registro Scambi né lo storico confermato.
  const fromSel=q("tradeFrom");
  const toSel=q("tradeTo");

  if(toSel) toSel.value=tradeState.to;

  renderTradeLists();
  renderDraftSummary();

  try{

  }catch(e){}

function tradeMoneyText(items){
  const parts=(items||[]).map(it=>{
    const p=players.find(x=>x.id===it.id);
    const name=p?.name || it.id;
    const typ=it.type || "D";
    const cost=it.cost || "0";
    const ransom=(typ==="PD"||typ==="PO") ? `, riscatto fissato a ${it.ransom||0}` : "";
    const bonus=it.bonus ? `, bonus: ${it.bonus}` : "";
    return `${name}: ${typ}, costo ${cost}${ransom}${bonus}`;
  });
  return parts.join(" | ");
}

window.moveCredits = moveCredits;

function confirmTradeFromModal(){
  try{
    if(!pendingTrade){
      pendingTrade = JSON.parse(JSON.stringify(tradeState || {}));
    }
    if(!pendingTrade || !pendingTrade.from || !pendingTrade.to){
      alert("Nessuno scambio da confermare.");
      return false;
    }
    pendingTrade.offer = Array.isArray(pendingTrade.offer) ? pendingTrade.offer : [];
    pendingTrade.request = Array.isArray(pendingTrade.request) ? pendingTrade.request : [];
    if(!pendingTrade.offer.length && !pendingTrade.request.length){
      alert("Seleziona almeno un calciatore.");
      return false;
    }

    const restore = [];
    const budgetRestore = teams.map(t=>({code:t.code,credits:t.credits,hmcoin:t.hmcoin}));

    function applyTransfer(item, newOwner){
      const p = players.find(x=>x.id===item.id);
      if(!p) return;
      restore.push({
        id:p.id,
        owner:p.owner,
        status:p.status,
        bonus:p.bonus,
        contract:p.contract,
        deadline:p.deadline,
        ransom:p.ransom
      });
      p.owner = newOwner;
      if(String(item.type||"").trim()) p.status = String(item.type).trim();
      if(item.bonus !== undefined) p.bonus = String(item.bonus||"").trim();
      if(item.ransom !== undefined && String(item.ransom||"").trim()){
        p.ransom = String(item.ransom).trim();
        if(p.status==="PD" || p.status==="PO") p.deadline = "Riscatto " + String(item.ransom).trim();
      }
    }

    // La squadra che riceve il giocatore paga il costo alla squadra cedente.
    pendingTrade.offer.forEach(it=>{
      moveCredits(pendingTrade.to, pendingTrade.from, it.cost);
      applyTransfer(it, pendingTrade.to);
    });

    pendingTrade.request.forEach(it=>{
      moveCredits(pendingTrade.from, pendingTrade.to, it.cost);
      applyTransfer(it, pendingTrade.from);
    });

    const registeredTrade = {
      ...JSON.parse(JSON.stringify(pendingTrade)),
      date:new Date().toLocaleString("it-IT"),
      id:"T"+Date.now(),
      restore,
      budgetRestore,
      applied:true
    };

    trades.unshift(registeredTrade);

    if(typeof createAutoTradeNews === "function"){
      createAutoTradeNews(registeredTrade);
    }else{
      news.unshift({
        title:`UFFICIALE: scambio registrato tra ${teamFullName(registeredTrade.from)} e ${teamFullName(registeredTrade.to)}`,
        type:"Trasferimento",
        body:`Scambio registrato tra ${teamFullName(registeredTrade.from)} e ${teamFullName(registeredTrade.to)}. Proprietari e crediti aggiornati nel database HM League.`,
        author:"Ufficio Comunicati HM League",
        pinned:false,
        date:new Date().toLocaleDateString("it-IT")
      });
    }

    if(saveAll() === false) return false;
    closeTradeModal();
    resetTradeForm();
    renderTrades();

    alert("Scambio registrato: calciatori trasferiti, crediti aggiornati e comunicato creato.");
    return true;
  }catch(err){
    console.error(err);
    alert("Errore durante la registrazione dello scambio: " + (err.message || err));
    return false;
  }
}

function saveAdminTrade(i, recalcOwners){
  const t=trades[i];
  if(!t) return;

  if(recalcOwners) restoreBudgets(t);
  if(recalcOwners && t.applied && Array.isArray(t.restore)){
    t.restore.forEach(r=>{
      const p=players.find(x=>x.id===r.id);
      if(p) p.owner=r.owner;
    });
  }

  t.from=q("adminTradeFrom").value;
  t.to=q("adminTradeTo").value;
  t.offer=readAdminItems(t.offer || [], "offer");
  t.request=readAdminItems(t.request || [], "request");
  t.editedAt=new Date().toLocaleString("it-IT");

  if(recalcOwners){
    const restore=[];
    const budgetRestore=teams.map(tm=>({code:tm.code,credits:tm.credits,hmcoin:tm.hmcoin}));
    t.offer.forEach(it=>{
      moveCredits(t.to, t.from, it.cost);
      const p=players.find(x=>x.id===it.id);
      if(p){
        restore.push({id:p.id, owner:p.owner});
        p.owner=t.to;
      }
    });
    t.request.forEach(it=>{
      moveCredits(t.from, t.to, it.cost);
      const p=players.find(x=>x.id===it.id);
      if(p){
        restore.push({id:p.id, owner:p.owner});
        p.owner=t.from;
      }
    });
    t.restore=restore;
    t.budgetRestore=budgetRestore;
    t.applied=true;
  }

  saveAll();
  closeTradeModal();
  renderTrades();
}

function restoreBudgets(t){
  if(Array.isArray(t.budgetRestore)){
    t.budgetRestore.forEach(r=>{
      const tm=team(r.code);
      if(tm){tm.credits=r.credits;tm.hmcoin=r.hmcoin;}
    });
  }
}

function deleteConfirmedTrade(i){

  restoreBudgets(t);
  if(t.applied && Array.isArray(t.restore)){
    t.restore.forEach(r=>{
      const p=players.find(x=>x.id===r.id);
      if(p) p.owner=r.owner;
    });
  }

  trades.splice(i,1);
  saveAll();
  renderTrades();
}

function editConfirmedTrade(i){
  const t=trades[i];
  if(!t) return;

  if(!confirm("Modificare questo scambio? Verrà tolto dal registro, i proprietari verranno ripristinati e lo ritroverai nella proposta da modificare.")) return;

  if(t.applied && Array.isArray(t.restore)){
    t.restore.forEach(r=>{
      const p=players.find(x=>x.id===r.id);
      if(p) p.owner=r.owner;
    });
  }

  tradeState={
    from:t.from,
    to:t.to,
    offer:JSON.parse(JSON.stringify(t.offer || [])),
    request:JSON.parse(JSON.stringify(t.request || []))
  };

  trades.splice(i,1);

  renderTrades();

}

function selectAllRenewals(flag){document.querySelectorAll(".renChk").forEach(c=>c.checked=flag);calcRenewals();}
function calcRenewals(){
  let sum=0;
  const selected=[...document.querySelectorAll(".renChk:checked")];
  selected.forEach(c=>sum+=Number(c.dataset.val||0));
  const creditEl=q("renTotal");
  if(creditEl) creditEl.textContent=sum.toFixed(1).replace(".0","")+" crediti";
  const coinEl=q("renCoinTotal");
  if(coinEl) coinEl.textContent=(selected.length*5)+" HM Coin";
}

function renewSelectedWithCoin(code){
  if(!(isAdmin() || canEditTeam(code))) return deny("Puoi rinnovare solo per le tue squadre.");
  const selectedIds=[...document.querySelectorAll(".renChk:checked")].map(c=>c.dataset.id).filter(Boolean);
  const selectedCount=selectedIds.length;

  if(!selectedCount){
    alert("Seleziona almeno un calciatore da rinnovare.");
    return;
  }

  const costCoin=selectedCount*5;
  const t=team(code);
  const availableCoin=Number(t?.hmcoin||0);

  if(availableCoin < costCoin){
    alert("HM Coin insufficienti. Servono "+costCoin+" HM Coin, disponibili "+availableCoin+".");
    return;
  }

  if(!confirm("Confermi rinnovi con HM Coin? I selezionati avranno Scadenza = RINNOVATO, gli esclusi Scadenza = IN SCADENZA. Verranno scalati "+costCoin+" HM Coin da "+code+" (5 Coin per ogni contratto selezionato).")) return;

  // Identica logica dell'attuale rinnovo in crediti:
  // selezionati = RINNOVATO, esclusi = IN SCADENZA.
  ownedPlayers(code).forEach(p=>{
    if(selectedIds.includes(p.id)){
      p.deadline="RINNOVATO";
    }else{
      p.deadline="IN SCADENZA";
    }
  });

  t.hmcoin=availableCoin-costCoin;

  saveAll();
  renderTeamDetail();
}

function renewSelected(code){
  const selectedIds=[...document.querySelectorAll(".renChk:checked")].map(c=>c.dataset.id).filter(Boolean);
  let sum=0;
  document.querySelectorAll(".renChk:checked").forEach(c=>sum+=Number(c.dataset.val||0));

  if(!confirm("Confermi rinnovi? I selezionati avranno Scadenza = RINNOVATO, gli esclusi Scadenza = IN SCADENZA. Verranno scalati "+sum+" crediti da "+code+".")) return;

  ownedPlayers(code).forEach(p=>{
    if(selectedIds.includes(p.id)){
      p.deadline="RINNOVATO";
    }else{
      p.deadline="IN SCADENZA";
    }
  });

  const t=team(code);
  t.credits=(Number(t.credits)||0)-sum;

  saveAll();
  renderTeamDetail();
}
function renderRenewals(){
  q("view-renewals").innerHTML = `<div class="between"><h2>Rinnovi/Stipendi</h2><select class="input" onchange="selectedTeam=this.value;renderRenewals()">${teams.filter(t=>t.code!=="SVIN").map(t=>`<option value="${t.code}" ${t.code===selectedTeam?"selected":""}>${t.code} · ${t.name}</option>`).join("")}</select></div>${renewalsHtml(selectedTeam)}`;

        reader2.onload=()=>{orgData[code].stadiumImg=reader2.result;finish();};
        reader2.readAsDataURL(stadiumFile);

}



function ensureCoachesManager(){
  if(coachesManager) return;
  coachesManager = {selectedTier:1, coaches:INITIAL_COACHES};
  saveAll();
}
function coachCostByTier(tier){
  return Number(tier)===1?40:Number(tier)===2?25:10;
}
function coachById(id){
  ensureCoachesManager();
  return coachesManager.coaches.find(c=>c.id===id);
}
function coachName(id){
  const c=coachById(id);
  return c ? c.name : "";
}
function coachOptions(selected="", teamCode=""){
  ensureCoachesManager();
  return coachesManager.coaches
    .filter(c=>!c.owner || c.owner===teamCode || c.id===selected)
    .sort((a,b)=>a.tier-b.tier || a.name.localeCompare(b.name))
    .map(c=>`<option value="${c.id}" ${c.id===selected?"selected":""}>${esc(c.name)} · ${c.tier}ª fascia · costo ${c.cost}</option>`)
    .join("");
}
function assignCoachToTeam(teamCode, coachId, years=1){
  ensureCoachesManager();
  orgData[teamCode]=orgData[teamCode]||{};
  const oldId=orgData[teamCode].coachId;
  if(oldId===coachId && Number(orgData[teamCode].coachYears||1)===Number(years)) return;

  if(oldId){
    const old=coachById(oldId);
    if(old){old.owner="";old.status="Svincolato";}
  }

  orgData[teamCode].coachId=coachId;
  orgData[teamCode].coachYears=years;

  if(coachId){
    const c=coachById(coachId);
    if(c){
      const total=(Number(c.cost)||coachCostByTier(c.tier))*Number(years||1);
      c.owner=teamCode;
      c.status="Contratto";
      c.contractYears=years;
      const tm=team(teamCode);
      if(tm) tm.credits=(Number(tm.credits)||0)-total;
      news.unshift({
        title:`UFFICIALE: ${c.name} nuovo allenatore di ${teamFullName(teamCode)}`,
        type:"Comunicazione Lega",
        body:`${teamFullName(teamCode)} ha scelto ${c.name} come allenatore. Contratto di ${years} anno/i, costo totale ${total} crediti scalati dal budget società.`,
        author:"Segreteria HM League",
        pinned:false,
        date:new Date().toLocaleDateString("it-IT")
      });
    }
  }
}

function renderCoaches(){

function coachPositionBonus(coach, pos, afterJan, isNew){
  if(!afterJan) return 0;
  pos=Number(pos||0);
  if(Number(coach.tier)===1){
    return pos>=1 && pos<=4 ? 1 : -1;
  }
  if(Number(coach.tier)===2){
    return pos>=1 && pos<=4 ? 0.5 : -0.5;
  }
  if(Number(coach.tier)===3){
    if(isNew && pos>=5 && pos<=8) return 1;
    if(pos>=1 && pos<=4) return 0.5;
    if(pos===7 || pos===8) return -1;
  }
  return 0;
}
function coachConditionBonus(coach, opts){
  const tr=coach.trigger;
  if(tr==="afterSP") return opts.afterSP ? 0.5 : 0;
  if(tr==="def3") return opts.module==="def3" ? 1 : opts.module==="def4" ? -1 : 0;
  if(tr==="def4") return opts.module==="def4" ? 1 : opts.module==="def3" ? -1 : 0;
  if(tr==="oneStriker") return opts.module==="one" ? 1 : opts.module==="two" ? -1 : 0;
  if(tr==="ew") return opts.module==="ew" ? 1 : opts.module==="noew" ? -1 : 0;
  if(tr==="tw2") return opts.module==="tw2" ? 1 : opts.module==="notw2" ? -1 : 0;
  if(tr==="wa") return opts.module==="wa" ? 1 : opts.module==="nowa" ? -1 : 0;
  if(tr==="treq") return opts.module==="treq" ? 1 : opts.module==="notreq" ? -1 : 0;
  return 0;
}
function coachEuropeNote(coach){
  const m=String(coach.traits||"").match(/Coppe Europee\\s*([+\\-]?\\d+(?:,\\d+)?)/i);
  return m ? `Coppe europee: ${m[1]} da aggiungere solo in partita europea` : "";
}

function updateCoachSim(compId,teamCode,pos){
  const org=orgData[teamCode]||{};
  const coach=coachById(org.coachId);
  if(!coach) return;
  const baseId=`sim_${compId}_${teamCode}`;
  const opts={module:q(baseId+"_module")?.value||"",afterSP:q(baseId+"_afterSP")?.checked||false};
  const faith=q(baseId+"_faith")?.checked ? 0.5 : 0;
  const afterJan=q(baseId+"_jan")?.checked||false;
  const isNew=q(baseId+"_new")?.checked||false;
  const total=coachConditionBonus(coach,opts)+faith+coachPositionBonus(coach,pos,afterJan,isNew);
  const out=q(baseId+"_total"); if(out) out.textContent=String(total).replace(".",",");
}
function saveCoachSimSelections(compId){
  if(!requireAdmin()) return;
  const c=competitionsManager.competitions.find(x=>x.id===compId); if(!c) return;
  coachSimSelections[compId]=coachSimSelections[compId]||{};
  (c.standings||[]).forEach(r=>{
    const baseId=`sim_${compId}_${r.teamCode}`;
    if(!q(baseId+"_module")) return;
    coachSimSelections[compId][r.teamCode]={
      module:q(baseId+"_module")?.value||"", afterSP:!!q(baseId+"_afterSP")?.checked,
      faith:!!q(baseId+"_faith")?.checked, jan:!!q(baseId+"_jan")?.checked, isNew:!!q(baseId+"_new")?.checked
    };
  });
  safeSetStorage("hm_coach_sim_selections_v1",coachSimSelections);
  const m=q(`coachSimSaveMsg_${compId}`); if(m)m.innerHTML='<span style="color:#86efac;font-weight:900">✅ Selezioni allenatori salvate in locale.</span>';
}
function restoreCoachSimSelections(compId,sortedRows){
  const saved=coachSimSelections?.[compId]||{};
  (sortedRows||[]).forEach((r,idx)=>{
    const v=saved[r.teamCode]; if(!v) return;
    const baseId=`sim_${compId}_${r.teamCode}`;
    const module=q(baseId+"_module"); if(!module) return;
    module.value=v.module||"";
    const a=q(baseId+"_afterSP"),f=q(baseId+"_faith"),j=q(baseId+"_jan"),n=q(baseId+"_new");
    if(a)a.checked=!!v.afterSP;if(f)f.checked=!!v.faith;if(j)j.checked=!!v.jan;if(n)n.checked=!!v.isNew;
    updateCoachSim(compId,r.teamCode,idx+1);
  });
}

function normalizeTeamText(v){
  return String(v||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
}
function findTeamCodeFromExcelName(name){
  const n=normalizeTeamText(name);
  const aliases={
    "fcskullteam":"SKU","skullteam":"SKU","astoto":"TOT","bvbcasalotti":"BVB","iardinesefc":"IAR","iardinesecalcio":"IAR",
    "floridia":"FLO","atleticojosephino":"JOS","realdiazepam":"DIA","atleticopalermo":"PAL","imperiale09":"IMP","ironteam":"IRO",
    "thebears":"BEA","legiontoto":"LEG","legiontotoxxi":"LEG","youngboysfloridia":"YOU","footballkraken":"KRA","tanadelletigri":"TDT","tanadelletigriaccademy":"TDT","tanadelletigriacademy":"TDT","redbullcasalotti":"RED"
  };
  if(aliases[n]) return aliases[n];
  const exact=(teams||[]).find(t=>normalizeTeamText(t.name)===n || normalizeTeamText(t.code)===n);
  return exact?.code || "";
}
async function importStandingsExcel(compId,event){
  if(!requireAdmin()) return;
  const file=event?.target?.files?.[0];
  if(!file) return;
  const msg=q(`standingImportMsg_${compId}`);
  try{
    if(typeof XLSX==="undefined") throw new Error("Libreria Excel non caricata. Verifica la connessione internet e riapri il gestionale.");
    const data=await file.arrayBuffer();
    const wb=XLSX.read(data,{type:"array"});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
    const headerIndex=raw.findIndex(row=>row.some(v=>normalizeTeamText(v)==="squadra") && row.some(v=>["pt","pttotali"].includes(normalizeTeamText(v))));
    if(headerIndex<0) throw new Error("Non trovo la riga intestazioni con Squadra, Pt. e Pt. Totali.");
    const h=raw[headerIndex].map(normalizeTeamText);
    const col=(...names)=>{for(const nm of names){const i=h.indexOf(normalizeTeamText(nm)); if(i>=0)return i;} return -1;};
    const idx={pos:col("Pos"),team:col("Squadra"),g:col("G"),v:col("V"),n:col("N"),p:col("P"),gf:col("Gf","GF"),gs:col("Gs","GS"),dr:col("Dr","DR"),pt:col("Pt.","Pt"),tot:col("Pt. Totali","Pt Totali")};
    if(idx.team<0||idx.pt<0||idx.tot<0) throw new Error("Colonne obbligatorie non trovate.");
    const parsed=[];
    for(const row of raw.slice(headerIndex+1)){
      const teamName=String(row[idx.team]||"").trim(); if(!teamName) continue;
      const code=findTeamCodeFromExcelName(teamName);
      if(!code) continue;
      parsed.push({teamCode:code,teamName,played:row[idx.g]??0,wins:row[idx.v]??0,draws:row[idx.n]??0,losses:row[idx.p]??0,gf:row[idx.gf]??0,ga:row[idx.gs]??0,gd:row[idx.dr]??0,points:row[idx.pt]??0,totalPoints:row[idx.tot]??0});
    }
    if(!parsed.length) throw new Error("Nessuna squadra riconosciuta nel file.");
    const c=competitionsManager.competitions.find(x=>x.id===compId);
    if(!c) throw new Error("Competizione non trovata.");
    c.participants=parsed.map(r=>r.teamCode);
    c.standings=parsed;
    // L'import Excel è una modifica locale valida: impedisce a un rientro focus/cloud
    // di sovrascrivere immediatamente la classifica appena caricata.
    HM_HAS_UNSAVED_CHANGES = true;
    safeSetStorage("hm_competitions_manager_v1",competitionsManager);
    if(msg) msg.innerHTML=`<span style="color:#86efac;font-weight:900">✅ Importate ${parsed.length} squadre da ${esc(file.name)}. Premi “Salva classifica” per confermare il salvataggio locale.</span>`;
    renderCompetitionManager();
    setTimeout(()=>{const m=q(`standingImportMsg_${compId}`);if(m)m.innerHTML=`<span style="color:#86efac;font-weight:900">✅ Importate ${parsed.length} squadre da ${esc(file.name)}.</span>`;},0);
  }catch(err){
    console.error(err); if(msg) msg.innerHTML=`<span style="color:#fca5a5;font-weight:900">❌ ${esc(err.message||err)}</span>`;
  }finally{
    if(event?.target) event.target.value="";
    hmEndFilePickerSoon();
  }
}

function advanceBracket(compId,ri,mi,side){
  const c=competitionsManager.competitions.find(x=>x.id===compId);
  const match=c.bracket[ri].matches[mi];
  const winner=side==="a"?match.a:match.b;
  match.winner=winner;
  if(c.bracket[ri+1]){
    const nextMatch=c.bracket[ri+1].matches[Math.floor(mi/2)];
    if(mi%2===0) nextMatch.a=winner; else nextMatch.b=winner;
  }
  saveAll();renderCompetitionManager();
}

function trophiesCount(code){
  return (honors||[]).filter(h=>h.team===code).length;
}

function ensureRanking(){
  if(!Array.isArray(rankingData)) rankingData=[];
  if(!Array.isArray(rankingHidden)) rankingHidden=[];
  teams.filter(t=>t.code!=="SVIN" && !rankingHidden.includes(t.code)).forEach(t=>{
    if(!rankingData.find(r=>r.code===t.code)){
      rankingData.push({code:t.code,points:0,manualOrder:""});
    }
  });
}

function renderRanking(){
  if(!Array.isArray(rankingData)) rankingData=[];
  rankingData = cleanRankingRows(rankingData);
  // In sola lettura non deve partire ensureRanking(), perché è una funzione admin
  // e generava l'alert continuo "Solo Federico admin può modificare".
  if(typeof isAdmin === "function" && isAdmin()) ensureRanking();
  rankingData = cleanRankingRows(rankingData);
  const rows = rankingData
    .filter(r=>r.code && teamExistsStrict(r.code) && r.code!=="SVIN" && !rankingHidden.includes(r.code))
    .map(r=>({...r,trophies:trophiesCount(r.code)}))
    .sort((a,b)=>{
      const ma = a.manualOrder==="" ? 9999 : Number(a.manualOrder);
      const mb = b.manualOrder==="" ? 9999 : Number(b.manualOrder);
      if(ma!==9999 || mb!==9999) return ma-mb;
      return Number(b.points||0)-Number(a.points||0);
    });

  q("view-ranking").innerHTML = `
    <div class="between">
      <div><h2>Ranking società</h2><p class="muted">Classifica ordinata per punti. I trofei vengono presi automaticamente dall'Albo d'oro.</p></div>
      <div class="row"><button class="btn primary" onclick="addTeam()">Aggiungi società</button><button class="btn" onclick="addRankingRow()">Aggiungi al ranking</button></div>
    </div>
    <table class="table" style="margin-top:14px">
      <tr><th>#</th><th>Società</th><th>Punti</th><th>Trofei</th><th>Ordine manuale</th><th>Azioni</th></tr>
      ${rows.map((r,i)=>{
        const t=team(r.code);
        return `<tr>
          <td><b>${i+1}</b></td>
          <td><div class="row">${logo(r.code,42)}<div><b>${esc(t.name)}</b><div class="muted">${r.code} · ${esc(t.division)}</div></div></div></td>
          <td><input class="input" style="width:90px" value="${esc(r.points||0)}" onchange="updateRanking('${r.code}','points',this.value)"></td>
          <td><b>${r.trophies}</b></td>
          <td><input class="input" style="width:90px" placeholder="auto" value="${esc(r.manualOrder||"")}" onchange="updateRanking('${r.code}','manualOrder',this.value)"></td>
          <td><button class="btn" onclick="editTeam('${r.code}')">Modifica società</button><button class="btn red" onclick="removeRanking('${r.code}')">Togli ranking</button></td>
        </tr>`;
      }).join("")}
    </table>`;
}

function updateRanking(code,field,value){
  ensureRanking();
  const row=rankingData.find(r=>r.code===code);
  if(row){row[field]=value;saveAll();renderRanking();}
}
function removeRanking(code){
  if(!confirm("Togliere questa società dal ranking?")) return;
  if(!rankingHidden.includes(code)) rankingHidden.push(code);

function syncSeasonIndividualTitles(seasonItem, oldSeason=null){
  if(oldSeason){
    individualTitles=individualTitles.filter(x=>x.sourceSeason!==oldSeason);
  }
  individualTitles=individualTitles.filter(x=>x.sourceSeason!==seasonItem.season);

  (seasonItem.awards||[]).forEach(a=>{
    if(a.teamCode && team(a.teamCode)){
      individualTitles.push({
        team:a.teamCode,
        award:a.award || a.label || "",
        player:a.player || a.value || "",
        season:seasonItem.season,
        sourceSeason:seasonItem.season
      });
    }
  });
}

function renderAuctionSearchResults(){const box=q("auctionSearchResults");if(!box)return;const s=(q("aucSearch")?.value||"").toLowerCase();const list=players.filter(p=>[p.name,p.role,p.current,p.owner].join(" ").toLowerCase().includes(s)).slice(0,50);box.innerHTML=list.map(p=>`<div class="playerRow">${jersey(p.owner||"SVIN",44)}<div><b>${esc(p.name)}</b><div class="muted">${esc(p.role)} · ${esc(p.current)} · ${esc(p.owner)}</div></div><button class="btn primary" onclick="startAuction('${p.id}')">Metti in asta</button></div>`).join("")||'<div class="muted">Nessun calciatore trovato.</div>';}
function startAuction(id){auctionState.playerId=id;auctionState.bids=[];saveAll();renderAuction();}
function openManualAuctionPlayer(){const name=prompt("Nome calciatore");if(!name)return;const p={id:"P"+Date.now(),name,role:prompt("Ruolo","")||"",current:"",owner:"SVIN",status:"ASTA",bonus:"",contract:"0",deadline:""};players.push(p);startAuction(p.id);}
function placeBid(){const p=auctionPlayer();if(!p)return;const teamCode=q("bidTeam").value;const amount=Number(q("bidAmount").value||0);const min=highestBid()?Number(highestBid().amount)+1:1;if(amount<min){alert("Offerta minima "+min);return;}auctionState.bids.push({team:teamCode,amount,date:new Date().toLocaleString("it-IT")});saveAll();renderAuction();}
function hammerAuction(){const p=auctionPlayer();const bid=highestBid();if(!p||!bid){alert("Serve almeno un'offerta.");return;}const oldOwner=p.owner, oldCurrent=p.current, oldCredits=team(bid.team)?.credits;p.owner=bid.team;p.current=bid.team;team(bid.team).credits=(Number(team(bid.team).credits)||0)-Number(bid.amount||0);auctionState.history.unshift({playerId:p.id,playerName:p.name,team:bid.team,amount:bid.amount,oldOwner,oldCurrent,oldCredits,date:new Date().toLocaleString("it-IT")});auctionState.playerId="";auctionState.bids=[];saveAll();renderAuction();}
function undoAuctionOperation(i){const op=auctionState.history[i];if(!op)return;const p=players.find(x=>x.id===op.playerId);if(p){p.owner=op.oldOwner;p.current=op.oldCurrent;}const t=team(op.team);if(t)t.credits=op.oldCredits;auctionState.history.splice(i,1);saveAll();renderAuction();}

function applyPresidentActionCredits(row,reverse=false){const t=team(row.team);if(!t)return;if(row.suspended&&row.status!=="Pagata")return;const d=Number(row.creditDelta||0);t.credits=(Number(t.credits)||0)+(reverse?-d:d);}
function savePresidentAction(index=null){const a=actionType(q("paAction").value);const status=q("paStatus").value;const creditDelta=a.suspended?(status==="Pagata"?-Number(a.cost):0):-Number(a.cost);const row={team:q("paTeam").value,action:a.name,against:q("paAgainst").value,competition:q("paCompetition").value,status,suspended:!!a.suspended,cost:a.cost,creditDelta,date:index===null?new Date().toLocaleString("it-IT"):presidentActions[index].date,applied:false};if(index!==null){const old=presidentActions[index];if(old?.applied)applyPresidentActionCredits(old,true);presidentActions[index]=row;}else{presidentActions.unshift(row);index=0;}if(row.status!=="Annullata"){applyPresidentActionCredits(row,false);presidentActions[index].applied=true;}saveAll();closeTradeModal();renderPresidentActions();}
function deletePresidentAction(i){const row=presidentActions[i];if(row?.applied)applyPresidentActionCredits(row,true);presidentActions.splice(i,1);saveAll();renderPresidentActions();}
